<style>
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}.hd a{color:var(--gold);text-decoration:none;font-weight:700}.hd img{height:38px;vertical-align:middle;margin-right:8px}
.sb{position:relative;margin:6px 0 14px}.sb input{padding:15px 16px;border-radius:99px;font-size:17px;margin:0;border-color:var(--gold)}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{flex:1;background:none;border:1px solid var(--line);color:var(--mut)}.mode button.on{background:var(--gold);color:#080d1f}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;color:var(--txt);font-size:14px}.tile span{display:block;font-size:30px;margin-bottom:4px}.tile.on{border-color:var(--gold)}.tiles:not(.open) .more{display:none}.tile.xp{border-style:dashed;color:var(--gold)}.tile.xp .b,.tiles.open .tile.xp .a{display:none}.tiles.open .tile.xp .b{display:inline}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.vc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}.vc .cv{height:110px;background:linear-gradient(135deg,#14265f,#080d1f);background-size:cover;background-position:center}.vc .bd{padding:12px;display:flex;gap:10px;align-items:center}.vc .lg{width:48px;height:48px;border-radius:50%;background:#fff center/cover;border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}.pc img,.pc .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#0b1226;display:flex;align-items:center;justify-content:center;font-size:32px}.pc b{font-size:14px}.pc .pr{color:var(--ok);font-weight:700}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:6px 12px}
.cb{position:fixed;right:14px;bottom:14px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.5);padding:14px 18px}
.sh{position:fixed;inset:0;background:rgba(4,8,20,.85);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sh .bx{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px;border-radius:18px 18px 0 0;border:1px solid var(--line)}@media(min-width:900px){.sh{align-items:center}.sh .bx{border-radius:18px}}
.mq{overflow:hidden;margin:10px -14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}.mqt{display:flex;gap:12px;width:max-content;animation:mqrun var(--d,45s) linear infinite}.mq:hover .mqt{animation-play-state:paused}@keyframes mqrun{to{transform:translateX(-50%)}}
.ad{flex:0 0 300px;min-height:150px;border-radius:18px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:pointer;background:linear-gradient(135deg,#1b2f7a,#0f1a47);background-size:cover;background-position:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.ad:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,20,.1),rgba(4,8,20,.82))}.ad>*{position:relative}.ad .tag{font:700 10px system-ui;letter-spacing:.14em;background:var(--gold);color:#080d1f;padding:3px 8px;border-radius:99px;align-self:flex-start;margin-bottom:auto}.ad b{font-size:18px;line-height:1.15}.ad small{opacity:.9;font-size:13px}.ad .pp{color:var(--gold);font-weight:700}
.rc{flex:0 0 150px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.rc img,.rc .ph{width:100%;height:110px;object-fit:cover;background:#14265f;display:flex;align-items:center;justify-content:center;font-size:34px}.rc div{padding:8px;font-size:13px}.rc b{display:block;font-size:13.5px;line-height:1.2}.rc span{color:var(--gold);font-weight:700}
@media(prefers-reduced-motion:reduce){.mqt{animation:none}.mq{overflow-x:auto}}
</style>

<body><div class="w"><div class="hd"><a href="index.html"><img src="logo-mark.png" alt="The Velos Group">Velos</a><div><a href="foods.html">Foods</a> &nbsp; <a href="#/track">Track order</a> &nbsp; <a href="vendor.html">Sell on Velos</a></div></div><div id="v"></div></div><div id="toast" hidden></div><div id="sheet"></div>
<script>
var S = window.VELOS_SUPABASE, db = supabase.createClient(S.url, S.key), $ = function(i){ return document.getElementById(i); }, V = function(h){ $('v').innerHTML = h; };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }, ugx = function(n){ return 'UGX ' + Math.round(n || 0).toLocaleString('en-US'); };
function toast(m, b){ var t = $('toast'); t.textContent = m; t.style.background = b ? '#b3261e' : ''; t.style.color = b ? '#fff' : ''; t.hidden = false; setTimeout(function(){ t.hidden = true; }, 2800); }
var MODE = 'retail', CAT = '', CART = {}, STORE = null, CAT_DATA = null, RET = null;
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } } function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function route(){
  var h = location.hash.replace(/^#\/?/, ''), p = h.split('/');
  if(p[0] === 's' && p[1]) return store(p[1]); if(p[0] === 'q') return search(decodeURIComponent(p[1] || '')); if(p[0] === 'track') return track(); if(p[0] === 'c') CAT = p[1] || ''; else CAT = '';
  if(p[0] === 'm') MODE = p[1] === 'wholesale' ? 'wholesale' : 'retail';
  home();
}

function adHtml(x, toStore){ var bg = x.image_url ? ' style="background-image:url(' + esc(x.image_url) + ')"' : ''; return '<div class="ad"' + bg + ' onclick="' + (toStore ? "location.hash=\'#/s/" + x.partner_id + "\'" : (x.product_id ? "chg(\'" + x.product_id + "\',1)" : "window.scrollTo({top:0,behavior:\'smooth\'})")) + '"><span class="tag">AD · ' + esc(x.store || 'OFFER') + '</span><b>' + esc(x.title) + '</b>' + (x.body ? '<small>' + esc(x.body) + '</small>' : '') + (x.promo_price_ugx ? '<span class="pp">' + ugx(x.promo_price_ugx) + '</span>' : '') + (x.ends_on ? '<small>Ends ' + esc(x.ends_on) + '</small>' : '') + '</div>'; }
function marquee(items, dur){ if(!items.length) return ''; var h = items.join(''), rep = items.length < 4 ? h + h + h + h : h + h; return '<div class="mq"><div class="mqt" style="--d:' + (dur || 45) + 's">' + rep + '</div></div>'; }
async function loadAds(el, partner, toStore){ try{ var r = await db.rpc('public_promos', {p_partner:partner || null}), L = r.data || []; if(L.length && $(el)) $(el).innerHTML = '<h2 style="margin:6px 0 0">Offers</h2>' + marquee(L.map(function(x){ return adHtml(x, toStore); }), 40); }catch(e){} }
async function home(){
  var cats = VCATS;
  V('<div class="sb"><input id="q" placeholder="Search products, shops, hotels, venues…" onkeydown="if(event.key===\'Enter\')go()"></div>'
    + '<div class="mode"><button id="mr" class="' + (MODE === 'retail' ? 'on' : '') + '" onclick="setMode(\'retail\')">🛍️ Retail · single items</button><button id="mw" class="' + (MODE === 'wholesale' ? 'on' : '') + '" onclick="setMode(\'wholesale\')">📦 Wholesale · bulk</button></div>'
    + '<div class="tiles' + (CAT && cats.findIndex(function(c){ return c.k === CAT; }) >= 7 ? ' open' : '') + '" id="tl">' + cats.map(function(c, i){ return '<button class="tile ' + (CAT === c.k ? 'on' : '') + (i >= 7 ? ' more' : '') + '" onclick="setCat(\'' + c.k + '\')"><span>' + c.i + '</span>' + esc(c.l) + '</button>'; }).join('') + (cats.length > 8 ? '<button class="tile xp" onclick="$(\'tl\').classList.toggle(\'open\')"><span>⋯</span><b class="a">Explore all</b><b class="b">Show fewer</b></button>' : '') + '</div>'
    + '<div id="ads"></div><h2 id="ttl">' + (CAT ? esc(vcat(CAT).l) : 'All stores') + '</h2><div id="vl" class="vg"><p class="m">Loading…</p></div>');
  loadAds('ads', null, true);
  var r = await db.rpc('public_partners', {p_category:CAT || null, p_mode:(vcat(CAT).kind === 'goods' || !CAT) ? MODE : null, p_q:null}), L = r.data || [];
  $('vl').innerHTML = L.length ? L.map(vcard).join('') : '<div class="c" style="grid-column:1/-1"><p>No stores here yet.</p><p class="m">New partners are joining every week. <a class="gold" href="vendor.html">Open your own store on Velos</a>.</p></div>';
}
function vcard(p){ var c = vcat(p.category); return '<div class="vc" onclick="location.hash=\'#/s/' + p.id + '\'"><div class="cv" style="' + (p.cover_url ? 'background-image:url(' + esc(p.cover_url) + ')' : '') + '"></div><div class="bd"><div class="lg" style="' + ((p.logo_url || p.cover_url) ? 'background-image:url(' + esc(p.logo_url || p.cover_url) + ')' : '') + '">' + ((p.logo_url || p.cover_url) ? '' : c.i) + '</div><div><b>' + esc(p.business_name) + '</b><div class="m">' + esc(c.l) + ' · ' + esc(p.city || '') + (p.country && p.country !== 'Uganda' ? ', ' + esc(p.country) : '') + '</div><div class="m">' + p.products + ' items' + (p.sale_mode === 'wholesale' ? ' · wholesale' : p.sale_mode === 'both' ? ' · retail & wholesale' : '') + '</div></div></div></div>'; }
function setMode(m){ location.hash = '#/m/' + m; }
function setCat(k){ location.hash = '#/c/' + (CAT === k ? '' : k); }
function go(){ var q = $('q').value.trim(); if(q.length >= 2) location.hash = '#/q/' + encodeURIComponent(q); }

async function search(q){
  V('<div class="sb"><input id="q" value="' + esc(q) + '" onkeydown="if(event.key===\'Enter\')go()"></div><p><a class="gold" href="#/">← All stores</a></p><h2>Results for “' + esc(q) + '”</h2><div id="sr"><p class="m">Searching…</p></div>');
  var a = await db.rpc('public_product_search', {p_q:q}), b = await db.rpc('public_partners', {p_category:null, p_mode:null, p_q:q}), P = a.data || [], L = b.data || [];
  $('sr').innerHTML = (L.length ? '<h3>Stores</h3><div class="vg">' + L.map(vcard).join('') + '</div>' : '') + (P.length ? '<h3>Products</h3><div class="pg">' + P.map(function(p){ return '<div class="pc" onclick="location.hash=\'#/s/' + p.partner_id + '\'" style="cursor:pointer">' + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" loading="lazy">' : '<div class="ph">📦</div>') + '<b>' + esc(p.name) + '</b><span class="pr">' + ugx(p.price_ugx) + ' / ' + esc(p.unit) + '</span><span class="m">from ' + esc(p.partner) + '</span></div>'; }).join('') + '</div>' : '') + (!L.length && !P.length ? '<div class="c"><p>Nothing found for that yet.</p><p class="m">Try another word, or <a class="gold" href="sourcing-request.html">ask Velos to source it for you</a>.</p></div>' : '');
}

/* ---------- a store ---------- */
async function store(id){
  V('<p class="m">Loading…</p>'); var r = await db.rpc('public_partner_catalog', {p_partner:id}); if(!r.data){ V('<div class="c"><p>This store is not open right now.</p><a class="b" href="#/">Back to all stores</a></div>'); return; }
  STORE = r.data; CART = lsGet('velos_cart_' + id) || {}; var p = STORE.partner, c = vcat(p.category), hotel = p.kind !== 'goods', P = STORE.products, cats = {};
  P.forEach(function(x){ var k = x.category || 'Items'; (cats[k] = cats[k] || []).push(x); });
  V('<p><a class="gold" href="#/">← All stores</a></p><div class="c" style="padding:0;overflow:hidden"><div style="height:140px;background:' + (p.cover_url ? 'url(' + esc(p.cover_url) + ') center/cover' : 'linear-gradient(135deg,#14265f,#080d1f)') + '"></div><div style="padding:14px"><h1>' + esc(p.business_name) + '</h1><div class="m">' + esc(c.l) + ' · ' + esc(p.city || '') + ', ' + esc(p.country) + '</div>' + (p.description ? '<p>' + esc(p.description) + '</p>' : '') + '</div></div>'
    + '<div id="ads"></div>' + (P.length >= 2 ? '<h2 style="margin:6px 0 0">Browse the shop</h2>' + marquee(P.filter(function(x){ return x.in_stock; }).map(function(x){ return '<div class="rc" onclick="chg(\'' + x.id + '\',1)">' + (x.image_url ? '<img src="' + esc(x.image_url) + '" alt="" loading="lazy">' : '<div class="ph">📦</div>') + '<div><b>' + esc(x.name) + '</b><span>' + ugx(x.price_ugx) + '</span></div></div>'; }), 50) + '<p class="m" style="margin:-4px 0 6px">Tap a card to add it to your cart.</p>' : '')
    + (hotel ? '<p class="m">Choose a room or venue, then Velos confirms your booking after your payment.</p>' : '') + (P.length ? Object.keys(cats).map(function(k){ return '<h2>' + esc(k) + '</h2><div class="pg">' + cats[k].map(function(x){ return pcard(x); }).join('') + '</div>'; }).join('') : '<div class="c"><p class="m">This store is adding its products. Check back soon.</p></div>') + '<button class="cb" id="cb" onclick="cart()" hidden></button>');
  cartBtn(); loadAds('ads', id, false);
}
function pcard(x){ var n = CART[x.id] ? CART[x.id].q : 0; return '<div class="pc">' + (x.image_url ? '<img src="' + esc(x.image_url) + '" alt="" loading="lazy">' : '<div class="ph">📦</div>') + '<b>' + esc(x.name) + '</b>' + (x.description ? '<span class="m">' + esc(x.description).slice(0, 70) + '</span>' : '') + '<span class="pr">' + ugx(x.price_ugx) + ' / ' + esc(x.unit) + '</span>' + (x.sale_mode === 'wholesale' ? '<span class="pill">Wholesale · min ' + x.min_qty + '</span>' : '') + (x.in_stock ? '<div class="qty" id="q-' + x.id + '">' + qtyHtml(x, n) + '</div>' : '<span class="pill bad">Out of stock</span>') + '</div>'; }
function qtyHtml(x, n){ return n ? '<button class="g" onclick="chg(\'' + x.id + '\',-1)">−</button><b>' + n + '</b><button onclick="chg(\'' + x.id + '\',1)">+</button>' : '<button class="full" style="margin:0" onclick="chg(\'' + x.id + '\',1)">Add</button>'; }
function chg(id, d){ var x = STORE.products.filter(function(p){ return p.id === id; })[0], cur = CART[id] ? CART[id].q : 0, wh = x.sale_mode === 'wholesale', q;
  if(d > 0) q = (cur === 0 && wh) ? x.min_qty : cur + 1; else { q = cur - 1; if(wh && q < x.min_qty) q = 0; }
  if(q <= 0) delete CART[id]; else CART[id] = {q:q}; lsSet('velos_cart_' + STORE.partner.id, CART); var el = $('q-' + id); if(el) el.innerHTML = qtyHtml(x, CART[id] ? CART[id].q : 0); cartBtn(); }
function lines(){ return Object.keys(CART).map(function(id){ var x = STORE.products.filter(function(p){ return p.id === id; })[0]; return x ? {x:x, q:CART[id].q} : null; }).filter(Boolean); }
function total(){ return lines().reduce(function(s, l){ return s + l.x.price_ugx * l.q; }, 0); }
function cartBtn(){ var b = $('cb'); if(!b) return; var n = lines().reduce(function(s, l){ return s + l.q; }, 0); b.hidden = !n; b.textContent = '🛒 ' + n + ' item' + (n > 1 ? 's' : '') + ' · ' + ugx(total()); }
var DL = {ful:'delivery', info:{}, fee:0, km:0, pinned:false, quote:false, pid:null, ctl:null}, LASTDOC = null;
function hav(a1, b1, c2, d2){ var p = Math.PI / 180, x = Math.sin((c2 - a1) * p / 2), y = Math.sin((d2 - b1) * p / 2), h = x * x + Math.cos(a1 * p) * Math.cos(c2 * p) * y * y; return 12742 * Math.asin(Math.sqrt(h)); }
function feeFor(km){ var i = DL.info || {}; return Math.max(Math.round(km * (+i.per_km || 900) / 100) * 100, +i.min_fee || 0); }
function calc(st){ if(!st || st.lat == null) return; var i = DL.info || {}; DL.pinned = true;
  if(i.lat == null){ DL.quote = true; DL.km = 0; DL.fee = 0; billUI(); return; }
  DL.quote = false; var s = hav(i.lat, i.lng, st.lat, st.lng); DL.km = Math.round(s * 1.3 * 10) / 10; DL.fee = feeFor(DL.km); billUI();
  var my = (DL.seq = (DL.seq || 0) + 1); fetch('https://router.project-osrm.org/route/v1/driving/' + i.lng + ',' + i.lat + ';' + st.lng + ',' + st.lat + '?overview=false').then(function(r){ return r.json(); })
    .then(function(j){ if(my !== DL.seq) return; if(j.routes && j.routes[0]){ DL.km = Math.max(Math.round(j.routes[0].distance / 100) / 10, Math.round(s * 10) / 10); DL.fee = feeFor(DL.km); billUI(); } }).catch(function(){}); }
function billUI(){ var e = $('bill'); if(!e) return; var t = total(), hotel = STORE.partner.kind !== 'goods', pick = DL.ful === 'pickup', del = (hotel || pick) ? 0 : DL.fee;
  var dl = hotel ? '' : '<div class="row"><span>Delivery</span><b>' + (pick ? 'None (pick-up)' : !DL.pinned ? 'Pin your location' : DL.quote ? 'Velos will confirm' : ugx(DL.fee) + ' · ' + DL.km + ' km') + '</b></div>';
  e.innerHTML = '<div class="row"><span>Items total</span><b>' + ugx(t) + '</b></div>' + dl + '<div class="row" style="padding-top:6px"><b>Total to pay</b><b class="gold" style="font-size:18px">' + ugx(t + del) + '</b></div>'; }
function fuSet(v){ DL.ful = v; var b = $('dlBox'); if(b) b.style.display = v === 'delivery' ? '' : 'none'; billUI(); }
function docOrder(extra){ var g = function(i){ return ($(i) || {value:''}).value.trim(); }, t = total(), ctl = DL.ctl && DL.ctl.get(), hotel = STORE.partner.kind !== 'goods', pick = DL.ful === 'pickup' || hotel;
  return Object.assign({store:STORE.partner.business_name, date:new Date(), mode:pick ? 'pickup' : 'delivery', km:DL.km, delivery:pick ? 0 : DL.fee,
    customer:{name:g('cn'), phone:g('cp'), email:g('ce'), address:hotel ? g('ca') : pick ? 'Pick-up at ' + STORE.partner.business_name : (ctl ? ctl.text : '')},
    lines:lines().map(function(l){ return {name:l.x.name, qty:l.q, unit:l.x.unit, price:l.x.price_ugx}; }), paid:0}, extra || {}); }
function draftDoc(){ var g = function(i){ return $(i).value.trim(); }; if(g('cn').length < 2){ $('ce2').textContent = 'Enter your name so it appears on the quotation.'; return; } $('ce2').textContent = ''; VelosDocs.sheet(docOrder(), {draft:true}); }
async function cart(){
  var L = lines(), t = total(), saved = lsGet('velos_cust') || {}, hotel = STORE.partner.kind !== 'goods';
  if(!hotel && DL.pid !== STORE.partner.id){ var q = await db.rpc('public_partner_location', {p_partner:STORE.partner.id}); DL.info = q.data || {}; DL.pid = STORE.partner.id; }
  DL.ful = 'delivery'; DL.fee = 0; DL.km = 0; DL.pinned = false; DL.quote = false; DL.ctl = null;
  $('sheet').innerHTML = '<div class="sh" onclick="if(event.target===this)closeSh()"><div class="bx"><div class="row"><h2 style="margin:0">Your order</h2><button class="g" onclick="closeSh()">✕</button></div>' + L.map(function(l){ return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>' + l.q + ' × ' + esc(l.x.name) + '</span><b>' + ugx(l.x.price_ugx * l.q) + '</b></div>'; }).join('')
    + '<div id="bill" style="padding:8px 0"></div>'
    + (hotel ? '' : '<b>How would you like to receive your order?</b><label class="row" style="justify-content:flex-start;gap:8px"><input type="radio" name="fu" value="delivery" checked style="width:auto" onchange="fuSet(this.value)"> Delivery to my location</label><label class="row" style="justify-content:flex-start;gap:8px"><input type="radio" name="fu" value="pickup" style="width:auto" onchange="fuSet(this.value)"> Pick up from the store (no delivery fee)</label><div id="dlBox"><div id="dlMap"></div></div>')
    + '<input id="cn" placeholder="Your name *" value="' + esc(saved.n || '') + '"><input id="cp" type="tel" placeholder="Phone / WhatsApp *" value="' + esc(saved.p || '') + '"><input id="ce" type="email" placeholder="Email (for your receipt)" value="' + esc(saved.e || '') + '">'
    + (hotel ? '<input id="ca" placeholder="Dates and number of guests *">' : '') + '<textarea id="cm" placeholder="Note to the store (optional)"></textarea>'
    + '<button class="full" onclick="place()">Place order</button><button class="g full" onclick="draftDoc()">📝 Get a quotation or invoice (PDF)</button><p id="ce2" class="m bad"></p></div></div>';
  billUI(); if(!hotel) DL.ctl = VelosLoc.field('dlMap', {title:'Your delivery location', onChange:calc});
}
function closeSh(){ $('sheet').innerHTML = ''; }
async function place(){
  var g = function(i){ return ($(i) || {value:''}).value.trim(); }, hotel = STORE.partner.kind !== 'goods', pick = !hotel && DL.ful === 'pickup', ctl = DL.ctl && DL.ctl.get();
  if(g('cn').length < 2 || g('cp').length < 7){ $('ce2').textContent = 'Please enter your name and phone number.'; return; }
  if(hotel && !g('ca')){ $('ce2').textContent = 'Please add the dates and number of guests.'; return; }
  if(!hotel && !pick){ if(!ctl){ $('ce2').textContent = 'Please pin your delivery location on the map.'; return; } if(ctl.text.length < 3){ $('ce2').textContent = 'Add a building or landmark next to the map pin.'; return; } }
  var items = lines().map(function(l){ return {id:l.x.id, qty:l.q}; }), addr = hotel ? g('ca') : pick ? 'Pick-up at ' + STORE.partner.business_name : ctl.text, doc0 = docOrder();
  var base = {p_partner:STORE.partner.id, p_items:items, p_name:g('cn'), p_phone:g('cp'), p_email:g('ce'), p_address:addr, p_note:g('cm')};
  var r = await db.rpc('partner_place_order_v2', Object.assign({p_lat:ctl ? ctl.lat : null, p_lng:ctl ? ctl.lng : null, p_km:(!hotel && !pick) ? DL.km : null, p_fulfilment:pick ? 'pickup' : 'delivery'}, base));
  if(r.error && /partner_place_order_v2|PGRST202|schema cache|Could not find/i.test(r.error.message || '')) r = await db.rpc('partner_place_order', base);
  if(r.error){ $('ce2').textContent = r.error.message; return; }
  lsSet('velos_cust', {n:g('cn'), p:g('cp'), e:g('ce')}); CART = {}; lsSet('velos_cart_' + STORE.partner.id, CART); cartBtn();
  doc0.no = r.data.order_no; doc0.delivery = (hotel || pick) ? 0 : (r.data.delivery_fee_ugx != null ? r.data.delivery_fee_ugx : DL.fee); doc0.km = r.data.distance_km || DL.km; doc0.date = new Date(); LASTDOC = doc0; payScreen(r.data, g('cp'));
}
async function payScreen(o, phone){
  var q = await db.from('settings').select('key,value').like('key', 'site_pay_%'), P = {}; (q.data || []).forEach(function(x){ P[x.key] = x.value; });
  $('sheet').innerHTML = '<div class="sh"><div class="bx"><h2>Order #' + o.order_no + ' placed ✓</h2><p>' + esc(o.store) + '</p><div class="c"><p>' + (o.delivery_fee_ugx ? 'Delivery: <b>' + ugx(o.delivery_fee_ugx) + '</b>' + (o.distance_km ? ' (' + o.distance_km + ' km)' : '') + '<br>' : o.needs_quote ? 'Delivery: <b>Velos will confirm the fee</b><br>' : '') + 'Total: <b class="gold">' + ugx(o.total_ugx) + '</b></p><p>Pay now to confirm: <b class="gold">' + ugx(o.deposit_required_ugx) + '</b>' + (o.deposit_required_ugx < o.total_ugx ? ' <span class="m">(deposit, balance on delivery)</span>' : '') + '</p><p class="m">Pay to Velos by mobile money. Velos pays the store after delivery.</p><div>MTN: <b>' + esc(P.site_pay_mtn_number || '') + '</b> · ' + esc(P.site_pay_mtn_name || '') + '</div><div>Airtel: <b>' + esc(P.site_pay_airtel_number || '') + '</b> · ' + esc(P.site_pay_airtel_name || '') + '</div></div><button class="g full" onclick="VelosDocs.sheet(LASTDOC)">📄 Quotation, invoice or receipt (PDF)</button><select id="pm"><option value="mtn">Paid with MTN</option><option value="airtel">Paid with Airtel</option></select><input id="pr" placeholder="Transaction ID *"><button class="full" onclick="paid(' + o.order_no + ',\'' + esc(phone) + '\')">I have paid. Submit</button><p id="pe" class="m"></p><p class="m">Save your order number: <b>' + o.order_no + '</b>. Track it any time with your phone number.</p></div></div>';
}
async function paid(no, phone){ var te = VelosTx.check($('pr').value); if(te){ $('pe').className = 'm bad'; $('pe').textContent = te; return; } var r = await db.rpc('partner_order_pay', {p_no:no, p_phone:phone, p_method:$('pm').value, p_ref:$('pr').value.trim()}); if(r.error){ $('pe').className = 'm bad'; $('pe').textContent = r.error.message; return; } $('sheet').innerHTML = '<div class="sh"><div class="bx"><h2>Thank you ✓</h2><p>Velos is confirming your payment. We will then tell the store to prepare order #' + no + ' and send a rider.</p><a class="b full" href="#/track" onclick="closeSh()">Track my order</a> <button class="g full" onclick="closeSh();location.hash=\'#/\'">Keep shopping</button></div></div>'; }

function track(){
  var s = lsGet('velos_cust') || {}; V('<p><a class="gold" href="#/">← All stores</a></p><h2>Track an order</h2><div class="c"><input id="tn" type="number" placeholder="Order number"><input id="tp" type="tel" placeholder="Phone number used on the order" value="' + esc(s.p || '') + '"><button class="full" onclick="doTrack()">Track</button></div><div id="tr"></div>');
}
async function doTrack(){ var r = await db.rpc('partner_order_track', {p_no:Number($('tn').value), p_phone:$('tp').value}); var o = r.data; LASTTRACK = o; if(!o){ $('tr').innerHTML = '<div class="c"><p class="bad">We could not find that order with that phone number.</p></div>'; return; }
  var steps = [['placed', 'Order placed'], ['confirmed', 'Payment confirmed, store preparing'], ['packed', 'Packed, waiting for rider'], ['dispatched', 'On the way'], ['delivered', 'Delivered']], idx = o.payment_status !== 'confirmed' ? 0 : Math.max(1, steps.map(function(x){ return x[0]; }).indexOf(o.status));
  $('tr').innerHTML = '<div class="c"><b>Order #' + o.order_no + ' · ' + esc(o.store) + '</b><p class="m">Total ' + ugx(o.total_ugx) + ' · paid ' + ugx(o.amount_paid_ugx) + '</p>' + (o.status === 'cancelled' ? '<p class="bad">This order was cancelled.</p>' : steps.map(function(s, i){ return '<div class="st ' + (i <= idx ? 'on' : '') + '"><div class="dot"></div><div>' + s[1] + '</div></div>'; }).join('')) + (o.payment_status !== 'unpaid' ? '<button class="g full" onclick="trackDoc()">📄 Receipt, invoice or quotation (PDF)</button>' : '') + (o.payment_status === 'unpaid' ? '<p class="m">Waiting for your payment.</p>' : o.payment_status === 'submitted' ? '<p class="m">Payment received. Velos is confirming it.</p>' : '') + '</div>'; }
var LASTTRACK = null;
function trackDoc(){ var o = LASTTRACK, c = lsGet('velos_cust') || {}; if(!o) return; var sub = 0, ls = (o.items || []).map(function(x){ sub += x.price * x.qty; return {name:x.name, qty:x.qty, unit:x.unit, price:x.price}; });
  VelosDocs.sheet({no:o.order_no, store:o.store, date:new Date(), mode:(o.total_ugx - sub) > 0 ? 'delivery' : 'pickup', delivery:Math.max(0, o.total_ugx - sub), customer:{name:c.n || '', phone:$('tp').value, email:c.e || '', address:''}, lines:ls, paid:o.payment_status === 'confirmed' ? o.amount_paid_ugx : 0}); }
window.addEventListener('hashchange', route); route();
</script></body></html>
