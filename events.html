<!doctype html><html lang="en"><head><script src="velos-cleanday.js?v=91"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1f"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Velos Global Events | Wedding, Decoration & Event Planners in Uganda</title>
<meta name="description" content="Find trusted wedding planners, decorators, kwanjula and event specialists in Uganda. See real photos and videos, request quotes, and pay safely: Velos holds your money until the job is done.">
<link rel="canonical" href="https://thevelosgroup.com/events.html">
<meta property="og:title" content="Velos Global Events | Wedding, Decoration & Event Planners in Uganda"><meta property="og:description" content="Real work, real planners, safe payment. Request quotes from verified event professionals in Uganda."><meta property="og:image" content="https://thevelosgroup.com/icon-512.png"><meta property="og:type" content="website">
<link rel="stylesheet" href="foods.css">
<style>
.hero2{padding:26px 18px;border:1px solid #35416c;border-radius:20px;background:radial-gradient(circle at 90% 10%,rgba(232,199,102,.2),transparent 40%),linear-gradient(120deg,#16204a,#080d1f 72%);margin:8px 0 14px}.hero2 h1{font-size:28px}.hero2 p{color:var(--mut);margin:6px 0 12px;max-width:640px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--mut);padding:8px 13px}.chips button.on{background:var(--gold);color:#080d1f;border-color:var(--gold)}
.fl{display:grid;grid-template-columns:2fr 1fr auto;gap:8px}@media(max-width:600px){.fl{grid-template-columns:1fr 1fr}.fl input,.fl button{grid-column:1/3}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.pc .cv{height:170px;background:#0b1226 center/cover;position:relative}.pc .th{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:56px}.pc .th i{background:#0b1226 center/cover}
.pc .b2{padding:12px}.pc h3{margin:0;font-size:18px;font-family:Georgia,serif}.ft{position:absolute;top:8px;left:8px;background:var(--gold);color:#080d1f;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.vf{color:var(--ok);font-size:12px}
.gal{columns:3 170px;column-gap:8px}.gal>*{break-inside:avoid;margin-bottom:8px;border-radius:12px;overflow:hidden;display:block;background:#0b1226}.gal img,.gal video{width:100%;display:block;cursor:zoom-in}
.pk{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.sh{position:fixed;inset:0;background:rgba(4,8,20,.9);z-index:60;display:flex;align-items:flex-end;justify-content:center}.sh .bx{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}@media(min-width:800px){.sh{align-items:center}.sh .bx{border-radius:18px}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:70;display:flex;align-items:center;justify-content:center}.lb img{max-width:96vw;max-height:92vh}
select,textarea{width:100%;padding:12px;margin:5px 0;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}.how div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);font-size:14px}.how b{display:block;color:var(--gold)}
.warn{border:1px solid #c9a227;background:rgba(232,199,102,.08);border-radius:12px;padding:10px;font-size:14px}
@media(max-width:430px){.row2{grid-template-columns:1fr}}
</style></head>
<body><div class="w">
<div class="top"><a href="index.html"><img src="logo-mark.png" alt="The Velos Group"><span>Velos Events</span></a><div><a href="foods.html">Foods</a><a href="shop.html">Shop</a><a href="#" onclick="trackBox();return false">My booking</a><a href="events-pro.html">For planners</a></div></div>
<div id="v"><p class="m">Loading…</p></div>
<div style="margin:30px 0 10px" class="m"><a href="refund-policy.html#events" style="color:var(--gold)">Payments &amp; refunds for events</a> · <a href="terms.html" style="color:var(--gold)">Terms</a> · <a href="contact.html" style="color:var(--gold)">Contact</a></div></div><div id="toast" hidden></div><div id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script>
<script>
var S = window.VELOS_SUPABASE, db = supabase.createClient(S.url, S.key), $ = function(i){ return document.getElementById(i); }, V = function(h){ $('v').innerHTML = h; };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }, ugx = function(n){ return 'UGX ' + Math.round(+n || 0).toLocaleString('en-US'); };
function toast(m, b){ var t = $('toast'); t.textContent = m; t.style.background = b ? '#b3261e' : ''; t.style.color = b ? '#fff' : ''; t.hidden = false; setTimeout(function(){ t.hidden = true; }, 3200); }
var SERVICES = [['decor','Decoration'],['wedding','Weddings'],['intro','Kwanjula'],['bridal','Bride & groom fashion'],['party','Parties'],['corporate','Corporate'],['rentals','Tents & chairs'],['mcdj','MC & DJ'],['photo','Photo & video'],['makeup','Makeup']], LBL = {}; SERVICES.forEach(function(s){ LBL[s[0]] = s[1]; });
var TYPE = '', P = null, PAY = {};
function sheet(h){ $('sheet').innerHTML = h ? '<div class="sh" onclick="if(event.target===this)sheet()"><div class="bx">' + h + '</div></div>' : ''; }
function seo(t, d){ document.title = t; var m = document.querySelector('meta[name=description]'); if(m) m.content = d; }
function jsonld(o){ var s = document.getElementById('ld'); if(!s){ s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ld'; document.head.appendChild(s); } s.textContent = o ? JSON.stringify(o) : ''; }

async function route(){ var p = new URLSearchParams(location.search).get('p'); if(p) return profile(p); listing(); }
function listing(){
  seo('Velos Global Events | Wedding, Decoration & Event Planners in Uganda', 'Find trusted wedding planners, decorators, kwanjula and event specialists in Uganda. See real photos and videos, request quotes, and pay safely: Velos holds your money until the job is done.'); jsonld(null);
  V('<div class="hero2"><h1>Velos Global Events</h1><p>Wedding planners, decorators, kwanjula and event specialists in Uganda. See their real work, request quotes, and pay safely. Velos holds your money until the job is done.</p><div class="fl"><input id="q" placeholder="Search by name or style"><input id="ci" placeholder="City or area"><button onclick="load()">Search</button></div></div>'
   + '<div class="chips" id="ch"><button class="on" onclick="setT(\'\')">All</button>' + SERVICES.map(function(s){ return '<button onclick="setT(\'' + s[0] + '\')">' + s[1] + '</button>'; }).join('') + '</div><div class="cards" id="cd"><p class="m">Loading…</p></div>'
   + '<div class="how"><div><b>1. Choose</b>Browse real photos and videos from verified planners.</div><div><b>2. Request a quote</b>Tell them your date, place and ideas. It is free.</div><div><b>3. Pay safely</b>Accept the quote and pay a deposit to Velos, not to a stranger.</div><div><b>4. Enjoy, then confirm</b>Velos pays the planner after your event is done and you are happy.</div></div>'
   + '<div class="c"><h2>Are you a planner or decorator?</h2><p class="m">List your business free. Post photos and videos, get quote requests, and be paid safely.</p><a class="b" href="events-pro.html">Register on Velos Events</a></div>'); load(); }
function setT(t){ TYPE = t; [].slice.call($('ch').children).forEach(function(b, i){ b.className = (i === 0 && !t) || (i > 0 && SERVICES[i - 1][0] === t) ? 'on' : ''; }); load(); }
async function load(){
  var r = await db.rpc('event_pros_public', {p_q:$('q').value.trim(), p_type:TYPE, p_city:$('ci').value.trim()}), L = r.data || [];
  $('cd').innerHTML = L.length ? L.map(function(p){ var th = (p.thumbs || []); return '<div class="pc" onclick="location.href=\'events.html?p=' + esc(p.slug) + '\'"><div class="cv" style="background-image:url(\'' + esc(p.cover || '') + '\')">' + (p.featured ? '<span class="ft">★ Featured</span>' : '') + (!p.cover ? '<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:44px">🎉</div>' : '') + '</div>' + (th.length ? '<div class="th">' + th.map(function(u){ return '<i style="background-image:url(\'' + esc(u) + '\')"></i>'; }).join('') + '</div>' : '') + '<div class="b2"><h3>' + esc(p.name) + '</h3><div class="m">📍 ' + esc(p.city || 'Uganda') + ' · <span class="vf">✓ Verified by Velos</span></div><div class="m" style="margin:4px 0">' + (p.services || []).slice(0, 3).map(function(s){ return esc(LBL[s] || s); }).join(' · ') + '</div>' + (p.from_ugx ? '<b class="pr">from ' + ugx(p.from_ugx) + '</b>' : '') + '</div></div>'; }).join('')
    : '<div class="c" style="grid-column:1/-1"><h3 style="margin:0">Planners are joining now</h3><p class="m">No listings match yet. Check back soon, or <a href="contact.html" style="color:var(--gold)">tell us what you need</a> and we will help you find someone.</p></div>'; }

async function profile(slug){
  var r = await db.rpc('event_pro_public', {p_slug:slug}); P = r.data;
  if(!P){ V('<div class="c"><h2>Planner not found</h2><p class="m">This page may have moved.</p><a class="b" href="events.html">See all planners</a></div>'); return; }
  seo(P.name + ' | ' + (P.services || []).map(function(s){ return LBL[s] || s; }).slice(0, 2).join(' & ') + ' in ' + (P.city || 'Uganda') + ' | Velos Events', (P.bio || (P.name + ' on Velos Events')).slice(0, 155));
  var ph = (P.media || []).filter(function(m){ return m.kind === 'photo'; });
  jsonld({'@context':'https://schema.org', '@type':'LocalBusiness', name:P.name, description:P.bio || '', image:P.cover || (ph[0] && ph[0].url) || undefined, url:location.href, areaServed:(P.city || '') + ', ' + (P.country || 'Uganda'), address:{'@type':'PostalAddress', addressLocality:P.city || '', addressCountry:'UG'}, makesOffer:(P.packages || []).map(function(k){ return {'@type':'Offer', name:k.name, description:k.description || '', priceCurrency:'UGX', price:k.from_ugx || undefined}; })});
  var h = '<p><a href="events.html" style="color:var(--gold)">← All planners</a></p><div class="hero2" style="' + (P.cover ? 'background-image:linear-gradient(rgba(8,13,31,.55),rgba(8,13,31,.9)),url(\'' + esc(P.cover) + '\');background-size:cover;background-position:center' : '') + '"><h1>' + esc(P.name) + '</h1><div class="m">📍 ' + esc(P.city || '') + ' ' + esc(P.areas ? '· also ' + P.areas : '') + ' · <span class="vf">✓ Verified by Velos</span>' + (P.years ? ' · ' + P.years + ' yrs' : '') + (P.done ? ' · ' + P.done + ' events completed on Velos' : '') + '</div><p>' + esc(P.bio || '') + '</p><div class="m" style="margin-bottom:10px">' + (P.services || []).map(function(s){ return esc(LBL[s] || s); }).join(' · ') + '</div><button onclick="ask()">Request a quote</button></div>';
  if(P.packages && P.packages.length) h += '<h2>Packages</h2>' + P.packages.map(function(k){ return '<div class="pk"><div><b>' + esc(k.name) + '</b><div class="m">' + esc(LBL[k.type] || '') + '</div><div style="font-size:14px">' + esc(k.description || '') + '</div></div><div style="text-align:right"><b class="pr">from ' + ugx(k.from_ugx) + '</b><br><button onclick="ask(\'' + k.id + '\')" style="margin-top:6px">Get a quote</button></div></div>'; }).join('');
  h += '<h2>Their work</h2>' + ((P.media || []).length ? '<div class="gal">' + P.media.map(function(m, i){ if(m.kind === 'photo') return '<img loading="lazy" src="' + esc(m.url) + '" alt="' + esc((m.caption || LBL[m.type] || 'Event') + ' by ' + P.name) + '" onclick="lb(' + i + ')">'; if(m.kind === 'video') return '<video controls preload="metadata" src="' + esc(m.url) + '#t=0.5"></video>'; return '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" style="padding:18px;text-align:center;color:var(--gold);text-decoration:none">▶️ Watch video<div class="m">' + esc(m.caption || '') + '</div></a>'; }).join('') + '</div>' : '<p class="m">Photos coming soon.</p>');
  h += '<div class="warn" style="margin-top:16px">🔒 Pay only through Velos. Your deposit is held by Velos and released to the planner after your event is done. Never send money to a planner directly.</div>';
  V(h);
}
function lb(i){ var m = P.media[i]; var d = document.createElement('div'); d.className = 'lb'; d.onclick = function(){ d.remove(); }; d.innerHTML = '<img src="' + esc(m.url) + '" alt="">'; document.body.appendChild(d); }
function ask(pk){
  var pks = P.packages || [];
  sheet('<h2>Request a quote from ' + esc(P.name) + '</h2><p class="m">Free. No payment now. The planner replies with a price.</p><input id="cn" placeholder="Your name *" autocomplete="name"><input id="cp" type="tel" placeholder="Phone / WhatsApp *" autocomplete="tel"><input id="ce" type="email" placeholder="Email (optional)"><select id="ct"><option value="">What is the event? *</option>' + SERVICES.filter(function(s){ return (P.services || []).indexOf(s[0]) > -1; }).map(function(s){ return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join('') + '</select>'
   + (pks.length ? '<select id="cpk"><option value="">Package (optional)</option>' + pks.map(function(k){ return '<option value="' + k.id + '"' + (k.id === pk ? ' selected' : '') + '>' + esc(k.name) + ' (from ' + ugx(k.from_ugx) + ')</option>'; }).join('') + '</select>' : '')
   + '<div class="row2"><input id="cd2" type="date" min="' + new Date().toISOString().slice(0, 10) + '"><input id="cg" type="number" min="1" placeholder="Guests"></div><div class="row2"><input id="cc" placeholder="City / town"><input id="cv" placeholder="Venue (if known)"></div><input id="cb" type="number" min="0" placeholder="Budget in UGX (optional)"><textarea id="cm" rows="3" placeholder="Tell them your ideas: theme, colours, what you need"></textarea><button class="full" onclick="sendAsk()">Send request</button><p id="ae" class="m bad"></p><button class="g full" onclick="sheet()">Cancel</button>');
}
async function sendAsk(){
  if(!$('cn').value.trim() || !$('cp').value.trim() || !$('ct').value){ $('ae').textContent = 'Please enter your name, phone and the type of event.'; return; }
  var r = await db.rpc('event_lead_create', {p_pro:P.id, p_package:$('cpk') && $('cpk').value ? $('cpk').value : null, p_name:$('cn').value, p_phone:$('cp').value, p_email:$('ce').value, p_type:$('ct').value, p_date:$('cd2').value || null, p_city:$('cc').value, p_venue:$('cv').value, p_guests:$('cg').value ? +$('cg').value : null, p_budget:$('cb').value ? +$('cb').value : null, p_message:$('cm').value});
  if(r.error){ $('ae').textContent = r.error.message; return; } var n = r.data.lead_no, ph = $('cp').value;
  try{ localStorage.setItem('v_ev', JSON.stringify({n:n, p:ph})); }catch(e){}
  sheet('<h2>Request sent ✓</h2><p>Your request number is <b style="font-size:22px;color:var(--gold)">#' + n + '</b>. Save it with your phone number.</p><p class="m">' + esc(P.name) + ' will send a quote. Check it any time under <b>My booking</b>. Pay only through Velos.</p><button class="full" onclick="trackOpen(' + n + ',\'' + esc(ph) + '\')">View my booking</button><button class="g full" onclick="sheet()">Close</button>');
}

/* ---------- customer: my booking ---------- */
function trackBox(){ var s = {}; try{ s = JSON.parse(localStorage.getItem('v_ev') || '{}'); }catch(e){}
  sheet('<h2>My booking</h2><input id="tn" type="number" placeholder="Request number (e.g. 5001)" value="' + esc(s.n || '') + '"><input id="tp" type="tel" placeholder="Phone you used" value="' + esc(s.p || '') + '"><button class="full" onclick="trackOpen($(\'tn\').value,$(\'tp\').value)">Open</button><p id="te" class="m bad"></p><button class="g full" onclick="sheet()">Close</button>'); }
async function trackOpen(n, ph){
  var r = await db.rpc('event_lead_track', {p_no:+n, p_phone:ph}); if(r.error || !r.data){ sheet('<h2>My booking</h2><p class="bad">We could not find it. Check the number and phone.</p><button class="full" onclick="trackBox()">Try again</button>'); return; }
  var t = r.data, st = t.status, h = '<h2>Booking #' + t.lead_no + '</h2><p><b>' + esc(t.planner) + '</b> · ' + esc(LBL[t.event_type] || '') + ' · ' + esc(t.event_date || 'date to be agreed') + '</p>';
  if(!Object.keys(PAY).length){ var q = await db.from('settings').select('key,value').like('key', 'site_pay_%'); (q.data || []).forEach(function(x){ PAY[x.key] = x.value; }); }
  var pend = (t.payments || []).filter(function(p){ return p.status === 'pending'; }).map(function(p){ return p.kind; });
  var A = ' onclick="trackOpen(' + t.lead_no + ',\'' + esc(ph) + '\')"';
  var payForm = function(kind, amt){ return '<div class="c"><b>Pay ' + ugx(amt) + ' (' + kind + ') to Velos</b><div class="m">MTN: <b>' + esc(PAY.site_pay_mtn_number || '') + '</b> · ' + esc(PAY.site_pay_mtn_name || '') + '<br>Airtel: <b>' + esc(PAY.site_pay_airtel_number || '') + '</b> · ' + esc(PAY.site_pay_airtel_name || '') + '</div><select id="pm"><option value="mtn">Paid with MTN</option><option value="airtel">Paid with Airtel</option></select><input id="pr" placeholder="Transaction ID from the SMS *"><button class="full" onclick="pay(' + t.lead_no + ',\'' + esc(ph) + '\',\'' + kind + '\')">I have paid</button><p id="pe" class="m bad"></p></div>'; };
  var labels = {new:'Waiting for the planner to send a quote', quoted:'Quote received', accepted:'Pay the deposit to confirm your booking', deposit_paid:'Deposit received. Your booking is confirmed', paid:'Fully paid. Enjoy your event', completed:'Event done', declined:'The planner could not take this booking', cancelled:'Cancelled', refunded:'Refunded'};
  h += '<div class="warn">' + esc(labels[st] || st) + '</div>';
  if(t.quote) h += '<div class="c"><div class="row"><span>Total price</span><b>' + ugx(t.quote) + '</b></div><div class="row"><span>Deposit to confirm</span><b>' + ugx(t.deposit) + '</b></div><div class="row"><span>Balance (pay before your event)</span><b>' + ugx(t.balance) + '</b></div>' + (t.quote_note ? '<p class="m">' + esc(t.quote_note) + '</p>' : '') + '<div class="m">Paid and confirmed: ' + ugx(t.paid_confirmed) + '</div></div>';
  if(st === 'quoted') h += '<div class="row2"><button onclick="acc(' + t.lead_no + ',\'' + esc(ph) + '\',true)">Accept quote</button><button class="g" onclick="acc(' + t.lead_no + ',\'' + esc(ph) + '\',false)">No thanks</button></div>';
  if(st === 'accepted') h += pend.indexOf('deposit') > -1 ? '<p class="m">We received your deposit details. Velos is confirming it.</p>' : payForm('deposit', t.deposit);
  if(st === 'deposit_paid') h += (t.planner_phone ? '<p>Planner contact: <b>' + esc(t.planner_phone) + '</b></p>' : '') + (pend.indexOf('balance') > -1 ? '<p class="m">We received your balance details. Velos is confirming it.</p>' : payForm('balance', t.balance));
  if(st === 'paid' && t.planner_phone) h += '<p>Planner contact: <b>' + esc(t.planner_phone) + '</b></p>';
  if(st === 'paid' || st === 'completed'){ if(t.dispute === 'open') h += '<div class="warn">Your problem report is with Velos. We will decide within 3 working days.</div>'; else if(t.confirmed) h += '<p class="ok">✅ You confirmed. Thank you.</p>'; else if(st === 'completed') h += '<div class="c"><b>Was your event delivered as agreed?</b><p class="m">Velos pays the planner after you confirm, or on ' + esc(String(t.release_at || '').slice(0, 16).replace('T', ' ')) + ' if you do not report a problem.</p><button class="full" onclick="conf(' + t.lead_no + ',\'' + esc(ph) + '\')">Yes, all good</button><textarea id="dr" rows="2" placeholder="Something wrong? Tell us what happened"></textarea><button class="g full" onclick="disp(' + t.lead_no + ',\'' + esc(ph) + '\')">Report a problem</button></div>'; else h += '<p class="m">Something wrong before the event? <a href="contact.html" style="color:var(--gold)">Contact Velos</a>.</p>'; }
  h += '<p class="m"><a href="refund-policy.html#events" style="color:var(--gold)">Refund policy</a> · <a href="#" style="color:var(--gold)" onclick="rep(' + t.lead_no + ',\'' + esc(ph) + '\',\'' + esc(t.planner) + '\');return false">Asked to pay or deal outside Velos? Tell us</a></p><button class="g full" onclick="sheet()">Close</button>'; sheet(h);
}
async function rep(n, ph, who){ var note = prompt('What happened? (We keep this private and you stay protected.)'); if(!note) return; var r = await db.rpc('report_offplatform', {p_kind:'event', p_ref:n, p_name:'', p_phone:ph, p_about:who, p_note:note}); toast(r.error ? r.error.message : 'Thank you. Velos will look into it.', !!r.error); }
async function acc(n, ph, ok){ var r = await db.rpc('event_quote_accept', {p_no:n, p_phone:ph, p_accept:ok}); if(r.error) toast(r.error.message, 1); trackOpen(n, ph); }
async function pay(n, ph, kind){ var r = await db.rpc('event_pay_submit', {p_no:n, p_phone:ph, p_kind:kind, p_method:$('pm').value, p_ref:$('pr').value}); if(r.error){ $('pe').textContent = r.error.message; return; } toast('Received ✓ Velos will confirm shortly'); trackOpen(n, ph); }
async function conf(n, ph){ var r = await db.rpc('event_customer_confirm', {p_no:n, p_phone:ph}); if(r.error) toast(r.error.message, 1); else toast('Thank you ✓'); trackOpen(n, ph); }
async function disp(n, ph){ var r = await db.rpc('event_customer_dispute', {p_no:n, p_phone:ph, p_reason:$('dr').value}); if(r.error) toast(r.error.message, 1); else toast('Reported. Velos will review.'); trackOpen(n, ph); }
route();
</script></body></html>
