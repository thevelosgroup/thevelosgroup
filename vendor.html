<!doctype html><html lang="en"><head><script src="velos-splash.js"></script><link rel="manifest" href="manifest-vendor.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on Velos | Partner Dashboard</title><meta name="description" content="Open your store on The Velos Group. We handle marketing, delivery and payments. You manage your products and prices."><link rel="stylesheet" href="foods.css">
<style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="velos-guard-config.js"></script><script src="velos-guard.js"></script><script src="velos-ui.js"></script><script src="velos-stamp.js"></script><script src="velos-receipts.js"></script><script src="velos-myreceipts.js"></script><script src="velos-safe.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="velos-txid.js"></script><script src="velos-stays.js"></script><script src="vendor-hotel.js"></script><script src="velos-vendor-cats.js"></script><script src="velos-shell.js"></script><script src="velos-location.js"></script></head>
<body><div class="w" style="max-width:900px"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script>
var S = window.VELOS_SUPABASE, db = supabase.createClient(S.url, S.key), $ = function(i){ return document.getElementById(i); }, V = function(h){ $('v').innerHTML = h; };
var TAB = 'home', ME = null, ST = {}, SEL = {k:'', mode:'retail'}, PR = [], EDIT = null;
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }, ugx = function(n){ return 'UGX ' + Math.round(n || 0).toLocaleString('en-US'); };
function toast(m, b){ var t = $('toast'); t.textContent = m; t.style.background = b ? '#b3261e' : ''; t.style.color = b ? '#fff' : ''; t.hidden = false; setTimeout(function(){ t.hidden = true; }, 2800); }
async function out(){ await db.auth.signOut(); boot(); }
async function settings(){ var q = await db.from('settings').select('key,value').or('key.like.partner_%,key.like.site_pay_%'); (q.data || []).forEach(function(x){ ST[x.key] = x.value; }); }

/* ---------- start ---------- */
async function boot(){
  var r = await db.auth.getSession(), s = r.data.session; if(!s) return auth();
  await settings(); var m = await db.rpc('partner_me'); ME = m.data;
  if(!ME) return applyForm(s.user.email);
  if(ME.status !== 'active') return onboarding();
  show();
}
function hero(){ return '<div style="text-align:center;margin:6px 0 14px"><img src="logo-mark.png" alt="The Velos Group" style="height:64px"><h1>Sell on Velos</h1><p class="m">Your own store on the Velos website. We handle marketing, delivery and payments. You manage your products and prices.</p></div>'; }
function auth(){ V(hero() + '<div class="pg" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px"><div class="pc" style="text-align:center"><span style="font-size:28px">🌍</span><b>Sell to all of East Africa</b></div><div class="pc" style="text-align:center"><span style="font-size:28px">🛵</span><b>We deliver for you</b></div><div class="pc" style="text-align:center"><span style="font-size:28px">💳</span><b>We collect the money</b></div><div class="pc" style="text-align:center"><span style="font-size:28px">📣</span><b>We do the marketing</b></div></div><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="su()">Create a login to register your business</button><p id="er" class="m bad"></p></div><p class="m" style="text-align:center">One-time registration UGX 75,000 · Monthly service fee UGX 5,000</p>'); }
async function si(){ var r = await db.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value}); if(r.error) $('er').textContent = r.error.message; else boot(); }
async function su(){ var pw = $('pw').value; if(pw.length < 8){ $('er').textContent = 'Use at least 8 characters.'; return; } var r = await db.auth.signUp({email:$('em').value.trim(), password:pw}); if(r.error){ $('er').textContent = r.error.message; return; } if(r.data.session) boot(); else $('er').textContent = 'Check your email to confirm, then sign in.'; }

/* ---------- registration ---------- */
function applyForm(email){
  V(hero() + '<div class="c"><h2>1. What does your business deal in?</h2><div class="cats" id="cg">' + VCATS.map(function(c){ return '<button type="button" id="cb-' + c.k + '" onclick="pickCat(\'' + c.k + '\')"><span>' + c.i + '</span>' + esc(c.l) + '</button>'; }).join('') + '</div>'
    + '<div id="modeBox"><label class="m">How do you sell?</label><select id="md"><option value="retail">Retail: single items</option><option value="wholesale">Wholesale: bulk only</option><option value="both">Both retail and wholesale</option></select></div></div>'
    + '<div class="c"><h2>2. Business details</h2><input id="bn" placeholder="Business / shop name *"><input id="ow" placeholder="Owner&#39;s full name *" autocomplete="name"><div class="row2"><input id="ph" type="tel" placeholder="Phone / WhatsApp *"><input id="em2" type="email" placeholder="Business email" value="' + esc(email) + '"></div>'
    + '<div class="row2"><select id="co"><option>Uganda</option><option>Kenya</option><option>Rwanda</option><option>Tanzania</option><option>Burundi</option><option>South Sudan</option><option>DR Congo</option><option>Ethiopia</option><option>Somalia</option></select><input id="ci" placeholder="City / town *"></div><input id="ad" placeholder="Shop or premises address *"><textarea id="ds" placeholder="Tell customers about your business in one or two lines"></textarea></div>'
    + '<div class="c"><h2>3. Pin your exact location</h2><p class="m">This is how customers see how far you are and how delivery is priced. Pin your exact shop door.</p><div id="locBox"></div></div>'
    + '<div class="c"><h2>4. Tax and payout details</h2><input id="tin" placeholder="TIN (Tax Identification Number) *"><label class="m">How should Velos pay you? (paid in UGX)</label><select id="pm" onchange="pmChange()"><option value="mtn">MTN Mobile Money</option><option value="airtel">Airtel Money</option><option value="bank">Bank account</option></select><input id="pb" placeholder="Bank name" style="display:none"><input id="pa" placeholder="Mobile money number *"><input id="pn" placeholder="Name on the account / wallet *"><p class="m">We pay your sales into this account after each delivery, minus the Velos commission.</p></div>'
    + '<div class="c" id="delBox"><h2>5. Delivery</h2><p class="m">Customers choose your shop and ask how the order arrives. Velos delivers by default. If you have your own vehicles or delivery team, for example to carry bulk orders, tell us here.</p>' + delHtml() + '</div>'
    + '<div class="c"><button class="full" onclick="applySend()">Submit my application</button><p id="er" class="m bad"></p><p class="m">Next you will pay the one-time registration fee (' + ugx(ST.partner_reg_fee || 75000) + '), then download, sign and upload your partner agreement.</p></div><button class="g" onclick="out()">Sign out</button>');
  LOC = VelosLoc.field('locBox'); delChange();
}
var LOC = null;
function pickCat(k){ SEL.k = k; VCATS.forEach(function(c){ var b = $('cb-' + c.k); if(b) b.className = c.k === k ? 'on' : ''; }); var c = vcat(k); $('modeBox').style.display = c.kind === 'goods' ? '' : 'none'; if($('delBox')) $('delBox').style.display = c.kind === 'goods' ? '' : 'none'; }
function pmChange(){ var b = $('pm').value === 'bank'; $('pb').style.display = b ? '' : 'none'; $('pa').placeholder = b ? 'Bank account number *' : 'Mobile money number *'; }
async function applySend(){
  var g = function(i){ return $(i).value.trim(); }, c = vcat(SEL.k);
  if(!SEL.k){ $('er').textContent = 'Please choose what your business deals in.'; return; }
  if(g('bn').length < 2 || g('ow').length < 2 || g('ph').length < 7 || !g('ci') || !g('ad') || g('tin').length < 5 || g('pa').length < 5 || g('pn').length < 2){ $('er').textContent = 'Please complete all fields marked *.'; return; }
  var lv = LOC && LOC.get(); if(!lv){ $('er').textContent = 'Please pin your exact shop location on the map.'; return; } if(lv.text.length < 3){ $('er').textContent = 'Add a building or landmark next to the map pin.'; return; }
  var dv = c.kind === 'goods' ? delRead() : null; if(dv && dv.err){ $('er').textContent = dv.err; return; }
  var r = await db.rpc('partner_apply', {p_business:g('bn'), p_owner:g('ow'), p_category:SEL.k, p_kind:c.kind, p_mode:c.kind === 'goods' ? $('md').value : 'retail', p_country:$('co').value, p_city:g('ci'), p_address:g('ad'), p_phone:g('ph'), p_email:g('em2'), p_tin:g('tin'), p_payout_method:$('pm').value, p_payout_bank:g('pb'), p_payout_account:g('pa'), p_payout_name:g('pn'), p_description:g('ds')});
  if(r.error){ $('er').textContent = r.error.message; return; }
  try{ await db.rpc('partner_set_location', {p_lat:lv.lat, p_lng:lv.lng, p_text:lv.text}); }catch(e){}
  if(dv && dv.args.p_mode !== 'velos'){ try{ await db.rpc('partner_set_delivery', dv.args); }catch(e){} }
  toast('Application received ✓'); boot();
}


/* ---------- delivery choices ---------- */
function delHtml(m){ m = m || {}; var dm = m.delivery_mode || 'velos', fm = m.own_fee_mode || 'quote', sel = function(a, b){ return a === b ? ' selected' : ''; };
  return '<label class="m">Do you have your own delivery?</label><select id="d_m" onchange="delChange()"><option value="velos"' + sel('velos', dm) + '>No. Velos delivers all my orders</option><option value="bulk_own"' + sel('bulk_own', dm) + '>Yes. I deliver bulk orders myself, Velos delivers the small ones</option><option value="all_own"' + sel('all_own', dm) + '>Yes. I deliver all my orders myself</option></select>'
    + '<div id="d_more"><div id="d_bulk"><label class="m">What counts as a bulk order? Fill one or both.</label><div class="row2"><input id="d_bu" type="number" min="0" placeholder="Minimum order value (UGX)" value="' + (m.bulk_min_ugx || '') + '"><input id="d_bq" type="number" min="0" placeholder="Or minimum quantity of one item" value="' + (m.bulk_min_qty || '') + '"></div></div>'
    + '<label class="m">How do you charge for your delivery?</label><select id="d_fm" onchange="delChange()"><option value="quote"' + sel('quote', fm) + '>I agree the fee with the customer</option><option value="fixed"' + sel('fixed', fm) + '>A fixed delivery fee</option><option value="free"' + sel('free', fm) + '>Free delivery</option></select><input id="d_fu" type="number" min="0" placeholder="Your delivery fee (UGX)" value="' + (m.own_fee_ugx || '') + '">'
    + '<input id="d_ar" placeholder="Areas you deliver to (e.g. Kampala, Wakiso, anywhere in Uganda)" value="' + esc(m.own_areas || '') + '"><input id="d_ds" placeholder="How soon do you deliver? (e.g. same day, within 2 days)" value="' + esc(m.own_days || '') + '">'
    + '<p class="m">Velos still collects the customer\'s payment and pays you after delivery. Your delivery fee is arranged with the customer and paid to you directly. Orders below your bulk limit are delivered by Velos riders.</p></div>'; }
function delChange(){ var m = $('d_m').value; $('d_more').style.display = m === 'velos' ? 'none' : ''; $('d_bulk').style.display = m === 'bulk_own' ? '' : 'none'; $('d_fu').style.display = $('d_fm').value === 'fixed' ? '' : 'none'; }
function delRead(){ var n = function(i){ return Number($(i).value) || 0; }, m = $('d_m').value, f = $('d_fm').value;
  if(m === 'bulk_own' && !(n('d_bu') > 0 || n('d_bq') > 0)) return {err:'Tell us what counts as a bulk order: a minimum value or a minimum quantity.'};
  if(m !== 'velos' && f === 'fixed' && !(n('d_fu') > 0)) return {err:'Enter your delivery fee.'};
  return {args:{p_mode:m, p_bulk_ugx:n('d_bu'), p_bulk_qty:n('d_bq'), p_fee_mode:f, p_fee_ugx:n('d_fu'), p_areas:$('d_ar').value, p_days:$('d_ds').value}}; }
async function saveDelivery(){ var d = delRead(); if(d.err){ $('d_er').textContent = d.err; return; } var r = await db.rpc('partner_set_delivery', d.args); if(r.error){ $('d_er').textContent = r.error.message; return; } ME = r.data; $('d_er').textContent = ''; toast('Delivery choices saved ✓'); }

/* ---------- onboarding: fee + agreement + wait for approval ---------- */
function onboarding(){
  var feeDone = ME.fee_status === 'paid', feeSent = ME.fee_status === 'submitted', signed = !!ME.agreement_signed_path, fee = +ST.partner_reg_fee || 75000;
  var h = '<h1>' + esc(ME.business_name) + '</h1><div class="c"><b>Your application is ' + (ME.status === 'suspended' ? 'suspended' : ME.status === 'rejected' ? 'not approved' : 'in progress') + '.</b><p class="m">Velos switches your store on after the fee is confirmed and your signed agreement is on file.</p></div>'
    + '<div class="steps"><div class="st done"><i>✅</i><div><b>Application submitted</b><div class="m">Agreement no. ' + esc(ME.agreement_no) + '</div></div></div>'
    + '<div class="st ' + (feeDone ? 'done' : '') + '"><i>' + (feeDone ? '✅' : feeSent ? '⏳' : '1️⃣') + '</i><div><b>Pay the one-time registration fee: ' + ugx(fee) + '</b><div class="m">' + (feeDone ? 'Confirmed' : feeSent ? 'Received. Velos is confirming it.' : 'Pay by mobile money below, then send the transaction ID.') + '</div></div></div>'
    + '<div class="st ' + (signed ? 'done' : '') + '"><i>' + (signed ? '✅' : '2️⃣') + '</i><div><b>Sign the partner agreement</b><div class="m">' + (signed ? 'Signed copy received. Velos keeps a copy on file.' : 'Download it, sign it, then upload the signed copy.') + '</div></div></div>'
    + '<div class="st"><i>3️⃣</i><div><b>Velos uploads your first products</b><div class="m">Send your product list, prices and photos to Velos. After that you manage everything yourself.</div></div></div></div>';
  h += '<div class="c"><h2>Upload your business documents</h2><p class="m">Velos verifies every store. Registered businesses upload their trading licence and TIN. Small businesses without a licence use a letter from the owner\'s LC1 chairperson. Your documents are private.</p><a class="b" href="apply.html?kind=vendor" style="display:inline-block;text-decoration:none">Open my documents checklist</a></div>';
  if(!feeDone && !feeSent) h += '<div class="c"><h2>Pay the registration fee</h2><div>MTN: <b>' + esc(ST.site_pay_mtn_number || '') + '</b> · ' + esc(ST.site_pay_mtn_name || '') + '</div><div>Airtel: <b>' + esc(ST.site_pay_airtel_number || '') + '</b> · ' + esc(ST.site_pay_airtel_name || '') + '</div><select id="fm"><option value="mtn">Paid with MTN</option><option value="airtel">Paid with Airtel</option></select><input id="fr" placeholder="Transaction ID *"><input id="fq" type="tel" placeholder="Phone you paid from *" value="' + esc(ME.phone) + '"><button class="full" onclick="feeSend()">I have paid. Submit</button><p id="fe" class="m"></p></div>';
  if(!signed) h += '<div class="c"><h2>Partner agreement</h2><p class="m">Already signed by Velos. Print, sign and stamp it, then take a clear photo or scan and upload it here.</p><button onclick="agreementPdf()">📄 Download agreement (PDF)</button><input type="file" id="af" accept="image/*,application/pdf" style="margin-top:10px"><button class="full" onclick="agreementUp()">Upload signed copy</button><p id="ae" class="m"></p></div>';
  V(h + '<button class="g" onclick="out()">Sign out</button>');
}
async function feeSend(){ var te = VelosTx.check($('fr').value); if(te){ $('fe').className = 'm bad'; $('fe').textContent = te; return; } var r = await db.rpc('partner_fee_submit', {p_phone:$('fq').value.trim(), p_method:$('fm').value, p_ref:$('fr').value.trim()}); if(r.error){ $('fe').className = 'm bad'; $('fe').textContent = r.error.message; } else { toast('Received ✓'); boot(); } }
async function agreementUp(){
  var f = $('af').files[0]; if(!f){ $('ae').textContent = 'Choose the signed file first.'; return; } $('ae').textContent = 'Uploading…';
  var uid = (await db.auth.getUser()).data.user.id, ext = f.type === 'application/pdf' ? 'pdf' : (f.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg'), path = uid + '/agreement-signed-' + Date.now() + '.' + ext;
  var u = await db.storage.from('partner-docs').upload(path, f, {contentType:f.type}); if(u.error){ $('ae').textContent = u.error.message; return; }
  var r = await db.rpc('partner_agreement_uploaded', {p_path:path}); if(r.error){ $('ae').textContent = r.error.message; return; } toast('Signed agreement received ✓'); boot();
}
function toData(url){ return fetch(url).then(function(r){ return r.blob(); }).then(function(b){ return new Promise(function(ok){ var fr = new FileReader(); fr.onload = function(){ ok(fr.result); }; fr.readAsDataURL(b); }); }); }
async function agreementPdf(){
  try{
    toast('Preparing your agreement…'); var J = window.jspdf.jsPDF, doc = new J({unit:'mm', format:'a4'}), W = 210, M = 18, y = 0, pg = 1, NAVY = [8,13,31], GOLD = [201,162,39], TX = [30,36,56], GR = [110,118,140];
    var sig = null, logo = null; try{ sig = await toData('signature.png'); } catch(e){} try{ logo = await toData('logo-mark.png'); } catch(e){}
    var rr = +ST.partner_comm_retail || 8, rw = +ST.partner_comm_wholesale || 4, rh = +ST.partner_comm_hotel || 10, mf = +ST.partner_monthly_fee || 5000, rf = +ST.partner_reg_fee || 75000, rate = ME.commission_pct != null ? ME.commission_pct : null;
    function foot(){ doc.setFontSize(8); doc.setTextColor(GR[0], GR[1], GR[2]); doc.setFont('helvetica', 'normal'); doc.text('The Velos Group · Kampala, Uganda · info@thevelosgroup.com · thevelosgroup.com', M, 288); doc.text('Agreement ' + ME.agreement_no + ' · page ' + pg, W - M, 288, {align:'right'}); }
    function head(){ doc.setFillColor(NAVY[0], NAVY[1], NAVY[2]); doc.rect(0, 0, W, 34, 'F'); if(logo){ try{ doc.addImage(logo, 'PNG', M, 6, 22, 22); }catch(e){} } doc.setTextColor(232, 199, 102); doc.setFont('times', 'bold'); doc.setFontSize(20); doc.text('THE VELOS GROUP', M + 28, 17); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(200, 206, 224); doc.text('ANYTHING · ANYWHERE · PRECISELY', M + 28, 24); y = 46; }
    function np(){ foot(); doc.addPage(); pg++; y = 24; }
    function h2(t){ if(y > 255) np(); doc.setFont('times', 'bold'); doc.setFontSize(12.5); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]); doc.text(t, M, y); doc.setDrawColor(GOLD[0], GOLD[1], GOLD[2]); doc.setLineWidth(.5); doc.line(M, y + 1.6, M + 24, y + 1.6); y += 7; }
    function p(t){ doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(TX[0], TX[1], TX[2]); var L = doc.splitTextToSize(t, W - 2 * M); L.forEach(function(l){ if(y > 273) np(); doc.text(l, M, y); y += 5; }); y += 2; }
    head(); doc.setFont('times', 'bold'); doc.setFontSize(22); doc.setTextColor(NAVY[0], NAVY[1], NAVY[2]); doc.text('Partner Agreement', M, y); y += 8; doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(GR[0], GR[1], GR[2]); doc.text('Agreement no. ' + ME.agreement_no + ' · Issued ' + new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}), M, y); y += 10;
    h2('Parties'); p('This agreement is between The Velos Group ("Velos"), Kampala, Uganda, and ' + ME.business_name + ' ("the Partner"), owned by ' + ME.owner_name + ', TIN ' + ME.tin + ', operating in ' + (ME.city || '') + ', ' + ME.country + '. It covers the Partner\'s store on the Velos website and apps, category: ' + vcat(ME.category).l + '.');
    h2('1. What Velos provides'); p('A store page on thevelosgroup.com with search visibility, marketing and promotion, order handling, customer payment collection, rider pick-up and delivery, and a dashboard where the Partner manages products, prices and availability and sees sales.');
    h2('2. Fees'); p('One-time registration fee: UGX ' + rf.toLocaleString('en-US') + '. Monthly system service fee: UGX ' + mf.toLocaleString('en-US') + '. Fees are paid to Velos and are not refundable once the store is active.');
    h2('3. Commission'); p(rate != null ? ('Velos earns a commission of ' + rate + '% on the value of each completed order, as agreed for this Partner.') : ('Velos earns a commission on the value of each completed order: ' + rr + '% on retail sales, ' + rw + '% on wholesale (bulk) sales, and ' + rh + '% on hotel room and venue bookings. Rates apply to the goods or booking value and may be adjusted by Velos with written notice.'));
    h2('4. Orders and payment'); p('Customers pay Velos. Velos confirms the payment, tells the Partner to prepare the order, collects and delivers it by a Velos rider, and pays the Partner the order value minus commission, in Uganda shillings, to the payout account the Partner has registered. Advance payment rules apply to customers: full payment for orders under UGX 100,000, a deposit for larger orders, and a 70% deposit on wholesale orders.');
    h2('5. Products, prices and stock'); p('Velos uploads the Partner\'s first catalogue from the list and photos the Partner supplies. After that the Partner manages the catalogue and is responsible for accurate names, prices, photos and stock. The Partner will mark items unavailable when out of stock and will honour every confirmed order at the listed price.');
    h2('6. Hand-over and proof'); p('A Velos rider collects each order from the Partner\'s premises and photographs it at pick-up. The Partner will have orders packed and ready, genuine, undamaged and as described.');
    h2('7. Quality, returns and disputes'); p('The Partner will sell only genuine, legal goods and services. Faulty, wrong or undelivered items are resolved by Velos with the Partner; the Partner bears the cost of items that are not as described.');
    h2('8. Conduct and suspension'); p('Velos may suspend or end a store that sells counterfeit or prohibited goods, misleads customers, or breaches this agreement. The Partner will not take customers or payments outside Velos for orders that originate on Velos.');
    h2('9. Data and privacy'); p('Each party will protect customer information and use it only to fulfil orders. Velos keeps the signed copy of this agreement and the Partner\'s business records on file.');
    h2('10. Term and law'); p('This agreement runs until either party ends it with 30 days\' written notice, or earlier under clause 8. It is governed by the laws of Uganda.');

    var r = await db.rpc('partner_promo_save', {p_id:null, p_title:t, p_body:$('pb').value.trim(), p_image:img, p_product:$('pp').value || null, p_price:$('pq2').value ? Number($('pq2').value) : null, p_ends:$('pe').value || null});
    if(r.error) throw r.error; toast('Promotion is live ✓'); promos();
  } catch(e){ $('pre').textContent = e.message || 'Could not publish'; }
}
function askDelPromo(id){ var p = PM.filter(function(x){ return x.id === id; })[0]; VelosSafe.confirmDelete({what:'promotion', name:p ? p.title : '', onConfirm:async function(t){ var r = await db.rpc('partner_promo_delete', {p_id:id}); if(r.error) throw r.error; toast('Promotion deleted'); promos(); }}); }
function storeTab(){
  bd().innerHTML = '<h2>My store</h2><div class="c"><label class="m">About your store</label><textarea id="sd">' + esc(ME.description) + '</textarea><div class="row2"><div><label class="m">Phone</label><input id="sp" value="' + esc(ME.phone) + '"></div><div><label class="m">Address</label><input id="sa" value="' + esc(ME.address) + '"></div></div><label class="m">Logo</label>' + (ME.logo_url ? '<img src="' + esc(ME.logo_url) + '" style="height:60px;display:block" alt="">' : '') + '<input type="file" id="sl" accept="image/*"><label class="m">Cover photo</label>' + (ME.cover_url ? '<img src="' + esc(ME.cover_url) + '" style="height:80px;display:block;border-radius:8px" alt="">' : '') + '<input type="file" id="sc" accept="image/*"></div>'
    + '<div class="c"><b>Payout details</b><select id="spm"><option value="mtn"' + (ME.payout_method === 'mtn' ? ' selected' : '') + '>MTN Mobile Money</option><option value="airtel"' + (ME.payout_method === 'airtel' ? ' selected' : '') + '>Airtel Money</option><option value="bank"' + (ME.payout_method === 'bank' ? ' selected' : '') + '>Bank account</option></select><input id="spb" placeholder="Bank name" value="' + esc(ME.payout_bank) + '"><input id="spa" placeholder="Account / wallet number" value="' + esc(ME.payout_account) + '"><input id="spn" placeholder="Name on the account" value="' + esc(ME.payout_name) + '"><p class="m">TIN: ' + esc(ME.tin) + '. To change your TIN, contact Velos.</p></div>'
    + (ME.kind === 'goods' ? '<div class="c"><b>Delivery</b><p class="m">Change who delivers your orders at any time.</p>' + delHtml(ME) + '<button class="full" onclick="saveDelivery()">Save delivery choices</button><p id="d_er" class="m bad"></p></div>' : '')
    + '<div id="locCard"></div>'
    + '<div class="c"><b>Fees and receipts</b><div id="myrc"></div></div><button class="full" onclick="saveStore()">Save changes</button><p id="se" class="m"></p><div class="c"><b>Partner agreement</b><p class="m">Agreement ' + esc(ME.agreement_no) + (ME.agreement_signed_path ? ' · signed copy on file' : '') + '</p><button class="g" onclick="agreementPdf()">📄 Download my agreement</button></div>';
  if($('d_m')) delChange();
  try{ VelosMyReceipts.mount(db, 'myrc'); }catch(e){}
  try{ VelosLoc.card('locCard', {title:'Exact store location', get:async function(){ var r = await db.rpc('partner_get_location'); return r.data; }, save:async function(a, b, t){ var r = await db.rpc('partner_set_location', {p_lat:a, p_lng:b, p_text:t}); if(r.error) throw r.error; }}); }catch(e){}
}
async function saveStore(){
  try{ $('se').textContent = 'Saving…'; var lg = $('sl').files[0], cv = $('sc').files[0], lu = lg ? await upImg(lg) : null, cu = cv ? await upImg(cv) : null;
    var r = await db.rpc('partner_save_profile', {p_description:$('sd').value, p_logo:lu, p_cover:cu, p_phone:$('sp').value, p_address:$('sa').value, p_payout_method:$('spm').value, p_payout_bank:$('spb').value, p_payout_account:$('spa').value, p_payout_name:$('spn').value});
    if(r.error) throw r.error; ME = r.data; $('se').textContent = ''; toast('Saved ✓'); storeTab();
  } catch(e){ $('se').textContent = e.message || 'Could not save'; }
}
boot();
</script><script src="velos-change.js"></script><script src="velos-theme.js"></script><script>try{VelosTheme.init({db:(typeof db!=="undefined"?db:null),role:"vendor",name:function(){try{return typeof ME!=='undefined'&&ME?ME.business_name:''}catch(e){return""}}})}catch(e){}</script><script src="velos-appsettings.js?v=1"></script>
</body></html>
