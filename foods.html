  if(!g('bd')||!g('bt')){$('ber').textContent='Please pick the date and time.';return}
  var at=new Date(g('bd')+'T'+g('bt')+':00+03:00');if(isNaN(at)){$('ber').textContent='Please check the date and time.';return}
  var items=Object.keys(BK.items).filter(function(i){return BK.items[i]>0}).map(function(i){return{item_id:i,qty:BK.items[i]}});
  if(adv&&!items.length){$('ber').textContent='To pay in advance, please choose at least one dish.';return}
  var b=$('bgo');b.disabled=true;b.textContent='Sending…';var phone=g('bph');
  rpc('food_booking_create',{p_vendor:V.id,p_name:g('bn'),p_phone:phone,p_party:parseInt($('bp2').value,10),p_at:at.toISOString(),p_notes:g('bno'),p_pay:adv?'advance':'premises',p_items:items}).then(function(r){
    try{localStorage.setItem('velosContact',JSON.stringify(Object.assign(JSON.parse(localStorage.getItem('velosContact')||'{}'),{n:g('bn'),p:phone})));localStorage.setItem('velosLastBooking',JSON.stringify({no:r.booking_no,p:phone}))}catch(e){}
    $('sh').remove();bookDone(r,phone,at)
  }).catch(function(e){b.disabled=false;b.textContent='Request booking';$('ber').textContent=String(e.message).slice(0,200)})}
function bookWhen(at){return at.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Kampala'})}
function bookDone(r,phone,at){
  if(r.needs_payment){
    var pm='';if(r.mtn_number)pm+='<div class="c"><b>MTN Mobile Money</b><br>'+esc(r.mtn_number)+'<br><span class="m">'+esc(r.mtn_name||'')+'</span></div>';if(r.airtel_number)pm+='<div class="c"><b>Airtel Money</b><br>'+esc(r.airtel_number)+'<br><span class="m">'+esc(r.airtel_name||'')+'</span></div>';
    sheet('<h2>Booking #'+r.booking_no+' · pay to confirm</h2><p>'+esc(r.restaurant)+' · '+bookWhen(at)+' · '+esc(r.meal)+'</p><p>Send <b>'+bu(r.total)+'</b> by Mobile Money:</p>'+pm+'<p class="m">Then type the transaction ID from your Mobile Money message. Your money is fully refundable if the restaurant cannot serve you.</p><select id="bmeth"><option value="mtn">MTN Mobile Money</option><option value="airtel">Airtel Money</option></select><input id="bref" placeholder="Transaction ID *"><p class="bad" id="ber"></p><button class="b full" onclick="bookPay('+r.booking_no+',\''+esc(phone)+'\')">I have paid</button>');return}
  sheet('<h2 class="ok">Booking requested ✓</h2><p>Booking <b>#'+r.booking_no+'</b> at '+esc(r.restaurant)+' · '+bookWhen(at)+' ('+esc(r.meal)+').</p><p class="m">'+(r.total>0?'Pre-ordered dishes will be paid at the restaurant. ':'')+'No Velos charge. The restaurant will confirm your table. Check any time with your booking number and phone.</p><button class="b full" onclick="bookFind()">Check my booking</button><button class="g full" onclick="$(\'sh\').remove()">Close</button>')}
function bookPay(no,phone){var ref=$('bref').value.trim();$('ber').textContent='';rpc('food_booking_pay',{p_no:no,p_phone:phone,p_method:$('bmeth').value,p_ref:ref}).then(function(){$('sh').remove();sheet('<h2 class="ok">Payment received ✓</h2><p>Booking <b>#'+no+'</b>. Velos checks your payment, then the restaurant confirms your table. You will see the status in <b>Check my booking</b>.</p><button class="b full" onclick="bookFind()">Check my booking</button><button class="g full" onclick="$(\'sh\').remove()">Close</button>')}).catch(function(e){$('ber').textContent=String(e.message).slice(0,200)})}
var BSTAT={requested:'Waiting for the restaurant',confirmed:'Confirmed ✓',declined:'Declined by the restaurant',cancelled:'Cancelled',completed:'Completed',no_show:'Marked as not attended',restaurant_failed:'The restaurant could not serve you'},BPAY={none:'',awaiting:'Waiting for your payment',submitted:'Velos is checking your payment',paid:'Paid ✓',refund_due:'Refund on its way',refunded:'Refunded ✓'};
function bookFind(){
  var l={};try{l=JSON.parse(localStorage.getItem('velosLastBooking')||'{}')}catch(e){}
  var d=$('sh');if(d)d.remove();
  sheet('<div class="row"><h2>My booking</h2><button class="g" onclick="$(\'sh\').remove()">Close</button></div><input id="fno" type="number" placeholder="Booking number" value="'+esc(l.no||'')+'"><input id="fph" type="tel" placeholder="Phone you booked with" value="'+esc(l.p||'')+'"><p class="bad" id="ber"></p><button class="b full" onclick="bookShow()">Show</button><div id="fres"></div>');if(l.no&&l.p)bookShow()}
function bookShow(){var no=parseInt($('fno').value,10),ph=$('fph').value.trim();$('ber').textContent='';
  rpc('food_booking_lookup',{p_no:no,p_phone:ph}).then(function(b){if(!b){$('ber').textContent='No booking found. Check the number and phone.';$('fres').innerHTML='';return}
    var open=b.status==='requested'||b.status==='confirmed';
    $('fres').innerHTML='<div class="c"><b>#'+b.booking_no+' · '+esc(b.restaurant)+'</b><br>'+bookWhen(new Date(b.booking_at))+' · '+esc(b.meal)+' · '+b.party_size+' people<br><b>'+esc(BSTAT[b.status]||b.status)+'</b>'+(b.pay_mode==='advance'?'<br><span class="m">'+esc(BPAY[b.pay_status]||'')+' · '+bu(b.items_total)+'</span>':'<br><span class="m">Pay at the restaurant · no Velos charge</span>')+(b.status_note?'<br><span class="m">'+esc(b.status_note)+'</span>':'')+'</div>'+(b.pay_mode==='advance'&&b.pay_status==='awaiting'&&open?'<button class="g full" onclick="bookDone({needs_payment:true,booking_no:'+b.booking_no+',restaurant:\''+esc(b.restaurant).replace(/\\/g,'')+'\',meal:\''+esc(b.meal)+'\',total:'+b.items_total+'},\''+esc(ph)+'\',new Date(\''+b.booking_at+'\'))">Pay now</button>':'')+(open?'<button class="g full" onclick="bookCancel('+b.booking_no+',\''+esc(ph)+'\')">Cancel booking</button>':'')
  }).catch(function(e){$('ber').textContent=String(e.message).slice(0,200)})}
function bookCancel(no,ph){if(!confirm('Cancel this booking?'))return;rpc('food_booking_cancel',{p_no:no,p_phone:ph}).then(function(r){alert(r.refund?'Cancelled. Your refund is on its way.':'Cancelled.');bookShow()}).catch(function(e){alert(e.message)})}
function sheet(h){var d=document.createElement('div');d.className='sheet';d.id='sh';d.innerHTML='<div class="bx">'+h+'</div>';d.onclick=function(e){if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function openCart(){
  if(!Object.keys(cart).length)return;
  sheet('<div class="row"><h2>Your cart</h2><button class="g" onclick="$(\'sh\').remove()">Close</button></div>'+Object.keys(cart).map(function(id){var i=IT[id];return '<div class="row c"><span><b>'+esc(i.name)+'</b>'+(SIDES[id]&&SIDES[id].length?'<br><span class="m">With: '+esc(SIDES[id].join(', '))+'</span>':'')+'<br><span class="m">'+cart[id]+(i.unit==='kg'?' kg':' ×')+' · '+ugx(i.price)+'</span></span><span>'+ugx(i.price*cart[id])+' <button class="g" onclick="rm(\''+id+'\')">✕</button></span></div>'}).join('')
   +'<div class="row"><b>Subtotal</b><b>'+ugx(sub())+'</b></div><p class="m">Delivery is calculated from the map pin on the next step.</p><button class="full" onclick="checkout()">Checkout</button>')}
function rm(id){delete cart[id];delete SIDES[id];cartUI();$('sh').remove();openCart()}
function haversine(a,b,c,d){var R=6371,p=Math.PI/180,x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2),h=x*x+Math.cos(a*p)*Math.cos(c*p)*y*y;return 2*R*Math.asin(Math.sqrt(h))}
function feeOf(s,k){var R=M.rules,free=+R.rule_food_free_km,mid=+R.rule_food_mid_km,pc=+R.rule_food_mid_pct,per=+R.rule_food_customer_per_km;
  if(k>mid)return{fee:Math.round(k*per/100)*100,q:true};if(V.kind==='store')return{fee:Math.round(k*per/100)*100,q:false};if(k>free)return{fee:Math.round(s*pc/100/100)*100,q:false};return{fee:0,q:false}}
function checkout(){
  var c={};try{c=JSON.parse(localStorage.getItem('velosContact')||'{}')}catch(e){}
  $('sh').remove();km=0;quote=false;
  sheet('<div class="row"><h2>Checkout</h2><button class="g" onclick="$(\'sh\').remove()">Close</button></div><input id="cn" placeholder="Full name *" value="'+esc(c.n)+'"><input id="cp" type="tel" placeholder="Phone / WhatsApp *" value="'+esc(c.p)+'"><input id="ce" type="email" placeholder="Email (for order updates)" value="'+esc(c.e)+'">'
   +'<b>How would you like to receive your order?</b><label class="row c"><span><input type="radio" name="fu" value="delivery" checked style="width:auto"> Delivery to my location</span></label><label class="row c"><span><input type="radio" name="fu" value="pickup" style="width:auto"> '+(V.kind==='store'?'Pick up at '+esc(PK.n)+(PK.a?' ('+esc(PK.a)+')':'')+' (no delivery fee)':'Pick up at '+esc(V.name)+' (no delivery fee)')+'</span></label><div id="dlv"><b>Delivery location *</b><div class="m">Search an area, use your GPS, or drag the pin to your exact spot.</div><div class="row"><input id="sq" placeholder="e.g. Ntinda, Kampala" style="flex:1"><button class="g" onclick="geo()">Search</button><button class="g" onclick="gps()">📍 My location</button></div><div id="map"></div>'
   +'<input id="ca" placeholder="Building / landmark / directions *" value="'+esc(c.a)+'"></div><textarea id="cno" rows="2" placeholder="Notes for the restaurant or rider (optional)"></textarea>'
   +'<b>Payment</b><label class="row c"><span><input type="radio" name="pm" value="cash" checked style="width:auto"> Cash on delivery or collection</span></label><label class="row c"><span><input type="radio" name="pm" value="mobile_money" style="width:auto"> Mobile money (MTN / Airtel): pay now on the next page</span></label>'
   +'<div class="c" id="sum"></div><button class="full" id="po" onclick="place()" disabled>Place order</button><div class="m" id="er" style="color:#ff8a80"></div><div class="m">By ordering you agree to our <a href="terms.html" style="color:#e8c766">Terms</a> and <a href="privacy.html" style="color:#e8c766">Privacy Policy</a>.</div>');
  mapObj=L.map('map').setView([V.lat,V.lng],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapObj);
  L.marker([V.lat,V.lng]).addTo(mapObj).bindPopup(V.name);pin=L.marker([V.lat,V.lng],{draggable:true}).addTo(mapObj);pin.on('dragend',function(){setPin(pin.getLatLng().lat,pin.getLatLng().lng)});mapObj.on('click',function(e){setPin(e.latlng.lat,e.latlng.lng)});
  setTimeout(function(){mapObj.invalidateSize()},300);FU='delivery';
  document.querySelectorAll('input[name=fu]').forEach(function(r){r.onchange=function(){FU=r.value;$('dlv').style.display=FU==='delivery'?'':'none';setTimeout(function(){mapObj.invalidateSize()},200);sumUI()}});
  document.querySelectorAll('input[name=pm]').forEach(function(r){r.onchange=sumUI});sumUI()}
function setPin(a,o){pin.setLatLng([a,o]);mapObj.panTo([a,o]);var st=haversine(V.lat,V.lng,a,o);km=Math.round(st*1.3*10)/10;sumUI();
  fetch('https://router.project-osrm.org/route/v1/driving/'+V.lng+','+V.lat+';'+o+','+a+'?overview=false').then(function(r){return r.json()}).then(function(j){if(j.routes&&j.routes[0]){km=Math.max(Math.round(j.routes[0].distance/100)/10,Math.round(st*10)/10);sumUI()}}).catch(function(){})}
function gps(){if(!navigator.geolocation){$('er').textContent='GPS is not available. Search or tap the map.';return}navigator.geolocation.getCurrentPosition(function(p){mapObj.setView([p.coords.latitude,p.coords.longitude],16);setPin(p.coords.latitude,p.coords.longitude)},function(){$('er').textContent='Could not get your location. Search or tap the map.'},{enableHighAccuracy:true,timeout:15000})}
function geo(){var q=$('sq').value.trim();if(!q)return;fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ug,ke,tz,rw&q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){if(j[0]){mapObj.setView([+j[0].lat,+j[0].lon],16);setPin(+j[0].lat,+j[0].lon)}else $('er').textContent='Place not found. Try another name or tap the map.'}).catch(function(){$('er').textContent='Search is unavailable. Tap the map instead.'})}
function payNote(){var m=document.querySelector('input[name=pm]:checked');return m&&m.value==='mobile_money'?'<div class="m">Mobile money orders are held until your payment is received and approved. After you tap Place order you will be taken to our secure payment page.</div>':'<div class="m">Pay in cash when you '+(FU==='pickup'?'collect':'receive')+' your order. Payments are made in Uganda Shillings.</div>'}
function pickNote(){return V.kind==='store'?'Pick-up station: '+esc(PK.n)+(PK.a?', '+esc(PK.a):'')+'. '+esc(PK.note):'Collect at '+esc(V.name)+', '+esc(V.address||'')+'. Please show your order number and phone number.'}
function sumUI(){
  var s=sub();
  if(FU==='pickup'){$('sum').innerHTML='<div class="row"><span>Subtotal</span><span>'+bu(s)+'</span></div><div class="row"><span>Delivery</span><span>None (pick-up)</span></div><div class="row"><b>Total</b><b>'+bu(s)+'</b></div><div class="m">'+pickNote()+'</div>'+payNote();$('po').disabled=false;return}
  var pinned=pin&&(Math.abs(pin.getLatLng().lat-V.lat)>1e-6||Math.abs(pin.getLatLng().lng-V.lng)>1e-6);
  if(!pinned){$('sum').innerHTML='<div class="m">Drop the pin on your delivery spot to see the delivery fee.</div><div class="row"><span>Subtotal</span><b>'+bu(s)+'</b></div>';$('po').disabled=true;return}
  var f=feeOf(s,km);quote=f.q;$('sum').innerHTML='<div class="row"><span>Subtotal</span><span>'+bu(s)+'</span></div><div class="row"><span>Distance</span><span>'+km+' km</span></div><div class="row"><span>Delivery'+(V.kind==='restaurant'&&!f.q&&f.fee===0?' (included, within '+M.rules.rule_food_free_km+' km)':'')+'</span><span>'+(f.fee?bu(f.fee):'Included')+'</span></div><div class="row"><b>Total</b><b>'+bu(s+f.fee)+'</b></div>'
   +(f.q?'<div class="m">Your location is beyond '+M.rules.rule_food_mid_km+' km. Velos confirms this delivery quote before the restaurant starts.</div>':'')+(V.kind==='store'?'<div class="m">The delivery fee is paid on delivery.</div>':'')+payNote();$('po').disabled=false}
function place(){
  var g=function(i){return $(i).value.trim()};$('er').textContent='';
  if(g('cn').length<2||g('cp').length<7){$('er').textContent='Please enter your name and phone number.';return}
  if(FU==='delivery'&&g('ca').length<3){$('er').textContent='Please add a landmark or building for the delivery.';return}
  var ll=FU==='delivery'?pin.getLatLng():null,b=$('po'),pm=document.querySelector('input[name=pm]:checked').value,phone=g('cp');b.disabled=true;b.textContent='Placing order…';
  var items=Object.keys(cart).map(function(id){return{item_id:id,qty:cart[id]}});
  var body={p_vendor:V.id,p_name:g('cn'),p_phone:phone,p_email:g('ce')||null,p_address:FU==='pickup'?'Pick-up at '+V.name:g('ca')+(g('sq')?' · '+g('sq'):''),p_lat:ll?ll.lat:null,p_lng:ll?ll.lng:null,p_km:FU==='delivery'?km:null,p_payment:pm,p_notes:(sidesText()+g('cno')).trim(),p_items:items};
  rpc('food_place_order_v2',Object.assign({p_fulfilment:FU},body)).catch(function(e){if(/food_place_order_v2|PGRST202|schema cache/.test(String(e.message))){if(FU==='pickup')throw new Error('Pick-up needs the latest system update. Please contact us.');return rpc('food_place_order',body).then(function(r){r.grand_total=r.total;return r})}throw e}).then(function(r){
    try{localStorage.setItem('velosContact',JSON.stringify({n:g('cn'),p:phone,e:g('ce'),a:g('ca')}));localStorage.setItem('velosLastFood',r.order_no)}catch(e){}
    cart={};cartUI();$('sh').remove();
    if(r.needs_payment){location.href='pay.html?k=f&o='+r.order_no+'&p='+encodeURIComponent(phone);return}
    var tot=r.grand_total||r.total;
    sheet('<h2 class="ok">Thank you for ordering with Velos Foods ✓</h2><p>Dear '+esc(g('cn'))+', your order <b>#'+r.order_no+'</b> has been placed with '+esc(V.name)+'. Total: <b>'+bu(tot)+'</b>'+(r.delivery_fee?' (delivery '+bu(r.delivery_fee)+', paid on delivery)':'')+'.</p><p class="m">'+(r.needs_quote?'Velos will confirm your delivery quote shortly.':(FU==='pickup'?pickNote():'The restaurant will confirm and start preparing. You can follow every step live.'))+'</p><a class="b full" href="food-track.html?o='+r.order_no+'">Track my order</a><button class="g full" onclick="$(\'sh\').remove()">Close</button>');
  }).catch(function(e){b.disabled=false;b.textContent='Place order';$('er').textContent=String(e.message).slice(0,200)})}
</script></body></html>
