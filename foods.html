  RC=window.VelosPlaces?VelosPlaces.receiver($('rcv')):null;SA=window.VelosPlaces?VelosPlaces.attach($('sq'),{center:function(){return [mapObj.getCenter().lat,mapObj.getCenter().lng]},onPick:function(a,o,label){mapObj.setView([a,o],17);setPin(a,o);$('er').textContent='';if(!$('ca').value&&label)$('ca').value=label},onError:function(m){$('er').textContent=m}}):null;
  if(window.VelosPlaces)VelosPlaces.attach($('ca'),{asTyped:true,center:function(){var q=pin.getLatLng();return [q.lat,q.lng]},context:function(){return $('sq').value},onPick:function(a,o,label){mapObj.setView([a,o],18);setPin(a,o);$('ca').value=label},onTyped:function(t){$('ca').value=t;$('er').textContent='Please tap the map or drag the pin to the exact spot so the rider can find it.'},onError:function(m){$('er').textContent=m}});
  document.querySelectorAll('input[name=fu]').forEach(function(r){r.onchange=function(){FU=r.value;$('dlv').style.display=FU==='delivery'?'':'none';setTimeout(function(){mapObj.invalidateSize()},200);sumUI()}});
  document.querySelectorAll('input[name=pm]').forEach(function(r){r.onchange=sumUI});sumUI()}
function setPin(a,o){pin.setLatLng([a,o]);mapObj.panTo([a,o]);var st=haversine(V.lat,V.lng,a,o);km=Math.round(st*1.3*10)/10;sumUI();
  fetch('https://router.project-osrm.org/route/v1/driving/'+V.lng+','+V.lat+';'+o+','+a+'?overview=false').then(function(r){return r.json()}).then(function(j){if(j.routes&&j.routes[0]){km=Math.max(Math.round(j.routes[0].distance/100)/10,Math.round(st*10)/10);sumUI()}}).catch(function(){})}
function gps(){if(!navigator.geolocation){$('er').textContent='GPS is not available. Search or tap the map.';return}navigator.geolocation.getCurrentPosition(function(p){mapObj.setView([p.coords.latitude,p.coords.longitude],16);setPin(p.coords.latitude,p.coords.longitude)},function(){$('er').textContent='Could not get your location. Search or tap the map.'},{enableHighAccuracy:true,timeout:15000})}
function geo(){if(SA)SA.go();else $('er').textContent='Search is loading. Please try again.'}
function payNote(){var m=document.querySelector('input[name=pm]:checked');return m&&m.value==='mobile_money'?'<div class="m">Mobile money orders are held until your payment is received and approved. After you tap Place order you will be taken to our secure payment page.</div>':'<div class="m">Pay in cash when you '+(FU==='pickup'?'collect':'receive')+' your order. Payments are made in Uganda Shillings.</div>'}
function pickNote(){return V.kind==='store'?'Pick-up station: '+esc(PK.n)+(PK.a?', '+esc(PK.a):'')+'. '+esc(PK.note):'Collect at '+esc(V.name)+', '+esc(V.address||'')+'. Please show your order number and phone number.'}
function sumUI(){
  var s=sub();
  if(FU==='pickup'){$('sum').innerHTML='<div class="row"><span>Subtotal</span><span>'+bu(s)+'</span></div><div class="row"><span>Delivery</span><span>None (pick-up)</span></div><div class="row"><b>Total</b><b>'+bu(s)+'</b></div><div class="m">'+pickNote()+'</div>'+payNote();$('po').disabled=false;return}
  var pinned=pin&&(Math.abs(pin.getLatLng().lat-V.lat)>1e-6||Math.abs(pin.getLatLng().lng-V.lng)>1e-6);
  if(!pinned){$('sum').innerHTML='<div class="m">Drop the pin on your delivery spot to see the delivery fee.</div><div class="row"><span>Subtotal</span><b>'+bu(s)+'</b></div>';$('po').disabled=true;return}
  var f=feeOf(s,km);quote=f.q;$('sum').innerHTML='<div class="row"><span>Subtotal</span><span>'+bu(s)+'</span></div><div class="row"><span>Distance</span><span>'+km+' km</span></div><div class="row"><span>Delivery'+(V.kind==='restaurant'&&!f.q&&f.fee===0?' (included, within '+M.rules.rule_food_free_km+' km)':'')+'</span><span>'+(f.fee?bu(f.fee):'Included')+'</span></div><div class="row"><b>Total</b><b>'+bu(s+f.fee)+'</b></div>'
   +(f.q?'<div class="m">Your location is beyond '+M.rules.rule_food_mid_km+' km. Velos confirms this delivery quote before the restaurant starts.</div>':'')+(V.kind==='store'?'<div class="m">The delivery fee is paid on delivery.</div>':'')+payNote();$('po').disabled=false}
function foodDoc(extra){var g=function(i){var e=$(i);return e?e.value.trim():''};var dl=FU==='delivery'&&km?feeOf(sub(),km).fee:0;
 return Object.assign({store:V.name,date:new Date(),mode:FU,km:km,delivery:dl,customer:{name:g('cn'),phone:g('cp'),email:g('ce'),address:FU==='pickup'?'Pick-up at '+V.name:g('ca')+(g('sq')?' · '+g('sq'):'')},lines:Object.keys(cart).map(function(id){var i=IT[id];return{name:i.name+(SIDES[id]&&SIDES[id].length?' (with '+SIDES[id].join(', ')+')':''),qty:cart[id],unit:i.unit==='kg'?'kg':'piece',price:i.price}}),paid:0},extra||{})}
function foodDraft(){if($('cn').value.trim().length<2){$('er').textContent='Enter your name so it appears on the document.';return}$('er').textContent='';VelosDocs.sheet(foodDoc(),{draft:true})}
function place(){
  var g=function(i){return $(i).value.trim()};$('er').textContent='';
  if(g('cn').length<2||g('cp').length<7){$('er').textContent='Please enter your name and phone number.';return}
  if(FU==='delivery'&&g('ca').length<3){$('er').textContent='Please add a landmark or building for the delivery.';return}
  if(FU==='delivery'&&RC&&RC.error()){$('er').textContent=RC.error();return}
  var ll=FU==='delivery'?pin.getLatLng():null,b=$('po'),pm=document.querySelector('input[name=pm]:checked').value,phone=g('cp');b.disabled=true;b.textContent='Placing order…';
  var items=Object.keys(cart).map(function(id){return{item_id:id,qty:cart[id]}});
  var doc0=foodDoc();
  var body={p_vendor:V.id,p_name:g('cn'),p_phone:phone,p_email:g('ce')||null,p_address:FU==='pickup'?'Pick-up at '+V.name:g('ca')+(g('sq')?' · '+g('sq'):'')+(RC&&RC.label()?' · '+RC.label():''),p_lat:ll?ll.lat:null,p_lng:ll?ll.lng:null,p_km:FU==='delivery'?km:null,p_payment:pm,p_notes:(sidesText()+g('cno')).trim(),p_items:items};
  rpc('food_place_order_v2',Object.assign({p_fulfilment:FU},body)).catch(function(e){if(/food_place_order_v2|PGRST202|schema cache/.test(String(e.message))){if(FU==='pickup')throw new Error('Pick-up needs the latest system update. Please contact us.');return rpc('food_place_order',body).then(function(r){r.grand_total=r.total;return r})}throw e}).then(function(r){
    try{localStorage.setItem('velosContact',JSON.stringify({n:g('cn'),p:phone,e:g('ce'),a:g('ca')}));localStorage.setItem('velosLastFood',r.order_no)}catch(e){}
    doc0.no=r.order_no;doc0.date=new Date();doc0.delivery=FU==='pickup'?0:(r.delivery_fee||doc0.delivery||0);window.LASTFOOD=doc0;
    cart={};cartUI();$('sh').remove();
    if(r.needs_payment){location.href='pay.html?k=f&o='+r.order_no+'&p='+encodeURIComponent(phone);return}
    var tot=r.grand_total||r.total;
    sheet('<h2 class="ok">Thank you for ordering with Velos Foods ✓</h2><p>Dear '+esc(g('cn'))+', your order <b>#'+r.order_no+'</b> has been placed with '+esc(V.name)+'. Total: <b>'+bu(tot)+'</b>'+(r.delivery_fee?' (delivery '+bu(r.delivery_fee)+', paid on delivery)':'')+'.</p><p class="m">'+(r.needs_quote?'Velos will confirm your delivery quote shortly.':(FU==='pickup'?pickNote():'The restaurant will confirm and start preparing. You can follow every step live.'))+'</p><a class="b full" href="food-track.html?o='+r.order_no+'">Track my order</a>'+'<button class="g full" onclick="VelosDocs.sheet(LASTFOOD)">📄 Quotation, invoice or receipt (PDF)</button>'+(window.VelosPush?VelosPush.custBtn(phone,'food',r.order_no):'')+'<button class="g full" onclick="$(\'sh\').remove()">Close</button>');
  }).catch(function(e){b.disabled=false;b.textContent='Place order';$('er').textContent=String(e.message).slice(0,200)})}
