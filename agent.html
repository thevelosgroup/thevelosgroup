<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Agent Portal | The Velos Group</title><meta name="robots" content="noindex">
<style>
:root{--bg:#080d1f;--card:#0f1730;--line:#2a3560;--gold:#e8c766;--txt:#f4f1ea;--mut:#a3adc6;--ok:#7fd99a;--bad:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 Inter,system-ui,sans-serif}
.w{max-width:980px;margin:0 auto;padding:22px 16px 60px}h1{font-family:Georgia,serif;color:var(--gold);margin:0 0 4px}h2{font-family:Georgia,serif;margin:22px 0 8px;font-size:20px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
input,select,textarea{width:100%;padding:12px;margin:5px 0;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}textarea{min-height:80px}
button,a.b{display:inline-block;text-align:center;padding:12px 16px;border:0;border-radius:8px;background:var(--gold);color:#080d1f;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none}
button.g,a.g{background:none;border:1px solid var(--line);color:var(--txt)}.full{width:100%;margin-top:8px}
.m{color:var(--mut);font-size:13px}.bad{color:var(--bad)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px;color:var(--gold)}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line)}.tabs{display:flex;gap:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mut);font-weight:600}
.cols{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}.auth{max-width:440px;margin:6vh auto}}
.box{max-width:520px;margin:5vh auto}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:99px;font-weight:700}
</style></head><body><div class="w"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var ugx=function(n){return 'UGX '+Number(n||0).toLocaleString('en-US')},V=function(h){$('v').innerHTML=h};
function toast(m,b){var t=$('toast');t.textContent=m;t.style.background=b?'#b3261e':'';t.style.color=b?'#fff':'';t.hidden=false;setTimeout(function(){t.hidden=true},2500)}
async function out(){await db.auth.signOut();boot()}
async function boot(){
  var r=await db.auth.getSession(),s=r.data.session;if(!s)return authView();
  var a=await db.from('agents').select('*').eq('id',s.user.id).maybeSingle();
  if(!a.data)return profileView(s.user.email);
  if(a.data.status==='pending')return note('Application received ✓','Thank you, '+esc(a.data.full_name)+'. Our team is reviewing your application and will approve your account shortly. Come back and sign in again to check.');
  if(a.data.status!=='active')return note('Account '+esc(a.data.status),'Please contact the Velos team about your account.');
  dash(a.data);
}
function note(t,p){V('<div class="box"><div class="c"><h1>'+t+'</h1><p>'+p+'</p><button class="g" onclick="out()">Sign out</button></div></div>')}
function authView(){
  V('<div class="auth"><h1>Velos Sales Agents</h1><p class="m">Sell Velos products and services. Earn commission on every completed sale. Track your performance in real time.</p>'
   +'<div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">'
   +'<button class="full" onclick="signIn()">Sign in</button><button class="g full" onclick="signUp()">Create a new account</button><p id="er" class="m bad"></p></div>'
   +'<p class="m">New here? Create an account, then complete your agent profile. Our team reviews every application before you can start.</p></div>');
}
async function signIn(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('er').textContent=r.error.message;else boot()}
async function signUp(){
  var pw=$('pw').value;if(pw.length<8){$('er').textContent='Use a password of at least 8 characters.';return}
  var r=await db.auth.signUp({email:$('em').value.trim(),password:pw});
  if(r.error){$('er').textContent=r.error.message;return}
  if(r.data.session)boot();else{$('er').style.color='#7fd99a';$('er').textContent='Check your email to confirm your account, then sign in here.'}
}
function profileView(email){
  V('<div class="box"><h1>Complete your agent profile</h1><p class="m">Signed in as '+esc(email)+'</p><div class="c"><input id="fn" placeholder="Full name *"><input id="ph" type="tel" placeholder="WhatsApp / phone number *">'
   +'<select id="co"><option>Uganda</option><option>Kenya</option><option>Tanzania</option><option>Rwanda</option><option>Burundi</option><option>South Sudan</option><option>Ethiopia</option><option>DR Congo (East)</option></select>'
   +'<input id="ct" placeholder="Town / city *"><input id="id" placeholder="National ID number *"><select id="pm"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Bank transfer</option></select><input id="pn" placeholder="Payout number or account *">'
   +'<p class="m">Your details are used only to verify you and pay your commission. Commission is earned only on completed sales (delivered orders and completed services) credited to your link or approved by our team. Self-referrals and fake leads lead to suspension.</p>'
   +'<button class="full" onclick="saveProfile()">Submit application</button><p id="er" class="m bad"></p></div><button class="g" onclick="out()">Sign out</button></div>');
}
async function saveProfile(){
  var g=function(i){return $(i).value.trim()};
  if(g('fn').length<2||g('ph').length<7||!g('ct')||g('id').length<5||!g('pn')){$('er').textContent='Please complete every field.';return}
  var r=await db.rpc('register_agent',{p_full_name:g('fn'),p_phone:g('ph'),p_country:g('co'),p_city:g('ct'),p_id_number:g('id'),p_payout_method:g('pm'),p_payout_number:g('pn')});
  if(r.error)$('er').textContent=r.error.message;else boot();
}
async function dash(a){
  var R=await Promise.all([db.rpc('agent_stats'),db.from('agent_payouts').select('amount_ugx,paid_at,reference').order('paid_at',{ascending:false}),db.from('leads').select('*').order('created_at',{ascending:false}).limit(100)]);
  var rows=R[0].data||[],pay=R[1].data||[],leads=R[2].data||[],now=new Date(),cm=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);
  var M={},tr=0,tc=0,mr=0,mc=0,paid=0;
  rows.forEach(function(r){var m=M[r.month]=M[r.month]||{n:0,rev:0,com:0};m.n+=Number(r.n);m.rev+=Number(r.revenue);m.com+=Number(r.commission);tr+=Number(r.revenue);tc+=Number(r.commission);if(r.month===cm){mr+=Number(r.revenue);mc+=Number(r.commission)}});
  pay.forEach(function(p){paid+=Number(p.amount_ugx)});
  var base=location.href.replace(/agent\.html.*$/,''),link=base+'index.html?ref='+a.agent_code;
  var msg='Shop electronics, home appliances and book verified technicians with Velos: '+link;
  var months=Object.keys(M).sort().reverse();
  V('<div class="row"><div><h1>Welcome, '+esc(a.full_name.split(' ')[0])+'</h1><span class="pill">'+esc(a.agent_code)+'</span> <span class="pill">Commission '+a.commission_rate+'%</span></div><button class="g" onclick="out()">Sign out</button></div>'
   +'<div class="stats" style="margin-top:12px"><div class="c stat"><b>'+ugx(mr)+'</b><span class="m">Sales this month</span></div><div class="c stat"><b>'+ugx(mc)+'</b><span class="m">Commission this month</span></div>'
   +'<div class="c stat"><b>'+ugx(tc)+'</b><span class="m">Total commission earned</span></div><div class="c stat"><b>'+ugx(paid)+'</b><span class="m">Paid to you</span></div><div class="c stat"><b>'+ugx(tc-paid)+'</b><span class="m">Balance due</span></div></div>'
   +'<div class="c"><b>Your personal link</b><p class="m">Share this link. Every customer who orders or books through it, within 30 days, is credited to you automatically.</p><input id="lk" readonly value="'+esc(link)+'">'
   +'<button onclick="cp()">Copy link</button> <a class="b g" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msg)+'">Share on WhatsApp</a></div>'
   +'<div class="cols"><div><h2>Add a customer or lead</h2><div class="c"><input id="ln" placeholder="Customer name *"><input id="lp" type="tel" placeholder="Customer phone *"><input id="lm" type="email" placeholder="Email (optional)"><input id="ll" placeholder="Location (town / area)">'
   +'<select id="li"><option value="product">Buying a product</option><option value="service">Needs a service / repair</option><option value="security">Needs security services</option><option value="design">Needs design work</option><option value="sourcing">Needs something sourced</option><option value="gift">Gift request</option><option value="other">Other</option></select>'
   +'<textarea id="lt" placeholder="What does the customer need? Budget? When?"></textarea><button class="full" onclick="addLead()">Submit for approval</button><p class="m">Our team reviews every lead. Approved leads are followed up by Velos and credited to you when the sale completes.</p></div></div>'
   +'<div><h2>Monthly performance</h2><div class="c">'+(months.length?'<table><tr><th>Month</th><th>Sales</th><th>Revenue</th><th>Commission</th></tr>'+months.map(function(m){return '<tr><td>'+m+'</td><td>'+M[m].n+'</td><td>'+ugx(M[m].rev)+'</td><td><b>'+ugx(M[m].com)+'</b></td></tr>'}).join('')+'</table>':'<p class="m">No completed sales yet. Share your link to get started.</p>')+'</div></div></div>'
   +'<h2>My leads</h2><div class="c">'+(leads.length?'<table><tr><th>Customer</th><th>Interest</th><th>Status</th></tr>'+leads.map(function(l){return '<tr><td>'+esc(l.customer_name)+'<br><span class="m">'+esc(l.customer_phone)+'</span></td><td>'+esc(l.interest)+'</td><td><span class="pill">'+esc(l.status)+'</span>'+(l.admin_note?'<br><span class="m">'+esc(l.admin_note)+'</span>':'')+'</td></tr>'}).join('')+'</table>':'<p class="m">No leads yet.</p>')+'</div>'
   +'<div class="c m">Commission is counted when work is completed (orders delivered, services and designs completed) and is paid by our team to your payout number. You can only see your own customers and earnings.</div>');
  window.AG=a;
}
function cp(){var e=$('lk');e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}toast('Link copied')}
async function addLead(){
  var g=function(i){return $(i).value.trim()};
  if(g('ln').length<2||g('lp').length<7){toast('Enter the customer name and phone',true);return}
  var r=await db.from('leads').insert({agent_id:AG.id,customer_name:g('ln'),customer_phone:g('lp'),customer_email:g('lm')||null,location:g('ll')||null,interest:g('li'),notes:g('lt')||null});
  if(r.error)toast(r.error.message,true);else{toast('Submitted for approval');boot()}
}
boot();
</script></body></html>
