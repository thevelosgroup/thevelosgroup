<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your Velos Foods order</title><meta name="robots" content="noindex"><link rel="stylesheet" href="foods.css"></head><body><div class="w" style="max-width:620px">
<div class="top"><h1>Track your order</h1><a href="foods.html">Order more</a></div>
<div class="c"><input id="o" inputmode="numeric" placeholder="Order number (e.g. 7001)"><input id="p" type="tel" placeholder="Phone number used on the order"><button class="full" onclick="go()">Check status</button><div id="e" class="m bad"></div></div><div id="r"></div></div>
<script src="supabase-config.js"></script>
<script>
var S=window.VELOS_SUPABASE,$=function(i){return document.getElementById(i)},T=null,no=0,ph='';
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},ugx=function(n){return 'UGX '+Math.round(n||0).toLocaleString('en-US')};
function rpc(n,b){return fetch(S.url+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:S.key,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||'Request failed');return j})})}
var STEPS=[['placed','Order placed','We have your order.'],['confirmed','Confirmed','The restaurant accepted your order and started the clock.'],['preparing','In preparation','Your food is being prepared.'],['ready','Ready for pickup','Your order is ready and waiting for the rider.'],['out_for_delivery','Out for delivery','The rider has collected your order.'],['in_transit','In transit','Your rider is on the way to you.'],['delivered','Delivered','Enjoy! Thank you for ordering with Velos.']],
PSTEPS=[['placed','Order placed','We have your order.'],['confirmed','Confirmed','The restaurant accepted your order and started the clock.'],['preparing','In preparation','Your food is being prepared.'],['ready','Ready for collection','Your order is ready. Please show your order number and phone number when collecting.'],['collected','Collected','Thank you! Enjoy your meal.']];
try{var c=JSON.parse(localStorage.getItem('velosContact')||'{}');if(c.p)$('p').value=c.p}catch(e){}
var q=new URLSearchParams(location.search);if(q.get('o'))$('o').value=q.get('o');else{var l=localStorage.getItem('velosLastFood');if(l)$('o').value=l}
function go(){no=parseInt($('o').value,10);ph=$('p').value.trim();$('e').textContent='';if(!no||ph.length<7){$('e').textContent='Enter your order number and phone number.';return}load();clearInterval(T);T=setInterval(load,20000)}
function tm(d){return d?new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}
function load(){rpc('food_track',{p_order_no:no,p_phone:ph}).then(function(o){if(!o){$('e').textContent='No order found. Check the number and the phone you used.';return}draw(o)}).catch(function(){$('e').textContent='Could not load right now. Retrying…'})}
function draw(o){
  var pick=o.fulfilment==='pickup',ST=pick?PSTEPS:STEPS,key=o.status==='awaiting_payment'?'placed':o.status,idx=ST.findIndex(function(s){return s[0]===key}),h='',last=ST.length-1,waiting=o.status==='awaiting_payment',phq=encodeURIComponent(ph);
  var bal=Math.max(0,(o.total||0)-(o.paid||0)),steps=ST.map(function(s){return s.slice()});if(waiting)steps[0]=['placed','Awaiting your payment','Your order is held until your payment is received and approved.'];
  if(o.status==='cancelled'){h+='<div class="c"><b class="bad">This order was cancelled.</b><p class="m">'+(o.cancel_reason==='delay'?'It was cancelled because the restaurant took too long. If you paid, your refund is being processed.':o.cancel_reason==='out_of_stock'?'An item was out of stock. If you paid, your refund is being processed.':'If you paid, your refund is being processed.')+'</p></div>'}
  else{
    if(waiting)h+='<div class="c" style="border-color:#e8c766"><b class="gold">Action needed: complete your payment</b><p class="m">Your order is held until your mobile money payment of '+ugx(bal)+' is received and approved.</p><a class="b" href="pay.html?k=f&o='+o.order_no+'&p='+phq+'">Go to the payment page</a></div>';
    var eta='',tr=pick?0:Math.round(o.distance_km*3);
    if(o.ready_by&&!o.ready_at&&['confirmed','preparing'].indexOf(o.status)>-1){var rb=new Date(o.ready_by).getTime()+o.delay_extension_min*60000,left=Math.ceil((rb-Date.now())/60000);
      eta='<div class="c"><b>Ready in about '+Math.max(left,1)+' min</b><div class="m">'+(pick?'Please come to collect around '+tm(new Date(rb)):'Estimated delivery around '+tm(new Date(rb+tr*60000)))+'</div>'+(o.delay_extension_min?'<div class="gold" style="margin-top:6px">⏳ Your order is taking a little longer. We added '+o.delay_extension_min+' minutes and are following up with the restaurant.</div>':'')+'</div>'}
    if(o.needs_quote)eta='<div class="c gold">We are confirming the delivery quote for your distance. The restaurant starts once it is confirmed.</div>';
    h+=eta+'<div class="c"><b>Order #'+o.order_no+' · '+esc(o.vendor)+'</b> <span class="m">· '+(pick?'Pick-up':'Delivery')+'</span><div class="m">Placed '+tm(o.created_at)+'</div><br>'+steps.map(function(s,i){return '<div class="st '+(i<idx?'on':(i===idx?(idx===last?'on':'now'):''))+'"><span class="dot"></span><div><b>'+s[1]+'</b><span class="m">'+(i===idx?s[2]:'')+'</span></div></div>'}).join('')+'</div>';
    if(pick&&o.status!=='collected')h+='<div class="c"><b>Collection</b><p class="m">'+esc(o.vendor)+(o.vendor_address?', '+esc(o.vendor_address):'')+'. Please show your order number and phone number when collecting.</p></div>';
    if(o.rider_name)h+='<div class="c"><b>Your rider: '+esc(o.rider_name)+'</b><div><a class="b" href="tel:'+esc(o.rider_phone)+'" style="margin-top:6px">📞 Call rider</a></div></div>'}
  h+='<div class="c"><b>Order summary</b>'+o.items.map(function(i){return '<div class="row m"><span>'+esc(i.name)+' × '+i.qty+(i.unit==='kg'?' kg':'')+'</span><span>'+ugx(i.total)+'</span></div>'}).join('')+'<div class="row m"><span>'+(pick?'Delivery':'Delivery ('+o.distance_km+' km)')+'</span><span>'+(pick?'None (pick-up)':(o.delivery_fee?ugx(o.delivery_fee):'Included'))+'</span></div><div class="row"><b>Total</b><b>'+ugx(o.total)+'</b></div>'
   +'<div class="row m"><span>Paid</span><span>'+ugx(o.paid)+'</span></div><div class="row"><b>Balance</b><b>'+ugx(bal)+'</b></div><div class="m">'+(o.payment_method==='cash'?'Cash on '+(pick?'collection':'delivery'):'Mobile money')+' · '+esc((o.payment_status||'').replace(/_/g,' '))+'</div>'
   +(bal>0&&!waiting&&o.status!=='cancelled'&&o.payment_method!=='cash'?'<a class="b" style="margin-top:8px" href="pay.html?k=f&o='+o.order_no+'&p='+phq+'">Pay the balance</a>':'')+'</div>';
  var ap=(o.payments||[]).filter(function(p){return p.status==='approved'}),pe=(o.payments||[]).filter(function(p){return p.status==='pending'});
  if(pe.length)h+='<div class="c gold"><b>⏳ Payment submitted</b><div class="m">We are verifying your payment and will update you shortly.</div></div>';
  if(ap.length)h+='<div class="c"><b>Receipts</b>'+ap.map(function(p){return '<div class="row m"><span>R'+p.receipt_no+' · '+ugx(p.amount)+'</span><a href="receipt.html?k=f&o='+o.order_no+'&r='+p.receipt_no+'" class="gold">View receipt</a></div>'}).join('')+'</div>';
  if((o.messages||[]).length)h+='<div class="c"><b>Updates from Velos Foods</b>'+o.messages.map(function(m){return '<div style="margin:8px 0;padding-bottom:8px;border-bottom:1px solid #2a3560"><div class="m">'+new Date(m.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})+'</div><div>'+esc(String(m.message).replace(/ ?(Track|View receipt): https?:\/\/\S+/,'').replace(/ here: https?:\/\/\S+/,'.'))+'</div></div>'}).join('')+'</div>';
  if(o.status==='delivered'||o.status==='collected')h+=o.rating?'<div class="c ok">Thank you for rating: '+'★'.repeat(o.rating)+'</div>':'<div class="c"><b>How was your order?</b><div id="stars" style="font-size:32px;cursor:pointer;color:#e8c766">'+[1,2,3,4,5].map(function(n){return '<span onclick="star('+n+')">☆</span>'}).join('')+'</div><textarea id="rv" rows="2" placeholder="Write a short review (optional)"></textarea><button class="full" onclick="rate()">Submit review</button></div>';
  $('r').innerHTML=h;window.RS=0}
function star(n){window.RS=n;var s=$('stars').children;for(var i=0;i<5;i++)s[i].textContent=i<n?'★':'☆'}
function rate(){if(!window.RS){alert('Tap a star rating first.');return}rpc('food_rate',{p_order_no:no,p_phone:ph,p_rating:window.RS,p_review:$('rv').value}).then(load).catch(function(e){alert(e.message)})}
if($('o').value&&$('p').value)go();
</script></body></html>
