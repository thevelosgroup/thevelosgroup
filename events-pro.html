<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1f"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Velos Events | Planner Dashboard</title><meta name="description" content="Register your decoration, wedding and event business on Velos Events. Show your work, get quote requests, and be paid safely."><meta name="robots" content="noindex">
<link rel="stylesheet" href="foods.css">
<style>
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.cats label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-size:14px}.cats input{width:auto;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,textarea{width:100%;padding:12px;margin:5px 0;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:14px 8px;text-align:left}.seg button.on{border-color:var(--gold);background:rgba(232,199,102,.12)}.seg small{display:block;color:var(--mut);font-weight:400}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.pipe button{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:8px 2px;font-size:12px}.pipe button b{display:block;font-size:20px;color:var(--gold)}.pipe button.on{border-color:var(--gold);background:rgba(232,199,102,.12)}
.lead{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}.lead h3{margin:0 0 4px;font-size:17px}.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mut)}.kv b{color:var(--txt)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.gal div{position:relative;border-radius:10px;overflow:hidden;background:#0b1226;aspect-ratio:1}.gal img,.gal video{width:100%;height:100%;object-fit:cover}.gal button{position:absolute;top:4px;right:4px;padding:3px 8px;background:rgba(0,0,0,.7);color:#fff;font-size:13px}.gal span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);font-size:11px;padding:1px 6px;border-radius:99px}
.step{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.step.done{border-color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.warn{border:1px solid #c9a227;background:rgba(232,199,102,.08);border-radius:12px;padding:10px;font-size:14px}
@media(max-width:430px){.row2{grid-template-columns:1fr}}
</style></head>
<body><div class="w" style="max-width:900px"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="velos-guard-config.js"></script><script src="velos-guard.js?v=67"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="velos-letterhead.js?v=86"></script>
<script>
var S = window.VELOS_SUPABASE, db = supabase.createClient(S.url, S.key), $ = function(i){ return document.getElementById(i); }, V = function(h){ $('v').innerHTML = h; };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }, ugx = function(n){ return 'UGX ' + Math.round(+n || 0).toLocaleString('en-US'); };
function toast(m, b){ var t = $('toast'); t.textContent = m; t.style.background = b ? '#b3261e' : ''; t.style.color = b ? '#fff' : ''; t.hidden = false; setTimeout(function(){ t.hidden = true; }, 2800); }
var SERVICES = [['decor','Decoration & styling'],['wedding','Wedding planning'],['intro','Kwanjula / introduction'],['bridal','Bride & groom fashion'],['party','Birthday & parties'],['corporate','Corporate events'],['rentals','Tents, chairs & equipment'],['mcdj','MC, DJ & sound'],['photo','Photo & video'],['makeup','Makeup & hair']];
var TYPES = SERVICES.map(function(s){ return s[0]; }), LBL = {}; SERVICES.forEach(function(s){ LBL[s[0]] = s[1]; });

var AGR = [
 ['Parties and role','This agreement is between The Velos Group ("Velos") and the planner, decorator or event supplier named below ("the Planner"). The Planner is an independent business and is listed on Velos Events to show their work and receive booking requests. Nothing here makes the Planner an employee or partner of Velos.'],
 ['True information','The Planner confirms that the identity, licence or LC1 letter, photos, videos and details given to Velos are true and belong to the Planner. Velos may ask for proof at any time and may remove any listing that is false or misleading.'],
 ['Bookings and quotes','Customers send requests through Velos. The Planner replies with a clear total price and what it includes. Once the customer accepts, the booking is confirmed only after Velos confirms the deposit. The Planner must not start buying or preparing before the deposit is confirmed.'],
 ['How payment works','Customers pay Velos, not the Planner. Velos holds the money. After the event, the Planner marks it done in the Velos app. The customer then confirms, or 48 hours pass with no problem reported, and Velos pays the Planner by Mobile Money to the number registered with Velos. If the customer reports a problem, Velos reviews it and decides fairly, hearing the Planner first.'],
 ['Velos commission','Velos keeps a commission of 10% of the agreed price of each completed booking. The Planner receives the rest. Velos may change the commission with written notice in the app, which applies only to bookings made after the notice.'],
 ['Customers introduced by Velos','Customers Velos introduces remain Velos customers. For 12 months after a booking the Planner will not take work from that customer, or from anyone connected to that booking, outside the Velos platform, will not give them a personal number to pay or book directly, and will not ask them to cancel a Velos booking. Customers are free to choose, but any further work must go through Velos.'],
 ['If this clause is broken','Velos may suspend or end this agreement at once, withhold earnings not yet paid, and charge the Planner a fee equal to 20% of the value of the work done outside Velos (at least UGX 100,000). Velos records of the booking may be used as evidence, and Velos will always hear the Planner first.'],
 ['Quality and delivery','The Planner will deliver the event as quoted, on time and to a professional standard, and will tell the customer and Velos immediately if something cannot be delivered. If the Planner cancels or does not deliver, the customer is refunded in full and the Planner may be suspended.'],
 ['Photos, videos and content','The Planner posts only their own work, or work they have permission to use, and will not post anything unlawful, indecent or misleading. The Planner allows Velos to show and promote the posted content on Velos pages, social media and Google. The Planner may remove content at any time.'],
 ['Customer data','The Planner will use customer names, phone numbers and addresses only to deliver the booking, will not share or sell them, and follows the Data Protection and Privacy Act, 2019 of Uganda.'],
 ['Suspension and ending','Either side may end this agreement with 7 days notice. Velos may suspend or end it immediately for fraud, abuse of customers, repeated non-delivery or breach of this agreement. Money already earned for completed and confirmed bookings is still paid.'],
 ['Law','This agreement is governed by the laws of Uganda and is read together with the Velos Terms of Service. Any dispute will first be discussed in good faith.']
];
var ME = null, TAB = 'pipe', STG = 'new', LEADS = [], MEDIA = [], PK = [], ROUTE = 'licensed';
function hero(){ return '<div style="text-align:center;margin:6px 0 14px"><img src="logo-mark.png" alt="The Velos Group" style="height:64px"><h1>Velos Events</h1><p class="m">For decorators, wedding and event planners, bridal fashion and event suppliers. Show your work, get booked, be paid safely.</p></div>'; }

async function boot(){
  var r = await db.auth.getSession(), s = r.data.session; if(!s) return auth();
  var m = await db.rpc('event_me'); ME = m.data;
  if(!ME) return applyForm(s.user.email);
  if(ME.status !== 'active') return pending();
  show();
}
function auth(){ V(hero() + '<div class="pg" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px"><div class="c" style="text-align:center">📸<br><b>Post your photos and videos</b></div><div class="c" style="text-align:center">📩<br><b>Get quote requests</b></div><div class="c" style="text-align:center">🔒<br><b>Velos holds the customer\'s money until the job is done</b></div></div>'
  + '<div class="c"><h2>Sign in or create your account</h2><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><div class="row2"><button onclick="si()">Sign in</button><button class="g" onclick="su()">Create account</button></div><p id="er" class="m bad"></p><p class="m">Registration is free. Terms and conditions are shown when you tap Register.</p></div>'
  + '<p class="m" style="text-align:center"><a href="events.html" style="color:var(--gold)">See the Velos Events gallery</a></p>'); }
async function si(){ var r = await db.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value}); if(r.error) $('er').textContent = r.error.message; else boot(); }
async function su(){ var pw = $('pw').value; if(pw.length < 8){ $('er').textContent = 'Use at least 8 characters.'; return; } var r = await db.auth.signUp({email:$('em').value.trim(), password:pw}); if(r.error){ $('er').textContent = r.error.message; return; } if(r.data.session) boot(); else $('er').textContent = 'Check your email to confirm, then sign in.'; }
async function out(){ await db.auth.signOut(); ME = null; boot(); }

/* ---------- registration ---------- */
function applyForm(email){
  V(hero() + '<div class="c"><h2>1. What do you offer?</h2><p class="m">Tick everything that applies.</p><div class="cats">' + SERVICES.map(function(s){ return '<label><input type="checkbox" name="sv" value="' + s[0] + '">' + s[1] + '</label>'; }).join('') + '</div></div>'
  + '<div class="c"><h2>2. Business details</h2><input id="bn" placeholder="Business name *"><input id="ow" placeholder="Owner\'s full name *" autocomplete="name"><div class="row2"><input id="ph" type="tel" placeholder="Phone / WhatsApp *"><input id="em2" type="email" placeholder="Business email" value="' + esc(email) + '"></div>'
  + '<div class="row2"><select id="co"><option>Uganda</option><option>Kenya</option><option>Rwanda</option><option>Tanzania</option></select><input id="ci" placeholder="City / town *"></div><input id="ar" placeholder="Other areas you work in (optional)"><div class="row2"><input id="yr" type="number" min="0" max="60" placeholder="Years of experience"><span></span></div><textarea id="bio" rows="3" placeholder="Tell customers about your work (style, events you love, what makes you different)"></textarea></div>'
  + '<div class="c"><h2>3. How is your business recognised?</h2><div class="seg"><button type="button" id="rt-licensed" class="on" onclick="setRoute(\'licensed\')">🏢 I have a licence<small>Trading licence + TIN</small></button><button type="button" id="rt-lc1" onclick="setRoute(\'lc1\')">📝 No licence yet<small>Letter from my LC1 chairperson</small></button></div>'
  + '<div id="rLic"><input id="lic" placeholder="Trading licence number *"><input id="tin" placeholder="TIN (Tax Identification Number) *"></div>'
  + '<div id="rLc" style="display:none"><input id="lv" placeholder="Village / LC1 area *"><div class="row2"><input id="ln" placeholder="LC1 chairperson name *"><input id="lp" type="tel" placeholder="LC1 chairperson phone *"></div><p class="m">Velos may call the LC1 chairperson to confirm. You will upload the signed, stamped LC1 letter in the next step.</p></div></div>'
  + '<div class="c"><h2>4. How should Velos pay you?</h2><select id="pm"><option value="mtn">MTN Mobile Money</option><option value="airtel">Airtel Money</option></select><div class="row2"><input id="pa" type="tel" placeholder="Mobile money number *"><input id="pn" placeholder="Name on that number *"></div></div>'
  + '<div class="c"><h2>5. Terms and conditions</h2><p class="m">Please read them. You will sign the full agreement on your phone in the next step.</p><details style="margin:8px 0"><summary style="cursor:pointer;color:var(--gold);font-weight:700">Read the terms and conditions</summary><div style="margin-top:8px">' + AGR.map(function(c, i){ return '<p style="margin:8px 0"><b>' + (i + 1) + '. ' + esc(c[0]) + '.</b> <span class="m">' + esc(c[1]) + '</span></p>'; }).join('') + '</div></details><label style="display:flex;gap:8px;align-items:flex-start"><input id="agr" type="checkbox" style="width:auto;margin-top:4px"><span class="m">I have read and accept the terms and conditions.</span></label><button class="full" onclick="applySend()">Continue: upload my documents</button><p id="er" class="m bad"></p><p class="m">Next: National ID, passport photo and your licence or LC1 letter. All are private and only Velos staff can see them. Registration is free.</p></div><button class="g" onclick="out()">Sign out</button>');
}
function setRoute(r){ ROUTE = r; $('rt-licensed').className = r === 'licensed' ? 'on' : ''; $('rt-lc1').className = r === 'lc1' ? 'on' : ''; $('rLic').style.display = r === 'licensed' ? '' : 'none'; $('rLc').style.display = r === 'lc1' ? '' : 'none'; }
async function applySend(){
  if(!$('agr').checked){ $('er').textContent = 'Please read and accept the terms and conditions.'; return; }
  var g = function(i){ return $(i).value.trim(); }, sv = [].slice.call(document.querySelectorAll('input[name=sv]:checked')).map(function(x){ return x.value; });
  if(!sv.length){ $('er').textContent = 'Tick at least one service.'; return; }
  if(g('bn').length < 2 || g('ow').length < 2 || g('ph').length < 7 || !g('ci') || g('pa').length < 7 || g('pn').length < 2){ $('er').textContent = 'Please complete all fields marked *.'; return; }
  var r = await db.rpc('event_apply', {p_business:g('bn'), p_owner:g('ow'), p_services:sv, p_country:$('co').value, p_city:g('ci'), p_areas:g('ar'), p_phone:g('ph'), p_email:g('em2'), p_bio:g('bio'), p_years:g('yr') ? +g('yr') : null, p_route:ROUTE,
    p_licence:g('lic'), p_tin:g('tin'), p_lc1_village:g('lv'), p_lc1_name:g('ln'), p_lc1_phone:g('lp'), p_payout_method:$('pm').value, p_payout_account:g('pa'), p_payout_name:g('pn')});
  if(r.error){ $('er').textContent = r.error.message; return; } toast('Application saved ✓'); boot();
}

/* ---------- documents + waiting for approval ---------- */
function docList(){ var l = [['nid_front','National ID (front)', 'Clear photo of the owner\'s National ID'], ['nid_back','National ID (back)', 'Optional'], ['passport_photo','Passport-size photo of the owner', 'Face clearly visible']];
  l.push(ME.route === 'licensed' ? ['licence','Trading licence', 'Photo or PDF'] : ['lc1_letter','LC1 letter', 'Signed and stamped by the LC1 chairperson']); return l; }
function pending(){
  var d = ME.docs || {}, L = docList(), need = L.filter(function(x){ return x[0] !== 'nid_back'; }), have = need.filter(function(x){ return d[x[0]]; }).length, signed = !!d.agreement, st = ME.status;
  var total = need.length + 1, got = have + (signed ? 1 : 0), ready = got === total;
  var msg = st === 'pending' ? (ready ? 'All done. Velos is reviewing your application. You will be able to sign in and post once approved.' : 'Complete the steps below. Velos reviews your application as soon as everything is in.') : st === 'rejected' ? 'Your application was not approved.' : 'Your profile is paused.';
  V(hero() + '<div class="c"><div class="row"><h2>' + esc(ME.business_name) + '</h2><span class="pill gold">' + esc(st) + '</span></div><p class="m">' + msg + '</p>' + (ME.note ? '<p class="warn">Message from Velos: ' + esc(ME.note) + '</p>' : '') + '<div class="bar"><i style="width:' + Math.round(100 * got / total) + '%"></i></div><p class="m">' + got + ' of ' + total + ' steps complete</p></div>'
  + '<div class="c"><h2>Step 1: your documents</h2>' + L.map(function(x){ var ok = d[x[0]]; return '<div class="step ' + (ok ? 'done' : '') + '"><div style="flex:1"><b>' + (ok ? '✅ ' : '') + x[1] + '</b><div class="m">' + x[2] + '</div><div id="s-' + x[0] + '" class="m"></div><input type="file" id="f-' + x[0] + '" accept="image/*,application/pdf" style="display:none" onchange="picked(\'' + x[0] + '\')"><div class="row2"><button type="button" class="g" onclick="$(\'f-' + x[0] + '\').click()">' + (ok ? 'Replace file' : '📎 Choose file') + '</button><button type="button" id="u-' + x[0] + '" onclick="docUp(\'' + x[0] + '\')" disabled>⬆ Upload</button></div></div></div>'; }).join('') + '<p class="m">Private. Only Velos staff can open these files.</p></div>'
  + '<div class="c"><h2>Step 2: sign your agreement</h2>' + (signed ? '<div class="step done"><b>✅ Agreement signed.</b></div><p class="m">A signed copy is saved with Velos.</p>' : '<p class="m">Read the agreement, then sign with your finger on your phone.</p><details style="margin:8px 0"><summary style="cursor:pointer;color:var(--gold);font-weight:700">Read the agreement</summary><div style="margin-top:8px">' + AGR.map(function(c, i){ return '<p style="margin:8px 0"><b>' + (i + 1) + '. ' + esc(c[0]) + '.</b> <span class="m">' + esc(c[1]) + '</span></p>'; }).join('') + '</div></details>'
   + '<input id="sn" placeholder="Type your full name *" value="' + esc(ME.owner_name || '') + '" autocomplete="name"><label class="m">Sign inside the box</label><canvas id="sg" width="600" height="220" style="width:100%;height:150px;background:#fff;border-radius:10px;touch-action:none"></canvas><div class="row2" style="margin-top:6px"><button type="button" class="g" onclick="sigClear()">Clear</button><span></span></div>'
   + '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px"><input id="sa" type="checkbox" style="width:auto;margin-top:4px"><span class="m">I have read this agreement and I sign it as ' + esc(ME.business_name) + '.</span></label><button class="full" onclick="signAgr()">✍️ Sign agreement</button>') + '<p id="se" class="m"></p></div>'
  + (ME.route === 'lc1' ? '<div class="warn">You chose the LC1 letter route. Once you are registered with URSB and have a trading licence you can add it later for a verified-licence badge.</div>' : '') + '<button class="g" onclick="out()" style="margin-top:12px">Sign out</button>');
  if(!signed) sigInit();
}
var SIGN = {ink:false};
function sigInit(){ var c = $('sg'); if(!c) return; var x = c.getContext('2d'); x.lineWidth = 3; x.lineCap = 'round'; x.strokeStyle = '#0a1230'; SIGN.ink = false;
  var pos = function(ev){ var r = c.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev; return [(t.clientX - r.left) * c.width / r.width, (t.clientY - r.top) * c.height / r.height]; }, down = false;
  var st = function(ev){ ev.preventDefault(); down = true; var p = pos(ev); x.beginPath(); x.moveTo(p[0], p[1]); }, mv = function(ev){ if(!down) return; ev.preventDefault(); var p = pos(ev); x.lineTo(p[0], p[1]); x.stroke(); SIGN.ink = true; }, en = function(){ down = false; };
  c.addEventListener('touchstart', st, {passive:false}); c.addEventListener('touchmove', mv, {passive:false}); c.addEventListener('touchend', en); c.addEventListener('mousedown', st); c.addEventListener('mousemove', mv); window.addEventListener('mouseup', en); }
function sigClear(){ var c = $('sg'); c.getContext('2d').clearRect(0, 0, c.width, c.height); SIGN.ink = false; }
function toData(url){ return fetch(url).then(function(r){ return r.blob(); }).then(function(b){ return new Promise(function(ok){ var fr = new FileReader(); fr.onload = function(){ ok(fr.result); }; fr.readAsDataURL(b); }); }); }
async function signAgr(){
  var name = $('sn').value.trim(); if(name.length < 3){ $('se').textContent = 'Type your full name.'; return; } if(!SIGN.ink){ $('se').textContent = 'Please sign inside the box.'; return; } if(!$('sa').checked){ $('se').textContent = 'Tick the box to confirm.'; return; }
  $('se').className = 'm'; $('se').textContent = 'Preparing your signed agreement…';
  try{
    var J = window.jspdf.jsPDF, doc = new J({unit:'mm', format:'a4'}), W = 210, M = 15, TX = [30,36,56], NV = [3,17,62];
    var vsig = null; try{ vsig = await toData('signature.png'); }catch(e){} await VelosLH.load();
    var y = VelosLH.first(doc), today = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
    doc.setFont('times', 'bold'); doc.setFontSize(19); doc.setTextColor(NV[0], NV[1], NV[2]); doc.text('Velos Events Partner Agreement', M, y); y += 7;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(110, 118, 140); doc.text('Issued ' + today, M, y); y += 8;
    doc.setFillColor(244, 246, 251); doc.rect(M, y - 4, W - 2 * M, 16, 'F'); doc.setFontSize(10); doc.setTextColor(TX[0], TX[1], TX[2]);
    doc.setFont('helvetica', 'bold'); doc.text('Planner:', M + 3, y + 1); doc.text('Owner:', M + 3, y + 7); doc.setFont('helvetica', 'normal'); doc.text(String(ME.business_name), M + 24, y + 1); doc.text(name + '  |  ' + (ME.country || 'Uganda'), M + 24, y + 7); y += 19;
    AGR.forEach(function(c, i){ var lines = doc.splitTextToSize(c[1], W - 2 * M); if(y + 6 + lines.length * 4.6 > 272){ doc.addPage(); y = VelosLH.next(doc); } doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(NV[0], NV[1], NV[2]); doc.text((i + 1) + '. ' + c[0], M, y); y += 5; doc.setFont('helvetica', 'normal'); doc.setTextColor(TX[0], TX[1], TX[2]); doc.text(lines, M, y); y += lines.length * 4.6 + 3; });
    if(y > 225){ doc.addPage(); y = VelosLH.next(doc); } y += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(110, 118, 140); doc.text('By signing, the Planner confirms the details are true and agrees to these terms.', M, y); y += 8;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(NV[0], NV[1], NV[2]); doc.text('Signed for the Planner', M, y); doc.text('Signed for The Velos Group', 115, y); y += 3;
    doc.addImage($('sg').toDataURL('image/png'), 'PNG', M, y, 60, 22); if(vsig) doc.addImage(vsig, 'PNG', 115, y, 50, 22); y += 25; doc.setDrawColor(110, 118, 140); doc.setLineWidth(.3); doc.line(M, y, M + 70, y); doc.line(115, y, 185, y); y += 5;
    doc.setFont('helvetica', 'normal'); doc.setTextColor(TX[0], TX[1], TX[2]); doc.text(name, M, y); doc.text('Authorised signatory', 115, y); y += 5; doc.text(today, M, y); doc.text(today, 115, y);
    VelosLH.finish(doc, 'Events Partner Agreement');
    var blob = doc.output('blob'), uid = (await db.auth.getUser()).data.user.id, path = uid + '/agreement-' + Date.now() + '.pdf';
    var u = await db.storage.from('event-docs').upload(path, blob, {contentType:'application/pdf'}); if(u.error) throw u.error;
    var r = await db.rpc('event_doc_set', {p_key:'agreement', p_path:path}); if(r.error) throw r.error;
    toast('Agreement signed ✓'); var m = await db.rpc('event_me'); ME = m.data; pending();
  }catch(err){ $('se').className = 'm bad'; $('se').textContent = (err && err.message) || 'Could not save. Please try again.'; }
}
function shrink(file, max){ return new Promise(function(ok){ if(file.type === 'application/pdf') return ok(file); var im = new Image(), u = URL.createObjectURL(file); im.onload = function(){ var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(function(b){ ok(b || file); }, 'image/jpeg', .85); }; im.onerror = function(){ ok(file); }; im.src = u; }); }
function picked(k){ var f = $('f-' + k).files[0]; $('s-' + k).className = 'm'; $('s-' + k).textContent = f ? 'Selected: ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB). Now tap Upload.' : ''; $('u-' + k).disabled = !f; }
async function docUp(k){
  var f = $('f-' + k).files[0], s = $('s-' + k); if(!f){ s.className = 'm bad'; s.textContent = 'Choose a file first.'; return; }
  s.className = 'm'; s.textContent = 'Uploading… please wait'; $('u-' + k).disabled = true;
  try{
    var uid = (await db.auth.getUser()).data.user.id, b = await shrink(f, 1800), pdf = f.type === 'application/pdf', path = uid + '/' + k + '-' + Date.now() + (pdf ? '.pdf' : '.jpg');
    var u = await db.storage.from('event-docs').upload(path, b, {contentType:pdf ? 'application/pdf' : 'image/jpeg'}); if(u.error) throw u.error;
    var r = await db.rpc('event_doc_set', {p_key:k, p_path:path}); if(r.error) throw r.error; toast('Received ✓'); var m = await db.rpc('event_me'); ME = m.data; pending();
  }catch(err){ s.className = 'm bad'; s.textContent = 'Could not upload: ' + ((err && err.message) || 'try again') + '. If it says "row-level security", tell Velos support.'; $('u-' + k).disabled = false; }
}

/* ---------- dashboard ---------- */
function show(){
  var tabs = [['pipe','📩 Bookings'],['port','🖼 Portfolio'],['pk','🎁 Packages'],['prof','👤 Profile'],['earn','💰 Earnings']];
  V('<div class="top"><a href="events.html"><img src="logo-mark.png" alt=""><span>Velos Events</span></a><div><a href="events.html?p=' + esc(ME.slug) + '">View my public page</a> · <a href="#" onclick="out();return false">Sign out</a></div></div><h1>' + esc(ME.business_name) + '</h1><p class="m">Velos holds each customer\'s payment safely and pays you after the event. Velos keeps ' + ME.commission + '% on completed bookings.</p><div class="tabs" id="tb">' + tabs.map(function(t){ return '<button id="t-' + t[0] + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div><div id="bd"></div>');
  go(TAB);
}
function go(t){ TAB = t; ['pipe','port','pk','prof','earn'].forEach(function(k){ $('t-' + k).className = k === t ? 'on' : ''; }); ({pipe:pipe, port:port, pk:pks, prof:prof, earn:earn})[t](); }
var bd = function(){ return $('bd'); };
var STAGES = [['new','New','new'],['quoted','Quoted','quoted'],['booked','Booked',['accepted','deposit_paid','paid']],['done','Done','completed'],['closed','Closed',['declined','cancelled','refunded']]];
function inStage(l, s){ var m = STAGES.filter(function(x){ return x[0] === s; })[0][2]; return Array.isArray(m) ? m.indexOf(l.status) > -1 : l.status === m; }
async function pipe(){
  bd().innerHTML = '<p class="m">Loading…</p>'; LEADS = (await db.rpc('event_leads_mine')).data || [];
  var h = '<div class="pipe">' + STAGES.map(function(s){ return '<button class="' + (s[0] === STG ? 'on' : '') + '" onclick="STG=\'' + s[0] + '\';pipe()"><b>' + LEADS.filter(function(l){ return inStage(l, s[0]); }).length + '</b>' + s[1] + '</button>'; }).join('') + '</div>';
  var L = LEADS.filter(function(l){ return inStage(l, STG); });
  if(!L.length) h += '<div class="c"><p class="m">Nothing here yet. ' + (STG === 'new' ? 'Post more photos and videos to get quote requests.' : '') + '</p></div>';
  h += L.map(leadCard).join(''); bd().innerHTML = h;
}
var SL = {new:'New request', quoted:'Waiting for customer', accepted:'Accepted: waiting for deposit', deposit_paid:'Deposit paid. You can start', paid:'Fully paid', completed:'Event done', declined:'Declined', cancelled:'Cancelled', refunded:'Refunded'};
function leadCard(l){
  var h = '<div class="lead"><div class="row"><h3>#' + l.lead_no + ' · ' + esc(LBL[l.event_type] || l.event_type || 'Event') + '</h3><span class="pill gold">' + esc(SL[l.status] || l.status) + '</span></div><div class="kv"><span>👤 <b>' + esc(l.name) + '</b></span>' + (l.phone ? '<span>📞 <b>' + esc(l.phone) + '</b></span>' : '') + '<span>📅 <b>' + esc(l.event_date || 'Date not set') + '</b></span><span>📍 ' + esc(l.city || '') + ' ' + esc(l.venue || '') + '</span>' + (l.guests ? '<span>👥 ' + l.guests + ' guests</span>' : '') + (l.budget ? '<span>Budget ' + ugx(l.budget) + '</span>' : '') + '</div>' + (l.package ? '<div class="m">Package: ' + esc(l.package) + '</div>' : '') + (l.message ? '<p style="margin:8px 0">' + esc(l.message) + '</p>' : '');
  if(l.status === 'new' || l.status === 'quoted') h += '<input id="qa' + l.lead_no + '" type="number" min="10000" placeholder="Your total price in UGX" value="' + esc(l.quote || '') + '"><textarea id="qn' + l.lead_no + '" rows="2" placeholder="What the price includes, setup time, anything the customer should know">' + esc(l.quote_note || '') + '</textarea><div class="row2"><button onclick="sendQuote(' + l.lead_no + ')">' + (l.status === 'new' ? 'Send quote' : 'Update quote') + '</button><button class="g" onclick="decline(' + l.lead_no + ')">Decline</button></div><p class="m">Customers see your total. Velos keeps ' + ME.commission + '%, you receive the rest.</p>';
  if(l.quote && l.status !== 'new' && l.status !== 'quoted') h += '<div class="kv"><span>Price <b>' + ugx(l.quote) + '</b></span><span>Velos ' + (l.commission_pct || ME.commission) + '%: ' + ugx(l.commission) + '</span><span>You receive <b class="ok">' + ugx(l.you_get) + '</b></span><span>Paid by customer so far: ' + ugx(l.paid) + '</span></div>';
  if(l.status === 'accepted') h += '<p class="warn">Wait for the deposit to be confirmed before you buy or start anything.</p>';
  if(l.status === 'deposit_paid') h += '<p class="warn">The deposit is safe with Velos. Start preparing. The balance is due before the event; you can mark it done after the customer has paid in full and the date has arrived.</p>';
  if(l.status === 'paid') h += '<button class="full" onclick="done(' + l.lead_no + ')">✅ Event is done</button><p class="m">Available on the event date. After this the customer confirms or waits ' + ME.hold_hours + ' hours, then Velos pays you.</p>';
  if(l.status === 'completed') h += '<p class="m">' + (l.paid_out_at ? '💰 Paid out ' + esc(String(l.paid_out_at).slice(0, 10)) + (l.payout_ref ? ' · ref ' + esc(l.payout_ref) : '') : l.dispute === 'open' ? '⚠️ The customer reported a problem. Velos is reviewing it.' : l.confirmed ? 'Customer confirmed. Payout is being prepared.' : 'Payout after the customer confirms, or after ' + esc(String(l.release_at || '').slice(0, 16).replace('T', ' ')) + '.') + '</p>';
  return h + '</div>';
}
async function sendQuote(n){ var a = +$('qa' + n).value; if(!(a >= 10000)){ toast('Enter your total price in UGX', 1); return; } var r = await db.rpc('event_quote', {p_no:n, p_amount:a, p_note:$('qn' + n).value}); if(r.error) toast(r.error.message, 1); else { toast('Quote sent ✓'); pipe(); } }
async function decline(n){ if(!confirm('Decline this request?')) return; var r = await db.rpc('event_decline', {p_no:n}); if(r.error) toast(r.error.message, 1); else pipe(); }
async function done(n){ if(!confirm('Confirm the event has been completed?')) return; var r = await db.rpc('event_mark_done', {p_no:n}); if(r.error) toast(r.error.message, 1); else { toast('Marked done ✓'); pipe(); } }

/* ---------- portfolio ---------- */
async function port(){
  bd().innerHTML = '<p class="m">Loading…</p>'; MEDIA = (await db.rpc('event_media_mine')).data || [];
  var h = '<div class="c"><h2>Add your work</h2><p class="m">Real photos and videos of events you did. Customers book people whose work they can see. Photos are resized automatically. Videos up to 50 MB, or paste a YouTube, TikTok, Facebook or Instagram link.</p><select id="mt">' + SERVICES.map(function(s){ return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join('') + '</select><input id="mc" placeholder="Short caption (e.g. Garden wedding, Entebbe)"><input type="file" id="mf" accept="image/*,video/mp4,video/quicktime,video/webm" multiple><button class="full" onclick="addFiles()">Upload photos / videos</button><div class="row2" style="margin-top:8px"><input id="ml" placeholder="https:// video link"><button onclick="addLink()">Add link</button></div><p id="me" class="m"></p></div>';
  h += MEDIA.length ? '<div class="gal">' + MEDIA.map(function(m){ var inner = m.kind === 'photo' ? '<img loading="lazy" src="' + esc(m.url) + '" alt="' + esc(m.caption || '') + '">' : m.kind === 'video' ? '<video src="' + esc(m.url) + '#t=0.5" preload="metadata" muted></video>' : '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" style="display:flex;height:100%;align-items:center;justify-content:center;font-size:30px;text-decoration:none">▶️</a>'; return '<div>' + inner + '<span>' + (m.hidden ? 'hidden by Velos' : esc(m.kind)) + '</span><button onclick="delMedia(\'' + m.id + '\')">✕</button></div>'; }).join('') + '</div>' : '<p class="m">No work posted yet. Upload at least 6 photos to look professional.</p>';
  bd().innerHTML = h;
}
async function addFiles(){
  var fs = [].slice.call($('mf').files); if(!fs.length){ $('me').textContent = 'Choose files first.'; return; }
  var uid = (await db.auth.getUser()).data.user.id, ok = 0;
  for(var i = 0; i < fs.length; i++){ var f = fs[i], vid = f.type.indexOf('video') === 0; $('me').textContent = 'Uploading ' + (i + 1) + ' of ' + fs.length + '…';
    if(vid && f.size > 50 * 1048576){ $('me').textContent = f.name + ' is over 50 MB. Paste a YouTube or TikTok link instead.'; continue; }
    try{ var b = vid ? f : await shrink(f, 1600), ext = vid ? (f.type.split('/')[1] || 'mp4').replace('quicktime', 'mov') : 'jpg', path = uid + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
      var u = await db.storage.from('event-media').upload(path, b, {contentType:vid ? f.type : 'image/jpeg'}); if(u.error) throw u.error;
      var url = db.storage.from('event-media').getPublicUrl(path).data.publicUrl, r = await db.rpc('event_media_add', {p_kind:vid ? 'video' : 'photo', p_url:url, p_caption:$('mc').value, p_type:$('mt').value}); if(r.error) throw r.error; ok++;
    }catch(e){ $('me').textContent = e.message || 'Upload failed'; } }
  if(ok){ toast(ok + ' added ✓'); port(); }
}
async function addLink(){ var u = $('ml').value.trim(); if(!u) return; var r = await db.rpc('event_media_add', {p_kind:'link', p_url:u, p_caption:$('mc').value, p_type:$('mt').value}); if(r.error) $('me').textContent = r.error.message; else { toast('Link added ✓'); port(); } }
async function delMedia(id){ if(!confirm('Remove this item?')) return; var r = await db.rpc('event_media_delete', {p_id:id}); if(r.data && r.data.indexOf('/event-media/') > -1){ try{ await db.storage.from('event-media').remove([decodeURIComponent(r.data.split('/event-media/')[1])]); }catch(e){} } port(); }

/* ---------- packages ---------- */
async function pks(){
  bd().innerHTML = '<p class="m">Loading…</p>'; PK = (await db.rpc('event_packages_mine')).data || [];
  bd().innerHTML = '<div class="c"><p class="m">Packages are starting points that customers can choose when asking for a quote. "From" prices are guides; you still send a final quote for each event.</p><button onclick="pkForm()">+ Add a package</button><div id="pkf"></div></div>' + (PK.length ? PK.map(function(k){ return '<div class="lead"><div class="row"><h3>' + esc(k.name) + '</h3><b class="pr">from ' + ugx(k.price_from_ugx) + '</b></div><div class="m">' + esc(LBL[k.event_type] || '') + (k.active ? '' : ' · hidden') + '</div><p style="margin:6px 0">' + esc(k.description || '') + '</p><button class="g" onclick="pkForm(\'' + k.id + '\')">Edit</button> <button class="g" onclick="pkDel(\'' + k.id + '\')">Delete</button></div>'; }).join('') : '');
}
function pkForm(id){ var k = PK.filter(function(x){ return x.id === id; })[0] || {name:'', description:'', event_type:'decor', price_from_ugx:'', active:true};
  $('pkf').innerHTML = '<div class="lead"><input id="kn" placeholder="Package name (e.g. Gold wedding decor) *" value="' + esc(k.name) + '"><select id="kt">' + SERVICES.map(function(s){ return '<option value="' + s[0] + '"' + (s[0] === k.event_type ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select><input id="kp" type="number" min="0" placeholder="Starting price in UGX *" value="' + esc(k.price_from_ugx) + '"><textarea id="kd" rows="3" placeholder="What is included">' + esc(k.description) + '</textarea><label class="m"><input type="checkbox" id="ka" style="width:auto"' + (k.active ? ' checked' : '') + '> Show on my page</label><button class="full" onclick="pkSave(' + (id ? '\'' + id + '\'' : 'null') + ')">Save package</button></div>'; }
async function pkSave(id){ var r = await db.rpc('event_package_save', {p_id:id, p_name:$('kn').value, p_desc:$('kd').value, p_type:$('kt').value, p_price:+$('kp').value, p_active:$('ka').checked}); if(r.error) toast(r.error.message, 1); else { toast('Saved ✓'); pks(); } }
async function pkDel(id){ if(!confirm('Delete this package?')) return; await db.rpc('event_package_delete', {p_id:id}); pks(); }

/* ---------- profile ---------- */
function prof(){
  var sv = ME.services || [];
  bd().innerHTML = '<div class="c"><h2>Your public profile</h2><label class="m">Cover photo (shown at the top of your page)</label>' + (ME.cover_url ? '<img src="' + esc(ME.cover_url) + '" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px">' : '') + '<input type="file" id="pc" accept="image/*"><label class="m">Logo (optional)</label><input type="file" id="pl" accept="image/*">'
   + '<textarea id="pb" rows="4" placeholder="About your business">' + esc(ME.bio || '') + '</textarea><div class="row2"><input id="pci" placeholder="City" value="' + esc(ME.city || '') + '"><input id="pyr" type="number" placeholder="Years of experience" value="' + esc(ME.years_exp || '') + '"></div><input id="par" placeholder="Other areas you work in" value="' + esc(ME.areas || '') + '"><input id="pph" type="tel" placeholder="Phone" value="' + esc(ME.phone || '') + '">'
   + '<div class="cats">' + SERVICES.map(function(s){ return '<label><input type="checkbox" name="ps" value="' + s[0] + '"' + (sv.indexOf(s[0]) > -1 ? ' checked' : '') + '>' + s[1] + '</label>'; }).join('') + '</div><button class="full" onclick="profSave()">Save profile</button><p id="pe" class="m"></p></div>'
   + (ME.route === 'lc1' ? '<div class="warn">Registered with URSB since? Upload your trading licence in a message to Velos support and we will add the verified-licence badge.</div>' : '');
}
async function pimg(id, uid, tag){ var f = $(id).files[0]; if(!f) return null; var b = await shrink(f, 1600), p = uid + '/' + tag + '-' + Date.now() + '.jpg', u = await db.storage.from('event-media').upload(p, b, {contentType:'image/jpeg'}); if(u.error) throw u.error; return db.storage.from('event-media').getPublicUrl(p).data.publicUrl; }
async function profSave(){
  try{ var uid = (await db.auth.getUser()).data.user.id, cv = await pimg('pc', uid, 'cover'), lg = await pimg('pl', uid, 'logo'), sv = [].slice.call(document.querySelectorAll('input[name=ps]:checked')).map(function(x){ return x.value; });
    if(!sv.length){ $('pe').textContent = 'Keep at least one service ticked.'; return; }
    var r = await db.rpc('event_profile_save', {p_bio:$('pb').value, p_city:$('pci').value, p_areas:$('par').value, p_services:sv, p_years:$('pyr').value ? +$('pyr').value : null, p_logo:lg, p_cover:cv, p_phone:$('pph').value}); if(r.error) throw r.error;
    toast('Saved ✓'); var m = await db.rpc('event_me'); ME = m.data; prof(); }catch(e){ $('pe').textContent = e.message || 'Could not save'; }
}

/* ---------- earnings ---------- */
async function earn(){
  bd().innerHTML = '<p class="m">Loading…</p>'; LEADS = (await db.rpc('event_leads_mine')).data || [];
  var paid = LEADS.filter(function(l){ return l.paid_out_at; }), held = LEADS.filter(function(l){ return !l.paid_out_at && ['deposit_paid', 'paid', 'completed'].indexOf(l.status) > -1; }), sum = function(a){ return a.reduce(function(t, l){ return t + (+l.you_get || 0); }, 0); };
  bd().innerHTML = '<div class="stats"><div class="c stat"><b>' + ugx(sum(paid)) + '</b>Paid to you</div><div class="c stat"><b>' + ugx(sum(held)) + '</b>Held by Velos for your jobs</div><div class="c stat"><b>' + paid.length + '</b>Completed jobs</div></div><div class="c"><h2>Payout history</h2>'
   + (LEADS.filter(function(l){ return l.quote; }).length ? '<table><tr><th>#</th><th>Event</th><th>Price</th><th>You get</th><th>Status</th></tr>' + LEADS.filter(function(l){ return l.quote; }).map(function(l){ return '<tr><td>' + l.lead_no + '</td><td>' + esc(l.event_date || '') + '</td><td>' + ugx(l.quote) + '</td><td>' + ugx(l.you_get) + '</td><td>' + (l.paid_out_at ? 'Paid ' + esc(String(l.paid_out_at).slice(0, 10)) : esc(SL[l.status] || l.status)) + '</td></tr>'; }).join('') + '</table>' : '<p class="m">No bookings yet.</p>') + '<p class="m">Payouts go to ' + esc(ME.payout_method === 'airtel' ? 'Airtel' : 'MTN') + ' ' + esc(ME.payout_account || '') + ' (' + esc(ME.payout_name || '') + ').</p></div>';
}
boot();
</script></body></html>
