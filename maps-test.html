<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Velos map check</title>
<style>body{margin:0;background:#080d1f;color:#f4f1ea;font:16px/1.5 system-ui,sans-serif}.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}h1{font:600 24px Georgia,serif;color:#e8c766}.c{background:#0f1731;border:1px solid #26335f;border-radius:16px;padding:14px;margin:12px 0}button{width:100%;border:0;border-radius:99px;padding:14px;font:700 16px system-ui;background:#e8c766;color:#080d1f;cursor:pointer}.ok{color:#7fd99a}.bad{color:#ff8a80}.m{color:#9fb0e0;font-size:14px}code{background:#0a1130;padding:2px 6px;border-radius:6px;word-break:break-all}</style></head><body><div class="w"><h1>Velos map check</h1><p class="m">Press the button. It tests your Google Maps key from this website, exactly as the checkout page uses it, and tells you what to fix.</p><button onclick="run()">Test Google Maps now</button><div id="o"></div></div>
<script src="velos-maps-config.js"></script><script>
var K=window.VELOS_MAPS_KEY||'',$=function(i){return document.getElementById(i)};
function row(ok,t,why){$('o').insertAdjacentHTML('beforeend','<div class="c"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✅ ':'❌ ')+t+'</b>'+(why?'<div class="m" style="margin-top:6px">'+why+'</div>':'')+'</div>')}
function hint(m){m=String(m||'');
 if(/REFERRER|referer/i.test(m))return 'The key is restricted to websites, but this address is not on the list. In Google Cloud > APIs &amp; Services > Credentials > your key > Application restrictions > Websites, add exactly: <code>https://thevelosgroup.com/*</code> and <code>https://www.thevelosgroup.com/*</code>, then Save and wait 5 minutes.';
 if(/SERVICE_DISABLED|has not been used|is disabled/i.test(m))return 'This Google service is not switched on. In Google Cloud > APIs &amp; Services > Library, open <b>Places API (New)</b> (and <b>Geocoding API</b>) and press <b>Enable</b>.';
 if(/API_KEY_SERVICE_BLOCKED|not authorized|restricted to/i.test(m))return 'The key\'s API restriction does not include this service. Edit the key > API restrictions, and tick <b>Places API (New)</b> and <b>Geocoding API</b>.';
 if(/billing|BILLING/i.test(m))return 'Billing is not active on this Google Cloud project. Open Billing, link a billing account to the project, then try again.';
 if(/INVALID|not valid|API key/i.test(m))return 'Google does not accept this key. Check that it was copied completely into velos-maps-config.js with no spaces.';
 return 'Send this message to Claude and it will be fixed.'}
function call(url,opt){return fetch(url,opt).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}return {ok:r.ok,status:r.status,j:j,t:t}})})}
async function run(){$('o').innerHTML='';
 if(!K){row(false,'No key found','Open velos-maps-config.js on GitHub and paste your key between the quotes.');return}
 row(true,'Key found','Starts with '+K.slice(0,6)+'… and is '+K.length+' characters long.');
 try{var a=await call('https://places.googleapis.com/v1/places:autocomplete',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':K,'X-Goog-FieldMask':'suggestions.placePrediction.text'},body:JSON.stringify({input:'Bukoto Kampala',includedRegionCodes:['ug']})});
  if(a.ok&&a.j.suggestions&&a.j.suggestions.length)row(true,'Address search works','Example result: '+(a.j.suggestions[0].placePrediction.text.text||''));
  else if(a.ok)row(false,'Google answered but found nothing','Try again in a minute.');
  else{var e=a.j.error||{};row(false,'Address search is blocked ('+(e.status||a.status)+')',(e.message?'<i>'+e.message+'</i><br><br>':'')+hint(e.message+' '+JSON.stringify(e.details||'')))}}catch(x){row(false,'Could not reach Google','Check your internet connection. '+x.message)}
 try{var n=await call('https://places.googleapis.com/v1/places:searchNearby',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':K,'X-Goog-FieldMask':'places.displayName'},body:JSON.stringify({includedTypes:['gas_station','supermarket'],maxResultCount:3,locationRestriction:{circle:{center:{latitude:0.3523,longitude:32.6001},radius:800}}})});
  if(n.ok)row(true,'"Near this pin" suggestions work',(n.j.places||[]).map(function(p){return p.displayName.text}).join(', ')||'No places returned for this test spot.');else{var e2=n.j.error||{};row(false,'"Near this pin" is blocked ('+(e2.status||n.status)+')',(e2.message?'<i>'+e2.message+'</i><br><br>':'')+hint(e2.message))}}catch(x){row(false,'Nearby test failed',x.message)}
 row(true,'Pin to address','Handled with free map data. Google Geocoding is not needed (it cannot be used with a website-restricted key).');
}
</script></body></html>
