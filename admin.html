<!doctype html>
<html lang="en"><head><script src="velos-splash.js"></script><script src="velos-alerts.js"></script><script src="velos-push.js"></script><script src="velos-approval.js"></script><script src="velos-people-docs.js"></script><link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://ptmedfjkapzqxltntynf.supabase.co https://challenges.cloudflare.com; base-uri 'self'; form-action 'none'"><title>Velos Admin</title>
<style>
:root{--bg:#0c1226;--card:#141b34;--line:#26305a;--gold:#e8c766;--txt:#f4f1ea;--mut:#8a93ab;--ok:#7fd99a;--bad:#e6493f}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
h1,h2{font-family:Georgia,serif;margin:0}h2{font-size:20px;margin:16px 0 10px}
.box{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;background:#0c1226;color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--gold);color:#080d1a;font-weight:700;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
header{position:sticky;top:0;background:#080d1a;border-bottom:1px solid var(--line);padding:10px 12px;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px}nav button{white-space:nowrap;background:none;color:var(--mut);border:1px solid var(--line)}
nav#nav2 button{font-size:.82rem;padding:5px 10px}nav#nav button{font-weight:700}nav button.on{background:var(--gold);color:#080d1a;border-color:var(--gold)}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.gold{color:var(--gold)}a{color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center}.stat b{font-size:28px;display:block;color:var(--gold)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.sm{width:auto;display:inline-block;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:99px;font-weight:700;z-index:9}
#toast.bad{background:var(--bad);color:#fff}pre{white-space:pre-wrap;color:var(--mut);font-size:13px}

.top .tl{display:flex;align-items:center;gap:10px}#mbtn{background:var(--gold);color:#080d1a;border:0;border-radius:10px;padding:8px 14px;font-weight:800}
#crumb{padding:6px 12px;font-size:.95rem}
#mscrim{position:fixed;inset:0;background:rgba(2,8,28,.7);z-index:900}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);background:#0b1226;border-right:1px solid #2a3560;z-index:901;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(20px + env(safe-area-inset-bottom));animation:dsl .18s ease-out}
@keyframes dsl{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
#drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#drawer input{width:100%;margin-bottom:8px}
.mgh{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#a3adc6;margin:14px 4px 6px}
.mi{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 12px;margin:2px 0;color:#f4f1ea;font-size:1rem}.mi small{color:#a3adc6;font-size:.75rem;margin-top:2px}.mi:hover{background:#141d3b}.mi.on{background:var(--gold);color:#080d1a}.mi.on small{color:#3a3a2a}
</style></head><body>

<div id="login" class="box" hidden>
  <h1 class="gold">Velos Admin</h1><p class="mut">Staff sign-in only</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button>
  <div id="mfaBox" hidden style="margin-top:10px"><p class="mut">Two-step check. Open your authenticator app and type the 6-digit code for Velos Admin.</p><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code"><button style="width:100%;margin-top:8px" onclick="mfaGo()">Verify and continue</button><button class="ghost" style="width:100%;margin-top:6px" onclick="db.auth.signOut().then(()=>location.reload())">Cancel</button></div>
  <p id="err" style="color:var(--bad)"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><span class="tl"><button id="mbtn" onclick="menuOpen()" aria-label="Open menu">☰ Menu</button><b class="gold">VELOS ADMIN</b></span><span><span id="who" class="mut"></span> <button class="ghost" onclick="VelosAlerts.settings(db)" title="Notifications and alert sound">🔔 Alerts</button> <button class="ghost" onclick="signOut()">Sign out</button></span></div>
    <div id="crumb"></div><nav id="nav2"></nav>
  </header>
  <div id="mscrim" onclick="menuClose()" hidden></div><aside id="drawer" hidden><div class="dh"><b class="gold">Velos back office</b><button class="ghost" onclick="menuClose()">✕</button></div><input id="mq" type="search" placeholder="Search a page…" oninput="menuFilter()"><div id="mlist"></div></aside>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script><script src="velos-guard-config.js"></script><script src="velos-guard.js"></script><script src="velos-ui.js"></script><script src="velos-stamp.js"></script><script src="velos-receipts.js"></script><script src="velos-vendor-cats.js"></script>
<script>
const db = supabase.createClient(VELOS_SUPABASE.url, VELOS_SUPABASE.key);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ugx = n => n == null ? 'Request Quote' : 'UGX ' + Number(n).toLocaleString('en-US');
const dt = s => new Date(s).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'});
const wa = p => 'https://wa.me/' + String(p || '').replace(/\D/g, '');
let me = null, cats = [];

function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className=bad?'bad':''; t.hidden=false; setTimeout(()=>t.hidden=true,2200); }
function show(inApp){ $('#login').hidden = inApp; $('#app').hidden = !inApp; }

async function signIn(){
  $('#err').textContent = '';
  const {error} = await db.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  if(error){ $('#err').textContent = error.message; return; }
  boot();
}
/* Two-step login: if this account enrolled an authenticator app, ask for the code before opening the panel */
async function needStepUp(){ try { const {data} = await db.auth.mfa.getAuthenticatorAssuranceLevel(); return !!(data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2'); } catch(e){ return false; } }
async function mfaGo(){ $('#err').textContent = ''; const code = $('#mfaCode').value.replace(/\D/g,''); if(code.length !== 6){ $('#err').textContent = 'Type the 6 digits from your app.'; return; }
  const f = await db.auth.mfa.listFactors(); const fac = ((f.data && f.data.totp) || []).find(x => x.status === 'verified'); if(!fac){ $('#err').textContent = 'No authenticator found.'; return; }
  const c = await db.auth.mfa.challenge({factorId:fac.id}); if(c.error){ $('#err').textContent = c.error.message; return; }
  const v = await db.auth.mfa.verify({factorId:fac.id, challengeId:c.data.id, code}); if(v.error){ $('#err').textContent = 'That code is not right. Try the new one in your app.'; return; }
  $('#mfaBox').hidden = true; boot(); }
let AL_SINCE = new Date().toISOString(), AL_T = null, AL_ON = false; const AL_N = {};
const AL_SRC = [['orders','🛍️ New shop order','orders'],['food_orders','🍽️ New food order','forders'],['payments','💰 New payment to approve','payments'],['food_bookings','📅 New table booking','bookings'],['service_requests','🛠️ New service request','service'],['gift_requests','🎁 New gift request','gifts'],['design_requests','🎨 New design request','designs'],['inquiries','✉️ New inquiry','inq'],['leads','📣 New lead','leads'],['technician_applications','🧰 New technician application','techs'],['food_help_requests','🆘 A restaurant needs help','forders','warn'],['phone_verifications','📱 Phone check waiting','phones']];
async function alPoll(){ const t0 = new Date().toISOString(), since = AL_SINCE; AL_SINCE = t0;
  await Promise.all(AL_SRC.map(async ([tb, label, tab, kind]) => { try { const r = await db.from(tb).select('id', {count:'exact', head:true}).gt('created_at', since); if(r.error || !r.count) return; AL_N[tb] = (AL_N[tb] || 0) + r.count;
    VelosAlerts.alarm('adm-' + tb, {title:label, body:AL_N[tb] + ' new. Tap View to open.', kind:kind || 'order', every:kind === 'warn' ? 8000 : 10000, btn:'View', onAck:() => { AL_N[tb] = 0; if(window.TB && TB.some(x => x[0] === tab)) go(tab); }}); } catch(e){} })); }
function startAlerts(){ if(AL_ON) return; AL_ON = true; VelosAlerts.init({offlineText:'NO INTERNET. New orders and requests will NOT alert you until you are back online.'}); AL_SINCE = new Date().toISOString(); AL_T = setInterval(alPoll, 20000); }
async function signOut(){ clearInterval(AL_T); AL_ON = false; VelosAlerts.stopAll(); await db.auth.signOut(); show(false); }


async function mfaOn(){ const e = await db.auth.mfa.enroll({factorType:'totp', friendlyName:'Velos Admin ' + Date.now()}); if(e.error) return toast(e.error.message, true);
  window.MFA_F = e.data.id; $('#mfaSetup').innerHTML = `<div class="vu-sec">Step 1: scan</div><p class="mut">Open your authenticator app, choose Add account, then scan this picture.</p><img src="${e.data.totp.qr_code}" alt="QR code" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:12px"><p class="mut">Cannot scan? Type this key into the app: <b style="word-break:break-all">${esc(e.data.totp.secret)}</b></p><div class="vu-sec">Step 2: confirm</div><input id="mfaC" inputmode="numeric" maxlength="6" placeholder="6-digit code from the app" style="max-width:240px"> <button onclick="mfaConfirm()">Confirm and turn on</button>`; }
async function mfaConfirm(){ const code = $('#mfaC').value.replace(/\D/g,''); if(code.length !== 6) return toast('Type the 6 digits', true);
  const c = await db.auth.mfa.challenge({factorId:MFA_F}); if(c.error) return toast(c.error.message, true);
  const v = await db.auth.mfa.verify({factorId:MFA_F, challengeId:c.data.id, code}); if(v.error) return toast('That code is not right. Try the new one.', true);
  toast('Two-step login is now ON ✓'); go('mysec'); }
async function chgPen(id, st){ const note = prompt(st === 'waived' ? 'Why is the penalty waived? (short note)' : 'Note (for example: deducted from the weekly payout)') ; if(note === null) return; const r = await db.rpc('admin_change_penalty', {p_id:id, p_status:st, p_note:note}); toast(r.error ? r.error.message : 'Saved ✓', !!r.error); go('chg'); }
async function fbMark(id, h){ const note = h ? (prompt('Short note on what was done (optional)') || '') : ''; const r = await db.rpc('admin_site_feedback_mark', {p_id:id, p_handled:h, p_note:note}); toast(r.error ? r.error.message : 'Saved ✓', !!r.error); go('fback'); }
async function mfaOff(id){ if(!confirm('Turn off two-step login? Your account becomes easier to break into.')) return; const r = await db.auth.mfa.unenroll({factorId:id}); toast(r.error ? r.error.message : 'Two-step login turned off', !!r.error); go('mysec'); }
async function pwChange(){ const a = $('#np1').value, b = $('#np2').value; if(a.length < 12) return toast('Use at least 12 characters', true); if(a !== b) return toast('The two passwords do not match', true);
  const r = await db.auth.updateUser({password:a}); toast(r.error ? r.error.message : 'Password changed ✓', !!r.error); if(!r.error){ $('#np1').value = ''; $('#np2').value = ''; } }
async function boot(){
  const {data:{session}} = await db.auth.getSession();
  if(!session) return show(false);
  if(await needStepUp()){ show(false); $('#mfaBox').hidden = false; $('#mfaCode').focus(); return; }
  const {data:p, error:pe} = await db.from('profiles').select('full_name,role').eq('id', session.user.id).maybeSingle();
  if(!p){ await db.auth.signOut(); show(false); $('#err').textContent = pe ? 'Database error: ' + pe.message : 'This account is not authorised as staff. (login id ' + session.user.id + ')'; return; }
  if(!['admin','manager','staff'].includes(p.role)){ location.href = 'team.html'; return; }
  me = p; $('#who').textContent = p.full_name || p.role; show(true); try { VelosPush.mount(db); } catch(e){}
  const {data} = await db.from('categories').select('*').order('sort_order'); cats = data || [];
  const hide = DEFHIDE[p.role] || [];
  let myTabs = null; if(p.role !== 'admin'){ try { const r = await db.rpc('my_admin_tabs'); if(!r.error && Array.isArray(r.data)) myTabs = r.data; } catch(e){} }
  window.TB = TABS.filter(t => ['home','mysec'].includes(t[0]) || (myTabs ? myTabs.includes(t[0]) : !hide.includes(t[0])));
  go('home'); startAlerts();
}

const DEFHIDE = {manager:['team','settings','frules','payroll'], staff:['audit','fback','emails','report','products','agents','leads','team','import','export','security','applinks','promos','bundles','photos','docs','careers','bizset','settings','fmenu','supplies','fvendors','friders','frules','close','payroll','hr','insights','crm','inventory','hotels']};
const TABS = [['home','Home'],['orders','Orders'],['payments','Payments'],['bookings','Table bookings'],['docs','Invoices & quotes'],['customers','Customers'],['phones','Phone checks'],['report','Sales'],['insights','Business reports'],['crm','Customer records'],['inventory','Inventory'],['hotels','Hotels & stays'],['close','Month-end close'],['payroll','Payroll'],['hr','Staff & attendance'],['agents','Agents'],['leads','Leads'],['gifts','Gifts & Sourcing'],['designs','Designs'],['products','Products'],['techs','Technicians'],['service','Services'],['security','Security'],['forders','Food orders'],['fmenu','Food menu'],['supplies','Supplies'],['fvendors','Restaurants'],['friders','Riders'],['frules','Food rules'],['cleanup','Clean-up & fees'],['proof','Proof photos'],['partners','Partners'],['pporders','Partner orders'],['inq','Inquiries'],['team','Team'],['emails','Emails'],['messages','Messages'],['export','Export'],['applinks','App links'],['promos','Promotions'],['bundles','Combos & bundles'],['careers','Careers'],['bizset','Business profile'],['photos','Photos'],['settings','Settings'],['import','Import'],['mysec','Account security'],['audit','Activity log'],['fback','Customer feedback'],['chg','Order changes']];
function alCopy(i){ const u = AL[i][1]; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Link copied'), () => { prompt('Copy this link', u); }); }
function alShare(i){ const a = AL[i]; if(navigator.share) navigator.share({title:a[0], text:'Install the Velos '+a[0], url:a[1]}).catch(()=>{}); else alCopy(i); }
async function savePromos(){
  for(const [k,i] of [['site_festive','pf'],['site_promo_text','pt'],['site_promo_until','pu']]){ const {error} = await db.from('settings').upsert({key:k, value:$('#'+i).value.trim()}); if(error) return toast(error.message, true); }
  toast('Promotions saved. Public pages update on next load.');
}
function vOwnerOf(x){ if(x.owner_name) return x.owner_name; const m = /Owner:\s*([^|\n]+)/i.exec(x.notes||''); return m ? m[1].trim() : ''; }
function vProfile(x, promos, adm){
  const approved = !!x.approved_at, owner = vOwnerOf(x);
  const plist = promos.map(p => `<div class="row" style="border-top:1px solid #2a3560;padding-top:6px"><span><b>${esc(p.title)}</b>${p.discount_pct ? ' · ' + p.discount_pct + '% off' : ''}${p.details ? '<br><span class="mut">' + esc(p.details) + '</span>' : ''}<br><span class="mut">${p.starts_on ? p.starts_on : 'now'} → ${p.ends_on ? p.ends_on : 'until stopped'} · ${p.is_active ? 'LIVE' : 'stopped'}</span></span><span><button class="ghost" onclick="pToggle('${p.id}',${!p.is_active})">${p.is_active ? 'Stop' : 'Resume'}</button><button class="ghost" onclick="pDel('${p.id}')">Delete</button></span></div>`).join('');
  return `<details class="card" style="margin:8px 0"><summary class="gold">🏪 Profile, logo, approval & promotions ${approved ? '· ✅ approved ' + esc(x.approval_no||'') : '· not approved yet'}</summary>
    <div class="row" style="justify-content:flex-start;gap:10px">${x.logo_url ? `<img src="${esc(x.logo_url)}" alt="logo" style="width:56px;height:56px;border-radius:12px;object-fit:cover">` : '<span class="mut">No logo yet</span>'}${x.cover_url ? `<img src="${esc(x.cover_url)}" alt="cover" style="height:56px;border-radius:10px;object-fit:cover">` : '<span class="mut">No cover photo yet</span>'}</div>
    <label class="mut">Owner / authorised person (appears on the approval document)</label><input id="vo-${x.id}" value="${esc(owner)}" placeholder="Owner's full name">
    <label class="mut">Short description (shown to customers)</label><input id="vd-${x.id}" value="${esc(x.description||'')}" placeholder="e.g. Grills, rolex and fresh juice in Kyanja">
    <div class="grid2"><input id="vp-${x.id}" value="${esc(x.phone||'')}" placeholder="Phone"><input id="ve-${x.id}" value="${esc(x.email||'')}" placeholder="Email"></div><input id="va-${x.id}" value="${esc(x.address||'')}" placeholder="Address and area">
    <div class="grid2"><div><label class="mut">Logo</label><input id="vlg-${x.id}" type="file" accept="image/*"></div><div><label class="mut">Cover photo</label><input id="vcv-${x.id}" type="file" accept="image/*"></div></div>
    <button onclick="vSaveProfile('${x.id}')">Save profile & pictures</button>
    ${adm ? (approved ? `<div class="row"><button onclick="vDoc('${x.id}')">📄 Approval document</button><button class="ghost" onclick="vDoc('${x.id}',true)">📤 Share</button></div>` : `<p class="mut">When you are happy with the details above, approve: Velos gives the restaurant an approval number, switches it on and creates the signed approval document to send them.</p><button onclick="vApprove('${x.id}')">✅ Approve & create approval document</button>`) : ''}
    <h3 class="gold" style="margin-top:14px">Promotions (from what the restaurant tells you)</h3>${plist || '<p class="mut">No promotions yet.</p>'}
    <input id="pt-${x.id}x" placeholder="Promotion title, e.g. Free soda with any combo"><input id="pdt-${x.id}" placeholder="Details (optional)"><div class="grid2"><input id="pdc-${x.id}" type="number" step="0.5" placeholder="% off (optional)"><span></span></div><div class="grid2"><div><label class="mut">Starts</label><input id="ps-${x.id}" type="date"></div><div><label class="mut">Ends</label><input id="pe-${x.id}" type="date"></div></div>
    <button onclick="pAdd('${x.id}')">Add promotion</button></details>`; }
async function vUploadImg(file, id, kind){ let b; try { b = await phResize(file); } catch(e){ b = file; } const path = 'vendors/' + id + '/' + kind + '-' + Date.now() + '.jpg', up = await db.storage.from('food-images').upload(path, b, {contentType:'image/jpeg', upsert:true}); if(up.error) throw up.error; return db.storage.from('food-images').getPublicUrl(path).data.publicUrl; }
async function vSaveProfile(id){ try { const lg = $('#vlg-'+id).files[0], cv = $('#vcv-'+id).files[0]; toast(lg || cv ? 'Uploading pictures…' : 'Saving…'); const logo = lg ? await vUploadImg(lg, id, 'logo') : null, cover = cv ? await vUploadImg(cv, id, 'cover') : null;
  const {error} = await db.rpc('admin_vendor_save_profile', {p_id:id, p_owner:$('#vo-'+id).value, p_description:$('#vd-'+id).value, p_logo:logo, p_cover:cover, p_phone:$('#vp-'+id).value, p_email:$('#ve-'+id).value, p_address:$('#va-'+id).value}); if(error) throw error;
  let {data:chk} = await db.from('food_vendors').select('logo_url,cover_url').eq('id', id).single();
  if((logo && (!chk || chk.logo_url !== logo)) || (cover && (!chk || chk.cover_url !== cover))){ const u = {}; if(logo) u.logo_url = logo; if(cover) u.cover_url = cover; const r2 = await db.from('food_vendors').update(u).eq('id', id).select('logo_url,cover_url').single(); if(r2.error) throw r2.error; chk = r2.data; }
  const miss = [(lg && !(chk && chk.logo_url)) ? 'logo' : '', (cv && !(chk && chk.cover_url)) ? 'cover' : ''].filter(Boolean);
  if(miss.length) throw Error('The ' + miss.join(' and ') + ' did not save. Please try again or tell Velos support.');
  toast('Saved ✓' + (lg ? ' Logo is live.' : '') + (cv ? ' Cover is live.' : '')); go('fvendors'); } catch(e){ toast(e.message || 'Could not save', true); } }
async function vApprove(id){ if(!confirm('Approve this restaurant and switch it on for customers?')) return; try { await vSaveProfileQuiet(id); const {data, error} = await db.rpc('admin_vendor_approve', {p_id:id}); if(error) throw error; toast('Approved ✓ ' + data.approval_no); await vDoc(id, true, true); go('fvendors'); } catch(e){ toast(e.message || 'Could not approve', true); } }
async function vSaveProfileQuiet(id){ const g = k => { const e = $('#'+k+'-'+id); return e ? e.value : null; }; const {error} = await db.rpc('admin_vendor_save_profile', {p_id:id, p_owner:g('vo'), p_description:g('vd'), p_logo:null, p_cover:null, p_phone:g('vp'), p_email:g('ve'), p_address:g('va')}); if(error) throw error; }
async function vDoc(id, share, auto){ try { toast('Preparing approval document…'); const {data:x, error} = await db.from('food_vendors').select('*').eq('id', id).single(); if(error) throw error; if(!x.approval_no) throw Error('Approve the restaurant first'); const r = await VelosApproval.build({name:x.name, owner:vOwnerOf(x), phone:x.phone, email:x.email, address:x.address, lat:x.lat, lng:x.lng, commission_pct:x.commission_pct, approval_no:x.approval_no, approved_at:x.approved_at}, {co: await docsCo()}); if(share){ const ok = await VelosApproval.share(r); if(!ok) toast('Sharing is not supported on this device, so the PDF was downloaded.'); } else VelosApproval.save(r); } catch(e){ toast(e.message || 'Could not create the document', true); } }

async function fsha(f){ const h = await crypto.subtle.digest('SHA-256', await f.arrayBuffer()); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join(''); }
async function bulkPhotos(){
  const fs = Array.from($('#bp_f').files || []), log = $('#bp_log'); if(!fs.length) return toast('Choose the pictures first', true);
  let ok = 0, miss = 0; log.textContent = '';
  for(const f of fs){
    let name = f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'); try { const h = await fsha(f); if(PHOTO_HASH[h]) name = PHOTO_HASH[h]; } catch(e){}
    const path = 'menu/' + name, up = await db.storage.from('food-images').upload(path, f, {contentType:f.type});
    if(up.error && !/exist|duplicate/i.test(up.error.message)){ log.textContent += '✗ ' + f.name + ': ' + up.error.message + '\n'; continue; }
    const url = db.storage.from('food-images').getPublicUrl(path).data.publicUrl, base = name.replace(/^food-/, ''); let n = 0, err = null;
    for(const q of [db.from('food_items').update({image_url:url}).eq('image_url', name), db.from('food_items').update({image_url:url}).eq('image_url', 'food-img/' + base), db.from('food_items').update({image_url:url}).like('image_url', '%/menu/' + name)]){
      const r = await q.select('id'); if(r.error){ err = r.error.message; break; } n += r.data.length;
    }
    if(err) log.textContent += '✗ ' + f.name + ': ' + err + '\n';
    else if(n){ ok += n; log.textContent += '✓ ' + f.name + ' → ' + name + ' → ' + n + ' item(s)\n'; } else { miss++; log.textContent += '– ' + f.name + ' (' + name + '): not recognised as a menu photo\n'; }
  }
  toast(ok + ' menu items updated'); log.textContent += '\nDone: ' + ok + ' items matched, ' + miss + ' files not recognised.';
}
async function addFood(){
  const g = i => $('#'+i).value.trim(); let cid = g('ni_c') || null;
  if(!g('ni_n') || g('ni_p') === '') return toast('Name and price are required', true);
  try {
    if(!cid && g('ni_nc')){ const {data,error} = await db.from('food_categories').insert({vendor_id:FVSEL, name:g('ni_nc'), sort_order:99}).select().single(); if(error) throw error; cid = data.id; }
    const f = $('#ni_f').files[0], img = f ? await upFood(f) : null;
    const {error} = await db.from('food_items').insert({vendor_id:FVSEL, category_id:cid, name:g('ni_n'), description:g('ni_d')||null, base_price_ugx:Number(g('ni_p')), unit:g('ni_u'), step:Number(g('ni_s'))||1, min_qty:Number(g('ni_m'))||1, prep_minutes:Number(g('ni_t'))||20, options:g('ni_o')||null, image_url:img}); if(error) throw error;
    toast('Item added'); go('fmenu');
  } catch(e){ toast(e.message, true); }
}
async function vStatus(id, s){ const v = FVN?.[id]; const {data} = await db.from('food_vendors').select('name,slug').eq('id', id).single(); const upd = {status:s, is_active:s==='active'}; if(data && data.slug.startsWith('pending-')) upd.slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Math.random().toString(36).slice(2,6);
  const {error} = await db.from('food_vendors').update(upd).eq('id', id); toast(error ? error.message : 'Saved', !!error); }

async function saveP(id){

async function upImg(f, id){
  if(f.size > 5*1024*1024) throw Error('Photo is over 5 MB');
  const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = id.replace(/[^\w-]/g,'_') + '-' + Date.now() + '.' + ext;
  const {error} = await db.storage.from('product-images').upload(path, f, {contentType:f.type});
  if(error) throw error;
  return db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

function drawR(){
  const g = $('#rg').value, c = $('#rc').value, per = {}, cat = {}; let tot = 0, cnt = 0;
  const p2 = n => String(n).padStart(2,'0');
  const key = d => { const x = new Date(d), y = x.getFullYear(), m = p2(x.getMonth()+1), dd = p2(x.getDate());
    if(g==='year') return ''+y; if(g==='month') return y+'-'+m; if(g==='day') return y+'-'+m+'-'+dd;
    const w = new Date(x); w.setDate(x.getDate() - ((x.getDay()+6)%7)); return 'Week of '+w.getFullYear()+'-'+p2(w.getMonth()+1)+'-'+p2(w.getDate()); };
  RP.forEach(o => { let rev = 0;
    o.order_items.forEach(i => { const ck = i.products?.category_key || 'other'; if(c && ck !== c) return; const v = (i.unit_price_ugx||0) * i.qty; rev += v; cat[ck] = (cat[ck]||0) + v; });

async function importCatalog(){
  if(!confirm('Import all products from app.js now?')) return;
  const log = m => $('#ilog').textContent += m + '\n';
  try {
    const src = await (await fetch('app.js?' + Date.now())).text();
    const grab = name => {
      const i = src.indexOf('const ' + name + ' ='); if(i < 0) throw Error(name + ' not found in app.js');
      const o = src.slice(i).search(name === 'CATEGORY_NOTES' ? /\{/ : /\[/) + i;
      const open = src[o], close = open === '{' ? '}' : ']'; let d = 0, q = null;
      for(let j = o; j < src.length; j++){
        const c = src[j];
        if(q){ if(c === '\\') j++; else if(c === q) q = null; continue; }
        if(c === '/' && src[j+1] === '/'){ j = src.indexOf('\n', j); continue; }
        if(c === "'" || c === '"' || c === '`'){ q = c; continue; }
        if(c === open) d++; else if(c === close && --d === 0) return new Function('return ' + src.slice(o, j+1))();
      }
      throw Error('Could not read ' + name);
    };
    const C = grab('CATEGORIES'), N = grab('CATEGORY_NOTES'), P = grab('PRODUCTS');
    log(`Found ${C.length} categories and ${P.length} products.`);
    let r = await db.from('categories').upsert(C.map((c,i) => ({key:c.key, label:c.label, thumb_url:c.thumb, note:N[c.key]||null, sort_order:i})));
    if(r.error) throw r.error; log('Categories saved.');
    const rows = P.map(p => ({id:p.id, category_key:p.cat, subcategory:p.sub||null, name:p.name, price_ugx:p.price??null, image_url:p.img, verified_photo:!!p.real, is_new:!!p.new}));
    for(let i = 0; i < rows.length; i += 50){
      r = await db.from('products').upsert(rows.slice(i, i+50)); if(r.error) throw r.error;
      log(`Products ${Math.min(i+50, rows.length)} / ${rows.length} saved.`);
    }
    log('Done ✔'); toast('Catalog imported');
  } catch(e){ log('ERROR: ' + (e.message || JSON.stringify(e))); toast('Import failed', true); }
}
