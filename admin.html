<html lang="en"><head><script src="velos-splash.js"></script><script src="velos-alerts.js"></script><link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script>

<style>
:root{--bg:#0c1226;--card:#141b34;--line:#26305a;--gold:#e8c766;--txt:#f4f1ea;--mut:#8a93ab;--ok:#7fd99a;--bad:#e6493f}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
h1,h2{font-family:Georgia,serif;margin:0}h2{font-size:20px;margin:16px 0 10px}
.box{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;background:#0c1226;color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--gold);color:#080d1a;font-weight:700;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
header{position:sticky;top:0;background:#080d1a;border-bottom:1px solid var(--line);padding:10px 12px;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px}nav button{white-space:nowrap;background:none;color:var(--mut);border:1px solid var(--line)}
nav#nav2 button{font-size:.82rem;padding:5px 10px}nav#nav button{font-weight:700}nav button.on{background:var(--gold);color:#080d1a;border-color:var(--gold)}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.gold{color:var(--gold)}a{color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center}.stat b{font-size:28px;display:block;color:var(--gold)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.sm{width:auto;display:inline-block;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:99px;font-weight:700;z-index:9}
#toast.bad{background:var(--bad);color:#fff}pre{white-space:pre-wrap;color:var(--mut);font-size:13px}
</style></head><body>

<div id="login" class="box" hidden>
  <h1 class="gold">Velos Admin</h1><p class="mut">Staff sign-in only</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button>
  <p id="err" style="color:var(--bad)"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><b class="gold">VELOS ADMIN</b><span><span id="who" class="mut"></span> <button class="ghost" onclick="signOut()">Sign out</button></span></div>
    <nav id="nav"></nav><nav id="nav2"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const db = supabase.createClient(VELOS_SUPABASE.url, VELOS_SUPABASE.key);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ugx = n => n == null ? 'Request Quote' : 'UGX ' + Number(n).toLocaleString('en-US');
const dt = s => new Date(s).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'});
const wa = p => 'https://wa.me/' + String(p || '').replace(/\D/g, '');
let me = null, cats = [];

function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className=bad?'bad':''; t.hidden=false; setTimeout(()=>t.hidden=true,2200); }
function show(inApp){ $('#login').hidden = inApp; $('#app').hidden = !inApp; }

async function signIn(){
  $('#err').textContent = '';
  const {error} = await db.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  if(error){ $('#err').textContent = error.message; return; }
  boot();
}
let AL_SINCE = new Date().toISOString(), AL_T = null, AL_ON = false; const AL_N = {};
const AL_SRC = [['orders','🛍️ New shop order','orders'],['food_orders','🍽️ New food order','forders'],['payments','💰 New payment to approve','payments'],['service_requests','🛠️ New service request','service'],['gift_requests','🎁 New gift request','gifts'],['design_requests','🎨 New design request','designs'],['inquiries','✉️ New inquiry','inq'],['leads','📣 New lead','leads'],['technician_applications','🧰 New technician application','techs'],['food_help_requests','🆘 A restaurant needs help','forders','warn'],['phone_verifications','📱 Phone check waiting','phones']];
async function alPoll(){ const t0 = new Date().toISOString(), since = AL_SINCE; AL_SINCE = t0;
  await Promise.all(AL_SRC.map(async ([tb, label, tab, kind]) => { try { const r = await db.from(tb).select('id', {count:'exact', head:true}).gt('created_at', since); if(r.error || !r.count) return; AL_N[tb] = (AL_N[tb] || 0) + r.count;
    VelosAlerts.alarm('adm-' + tb, {title:label, body:AL_N[tb] + ' new. Tap View to open.', kind:kind || 'order', every:kind === 'warn' ? 8000 : 10000, btn:'View', onAck:() => { AL_N[tb] = 0; if(window.TB && TB.some(x => x[0] === tab)) go(tab); }}); } catch(e){} })); }
function startAlerts(){ if(AL_ON) return; AL_ON = true; VelosAlerts.init({offlineText:'NO INTERNET. New orders and requests will NOT alert you until you are back online.'}); AL_SINCE = new Date().toISOString(); AL_T = setInterval(alPoll, 20000); }
async function signOut(){ clearInterval(AL_T); AL_ON = false; VelosAlerts.stopAll(); await db.auth.signOut(); show(false); }

async function boot(){
  const {data:{session}} = await db.auth.getSession();
  if(!session) return show(false);
  const {data:p, error:pe} = await db.from('profiles').select('full_name,role').eq('id', session.user.id).maybeSingle();
  if(!p){ await db.auth.signOut(); show(false); $('#err').textContent = pe ? 'Database error: ' + pe.message : 'This account is not authorised as staff. (login id ' + session.user.id + ')'; return; }
  me = p; $('#who').textContent = p.full_name || p.role; show(true);
  const {data} = await db.from('categories').select('*').order('sort_order'); cats = data || [];
  const hide = ({manager:['team','settings','frules'], staff:['report','products','agents','leads','team','import','export','security','applinks','promos','bundles','photos','docs','careers','bizset','settings','fmenu','supplies','fvendors','friders','frules']})[p.role] || [];
  window.TB = TABS.filter(t => !hide.includes(t[0]));
  go('home'); startAlerts();
}

const TABS = [['home','Home'],['orders','Orders'],['payments','Payments'],['docs','Invoices & quotes'],['customers','Customers'],['phones','Phone checks'],['report','Sales'],['agents','Agents'],['leads','Leads'],['gifts','Gifts & Sourcing'],['designs','Designs'],['products','Products'],['techs','Technicians'],['service','Services'],['security','Security'],['forders','Food orders'],['fmenu','Food menu'],['supplies','Supplies'],['fvendors','Restaurants'],['friders','Riders'],['frules','Food rules'],['inq','Inquiries'],['team','Team'],['messages','Messages'],['export','Export'],['applinks','App links'],['promos','Promotions'],['bundles','Combos & bundles'],['careers','Careers'],['bizset','Business profile'],['photos','Photos'],['settings','Settings'],['import','Import']];
function alCopy(i){ const u = AL[i][1]; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Link copied'), () => { prompt('Copy this link', u); }); }
function alShare(i){ const a = AL[i]; if(navigator.share) navigator.share({title:a[0], text:'Install the Velos '+a[0], url:a[1]}).catch(()=>{}); else alCopy(i); }
async function savePromos(){
  for(const [k,i] of [['site_festive','pf'],['site_promo_text','pt'],['site_promo_until','pu']]){ const {error} = await db.from('settings').upsert({key:k, value:$('#'+i).value.trim()}); if(error) return toast(error.message, true); }
  toast('Promotions saved. Public pages update on next load.');
}
async function vDelete(id, name){ if(!confirm('Delete '+name+' permanently? This only works if it has no orders. To hide a restaurant that has orders, use Switch off.')) return; const {error} = await db.rpc('admin_delete_vendor', {p_id:id}); toast(error ? error.message : 'Restaurant deleted', !!error); if(!error) go('fvendors'); }
async function feeAct(id, a){ const {error} = await db.rpc('admin_vendor_fee', {p_vendor:id, p_action:a}); toast(error ? error.message : (a==='confirm' ? 'Fee confirmed. You can now set the restaurant to active.' : 'Fee waived'), !!error); if(!error) go('fvendors'); }
function bdFilter(){ const q = ($('#bd_q').value||'').toLowerCase(); $('#bd_p').innerHTML = BP.filter(p => !q || p.name.toLowerCase().includes(q)).slice(0,80).map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${ugx(p.price_ugx)})</option>`).join(''); }
function bdTotal(){ return BD.lines.reduce((s,l) => s + l.p.price_ugx * l.k, 0); }
function bdPrice(){ const m = $('#bd_m').value, d = $('#bd_d').value, t = bdTotal(); if(m !== '') return Number(m); if(d !== '') return Math.round(t * (100 - Number(d)) / 100 / 100) * 100; return t; }
function bdAdd(){ const p = BP.find(x => x.id === $('#bd_p').value), k = Math.max(1, parseInt($('#bd_k').value, 10) || 1); if(!p) return toast('Pick a product first', true); const l = BD.lines.find(x => x.p.id === p.id); if(l) l.k += k; else BD.lines.push({p, k}); bdDraw(); }
function bdRm(i){ BD.lines.splice(i,1); bdDraw(); }
function bdDraw(){ $('#bd_l').innerHTML = BD.lines.map((l,i) => `<div class="row"><span>${l.k} × ${esc(l.p.name)} <span class="mut">${ugx(l.p.price_ugx * l.k)}</span></span><button class="ghost" onclick="bdRm(${i})">✕</button></div>`).join('') || '<p class="mut">No products added yet.</p>'; const t = bdTotal(), pr = bdPrice(); $('#bd_s').textContent = 'Normal price ' + ugx(t) + ' · Bundle price ' + ugx(pr) + ' · Customer saves ' + ugx(Math.max(0, t - pr)); }
async function bdCreate(){
  const n = $('#bd_n').value.trim(), pr = bdPrice(), t = bdTotal(); if(!n) return toast('Give the bundle a name', true); if(BD.lines.length < 2) return toast('Add at least two products', true); if(!(pr > 0)) return toast('Set a discount or a price', true);
  const id = 'bd' + Date.now().toString(36), inc = BD.lines.map(l => l.k + '× ' + l.p.name).join(', '), sub = ('Bundle · Includes: ' + inc + (t > pr ? ' · Save ' + ugx(t - pr) : '')).slice(0,240);
  let img = null; const f = $('#bd_f').files[0]; try { if(f) img = await upImg(f, id); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('products').insert({id, name:n, category_key:$('#bd_c').value, subcategory:sub, price_ugx:pr, image_url:img});
  toast(error ? error.message : 'Bundle created. Find it in Products.', !!error); if(!error) go('bundles');
}
const GROUPS = [['Overview','📊',['home','report','inq','messages']],['Orders','🧾',['orders','forders','payments','docs','designs','gifts','service','security']],['Food','🍽️',['fmenu','fvendors','friders','frules','supplies']],['Shop','🛍️',['products','photos','bundles','promos','import']],['People','👥',['customers','phones','agents','leads','techs','team','careers']],['System','⚙️',['bizset','applinks','export','settings']]];
function navFor(k){ const lab = Object.fromEntries(TB.map(t => [t[0], t[1]])); window.NG = GROUPS.map(g => [g[0], g[1], g[2].filter(x => lab[x])]).filter(g => g[2].length); const gi = Math.max(0, NG.findIndex(g => g[2].includes(k)));
  $('#nav').innerHTML = NG.map((g,i) => `<button class="${i===gi?'on':''}" onclick="go('${g[2][0]}')">${g[1]} ${g[0]}</button>`).join('');
  $('#nav2').innerHTML = NG[gi][2].map(x => `<button class="${x===k?'on':''}" onclick="go('${x}')">${lab[x]}</button>`).join(''); }
const PH_ACC = '.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.heic,.heif,image/*';
function phIsTile(x){ return !x.img || /^data:/.test(x.img); }
function phList(){ const q = ($('#ph_q').value || '').toLowerCase(), t = $('#ph_t').value, only = $('#ph_n').checked;
  const L = PH.all.map((x,i) => [x,i]).filter(([x]) => (!t || x.t === t) && (!only || phIsTile(x)) && (!q || x.label.toLowerCase().includes(q)));
  $('#ph_list').innerHTML = L.slice(0, PH.lim).map(([x,i]) => `<div class="row" style="align-items:center;margin:6px 0"><img src="${esc(x.img||'')}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;background:#1a2244"><span style="flex:1">${esc(x.label)}</span><button onclick="phOne(${i})">📷</button></div>`).join('') + (L.length > PH.lim ? `<button class="ghost" onclick="PH.lim+=30;phList()">Show more (${L.length - PH.lim} left)</button>` : '') + (L.length ? '' : '<p class="mut">Nothing to show. Untick the box above to see all items.</p>'); }
function phOne(i){ PH.one = i; const f = $('#ph_one'); f.value = ''; f.click(); }
async function phOneDone(){ const file = $('#ph_one').files[0]; if(!file) return; const it = PH.all[PH.one]; toast('Uploading ' + it.name + '…');
  try { await phUp(it, file); toast('Saved: ' + it.name); phList(); } catch(e){ toast(e.message || 'Upload failed', true); } }
function phResize(f){ return new Promise((res, rej) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { const s = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(Error('Could not read the picture')); }, 'image/jpeg', 0.85); }; im.onerror = () => rej(Error('Not readable')); im.src = u; }); }
/* ---- Bulk photo matching (v2) ---- */
function phNorm(s, isFile){ let t = String(s == null ? '' : s).toLowerCase(); if(isFile) t = t.replace(/\.[a-z0-9]{2,5}$/, '').replace(/\(\d+\)\s*$/, '').replace(/[\s_\-]*copy[\s_\-]*\d*$/, ''); return t.replace(/[\s_\-.]+/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function phStem(w){ if(w.length > 3){ if(/ies$/.test(w)) return w.slice(0,-3) + 'y'; if(/(oes|sses|ches|shes|xes)$/.test(w)) return w.slice(0,-2); if(/s$/.test(w) && !/ss$/.test(w)) return w.slice(0,-1); } return w; }
function phToks(s, isFile){ return phNorm(s, isFile).split(' ').filter(Boolean).map(phStem); }
function phLev(a,b){ if(a === b) return 0; const m = a.length, n = b.length; if(!m || !n) return Math.max(m,n); let p = Array.from({length:n+1}, (_,j) => j); for(let i = 1; i <= m; i++){ const c = [i]; for(let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); p = c; } return p[n]; }
function phTokSim(a,b){ if(a === b) return 1; const L = Math.max(a.length, b.length), s = 1 - phLev(a,b) / L; return (L >= 4 && s >= 0.75) ? s : 0; }
function phScore(ft, tk){ if(!ft.length || !tk.length) return 0; const used = new Set(); let sum = 0;
  ft.forEach(a => { let best = 0, bi = -1; tk.forEach((b,i) => { if(used.has(i)) return; const v = phTokSim(a,b); if(v > best){ best = v; bi = i; } }); if(bi > -1){ used.add(bi); sum += best; } });
  const pr = sum / ft.length, rc = sum / tk.length;
  if(pr === 1 && rc === 1) return 1; if(pr === 1) return 0.7 + 0.2 * rc; if(rc === 1) return 0.7 + 0.2 * pr; return (2 * pr * rc) / ((pr + rc) || 1) * 0.9; }
function phRank(fn){ const ft = phToks(fn, true); return PH.all.map(x => ({x, s:phScore(ft, x.tk)})).filter(r => r.s > 0.3).sort((a,b) => b.s - a.s); }
function phErr(e){ const m = (e && e.message) || String(e); if(/row-level|policy|permission|not authorized|violates|403/i.test(m)) return 'Permission missing. Run velos-upgrade-21.sql in Supabase, then try again.'; if(/bucket/i.test(m) && /not found/i.test(m)) return 'The photo storage folder is missing. Run velos-upgrade-21.sql in Supabase.'; return m; }
async function phUp(it, file){ let b; try { b = await phResize(file); } catch(e){ if(/^image\/(jpeg|png|webp)$/.test(file.type)) b = file; else throw Error('This picture format cannot be read here. Please use JPG or PNG.'); }
  const food = it.t === 'food', bucket = food ? 'food-images' : 'product-images', path = (food ? 'f' : 'p') + String(it.id).replace(/[^\w-]/g, '_') + '-' + Date.now() + '.jpg';
  const up = await db.storage.from(bucket).upload(path, b, {contentType:b.type || 'image/jpeg'}); if(up.error) throw Error(phErr(up.error));
  const url = db.storage.from(bucket).getPublicUrl(path).data.publicUrl, r = await db.from(food ? 'food_items' : 'products').update({image_url:url}).eq('id', it.id).select('id');
  if(r.error) throw Error(phErr(r.error)); if(!r.data || !r.data.length) throw Error('The photo uploaded but the item was not updated. Run velos-upgrade-21.sql in Supabase, then try again.'); it.img = url; }
const PH_ACC_FILES = '.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.heic,.heif';
function phGeneric(n){ const b = String(n).replace(/\.[a-z0-9]+$/i, ''); return !/[a-z]{3}/i.test(b.replace(/(img|image|photo|pxl|dsc|picker|screenshot|mvimg|burst|cover)/ig, '')) || /^(img|image|photo|pxl|dsc|mvimg|burst)[-_ ]?\d/i.test(b) || /image_picker/i.test(b) || /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(b) || /^\d{6,}/.test(b); }
function phPick(id){ const el = $('#' + (id || 'ph_f')); phUse(Array.from(el.files || [])); try { el.value = ''; } catch(e){} }
function phLoadZip(){ if(window.JSZip) return Promise.resolve(); return new Promise((ok,bad) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'; s.onload = ok; s.onerror = () => bad(Error('Could not load the ZIP tool. Check your internet and try again.')); document.head.appendChild(s); }); }
async function phZip(){ const f = ($('#ph_z').files || [])[0]; if(!f) return; try { toast('Reading ZIP…'); await phLoadZip(); const z = await JSZip.loadAsync(f), out = [], T = {jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', bmp:'image/bmp', avif:'image/avif'};
    for(const name of Object.keys(z.files)){ const e = z.files[name]; if(e.dir || /(^|\/)(__MACOSX|\.)/.test(name)) continue; const base = name.split('/').pop(), m = base.match(/\.(jpe?g|png|webp|gif|bmp|avif)$/i); if(!m) continue; const blob = await e.async('blob'); out.push(new File([blob], base, {type:T[m[1].toLowerCase()]})); }
    if(!out.length) return toast('No pictures found in that ZIP', true); phUse(out); } catch(e){ toast(e.message || 'Could not read the ZIP', true); } try { $('#ph_z').value = ''; } catch(e){} }
function phUse(fs){ (PH.rows || []).forEach(r => { try { URL.revokeObjectURL(r.url); } catch(e){} }); PH.rows = fs.map(f => ({f, url:URL.createObjectURL(f), it:null, sug:[], note:'', done:false, amb:false}));
  $('#ph_m').style.display = PH.rows.length ? '' : 'none'; const bad = PH.rows.filter(r => phGeneric(r.f.name)).length;
  $('#ph_w').innerHTML = (PH.rows.length && bad >= Math.ceil(PH.rows.length / 2)) ? '<div class="card" style="border-color:#e8c766"><b class="gold">⚠ Your phone changed the picture names</b><p class="mut">Pictures chosen from the Gallery often lose their names (they become numbers). To keep the names you typed, tap <b>Choose from Files</b> and pick them from the folder where you renamed them, or put them in a ZIP file and tap <b>Choose a ZIP</b>.</p></div>' : '';
  if(!PH.rows.length){ $('#ph_l').innerHTML = ''; $('#ph_go').style.display = 'none'; $('#ph_ord').style.display = 'none'; $('#ph_s').textContent = ''; return; } phMatchAll(true); }
function phMatchAll(auto){ const taken = new Set(); PH.rows.forEach(r => { if(r.done && r.it) taken.add(r.it.t + r.it.id); });
  PH.rows.forEach(r => { if(r.done) return; r.it = null; r.amb = false; r.note = ''; const rk = phRank(r.f.name); r.sug = rk.slice(0,3).map(z => z.x);
    if(rk.length && rk[0].s >= 0.6){ const top = rk[0].s, tied = rk.filter(z => z.s >= top - 0.001).map(z => z.x), free = tied.filter(x => !taken.has(x.t + x.id)); if(!free.length){ r.note = 'Another photo in this batch already matches this item. Choose a different item or skip.'; }

async function fsha(f){ const h = await crypto.subtle.digest('SHA-256', await f.arrayBuffer()); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join(''); }
async function bulkPhotos(){
  const fs = Array.from($('#bp_f').files || []), log = $('#bp_log'); if(!fs.length) return toast('Choose the pictures first', true);
  let ok = 0, miss = 0; log.textContent = '';
  for(const f of fs){
    let name = f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-'); try { const h = await fsha(f); if(PHOTO_HASH[h]) name = PHOTO_HASH[h]; } catch(e){}
    const path = 'menu/' + name, up = await db.storage.from('food-images').upload(path, f, {contentType:f.type});
    if(up.error && !/exist|duplicate/i.test(up.error.message)){ log.textContent += '✗ ' + f.name + ': ' + up.error.message + '\n'; continue; }
    const url = db.storage.from('food-images').getPublicUrl(path).data.publicUrl, base = name.replace(/^food-/, ''); let n = 0, err = null;
    for(const q of [db.from('food_items').update({image_url:url}).eq('image_url', name), db.from('food_items').update({image_url:url}).eq('image_url', 'food-img/' + base), db.from('food_items').update({image_url:url}).like('image_url', '%/menu/' + name)]){
      const r = await q.select('id'); if(r.error){ err = r.error.message; break; } n += r.data.length;
    }
    if(err) log.textContent += '✗ ' + f.name + ': ' + err + '\n';
    else if(n){ ok += n; log.textContent += '✓ ' + f.name + ' → ' + name + ' → ' + n + ' item(s)\n'; } else { miss++; log.textContent += '– ' + f.name + ' (' + name + '): not recognised as a menu photo\n'; }
  }
  toast(ok + ' menu items updated'); log.textContent += '\nDone: ' + ok + ' items matched, ' + miss + ' files not recognised.';
}
async function addFood(){
  const g = i => $('#'+i).value.trim(); let cid = g('ni_c') || null;
  if(!g('ni_n') || g('ni_p') === '') return toast('Name and price are required', true);
  try {
    if(!cid && g('ni_nc')){ const {data,error} = await db.from('food_categories').insert({vendor_id:FVSEL, name:g('ni_nc'), sort_order:99}).select().single(); if(error) throw error; cid = data.id; }
    const f = $('#ni_f').files[0], img = f ? await upFood(f) : null;
    const {error} = await db.from('food_items').insert({vendor_id:FVSEL, category_id:cid, name:g('ni_n'), description:g('ni_d')||null, base_price_ugx:Number(g('ni_p')), unit:g('ni_u'), step:Number(g('ni_s'))||1, min_qty:Number(g('ni_m'))||1, prep_minutes:Number(g('ni_t'))||20, options:g('ni_o')||null, image_url:img}); if(error) throw error;
    toast('Item added'); go('fmenu');
  } catch(e){ toast(e.message, true); }
}

async function recPay(id, total, dep){
  const v = Number($('#pay-'+id).value); if(isNaN(v) || v < 0 || $('#pay-'+id).value === '') return toast('Enter the total amount received', true);
  const ps = total > 0 && v >= total ? 'paid' : (dep > 0 && v >= dep ? 'deposit_paid' : (v > 0 ? 'part_paid' : 'unpaid'));
  const {error} = await db.from('orders').update({amount_paid_ugx:v, payment_status:ps}).eq('id', id);
  toast(error ? error.message : 'Payment recorded: ' + ps, !!error); if(!error) go('orders');
}

      + '<h2>Rider payouts</h2>' + ((p.data||[]).map(x => `<div class="card row"><span>${esc(x.food_riders?.full_name||'')} · ${dt(x.paid_at)}</span><b>${ugx(x.amount_ugx)}</b></div>`).join('') || '<p class="mut">None yet.</p>');
  },

  async frules(){
    const {data} = await db.from('settings').select('*').like('key','rule_food_%'), v = k => (data||[]).find(x => x.key === k)?.value ?? '';
    const F = [['rule_delivery_per_km','Shop and other deliveries: customer rate per km (UGX)'],['rule_delivery_min_ugx','Minimum delivery fee (UGX)'],['rule_shop_origin_lat','Shop dispatch point: latitude'],['rule_shop_origin_lng','Shop dispatch point: longitude'],['rule_food_free_km','Free delivery radius (km) — included in the 15% markup'],['rule_food_mid_km','Percentage-fee zone ends at (km)'],['rule_food_mid_pct','Extra % of the order between those distances'],['rule_food_customer_per_km','Customer rate per km beyond that (UGX)'],['rule_food_rider_per_km','Rider pay per km (UGX)'],['rule_food_grace_min','Late grace added automatically (minutes)'],['rule_food_penalty_pct_per_min','Restaurant penalty per late minute (% of order value)'],['rule_food_cancel_after_min','Auto-cancel after this many penalty minutes'],['rule_food_stockout_penalty_pct','Penalty for out-of-stock cancellation (%)'],['rule_food_road_factor','Straight-line to road distance factor']];
    $('#view').innerHTML = '<h2>Food delivery rules</h2><div class="card">' + F.map(f => `<label class="mut">${f[1]}</label><input id="fr_${f[0]}" type="number" step="any" value="${esc(v(f[0]))}">`).join('') + '<button onclick="saveFRules()">Save rules</button><p class="mut">Restaurant customer markup (15%) and commission (15%) are set per restaurant in Restaurants.</p></div>';
  },

  async supplies(){
    const {data} = await db.from('food_vendors').select('id').eq('slug','velos-store').maybeSingle();
    if(!data) throw new Error('Velos Foods Store not found. Run velos-foods-seed.sql first.');
    window.FVSEL = data.id; await VIEWS.fmenu();
    $('#view').insertAdjacentHTML('afterbegin', '<h2>Velos Foods Store: supplies</h2><p class="mut">Add groceries, fish, meat and other supplies here with a price per kg or per item and a photo. Customers see them in Velos Foods straight away.</p>');
  },

  async import(){
    $('#view').innerHTML = `<h2>Import catalog</h2><div class="card"><p>Copies every category and product from your website's <b>app.js</b> into the database.
      <br><span class="mut">Run this once. Running it again resets prices and names to what app.js says.</span></p>
      <button onclick="importCatalog()">Import from app.js</button><pre id="ilog"></pre></div>`;
  }
};

function drawP(){
  const q = ($('#q')?.value || '').toLowerCase();
  $('#plist').innerHTML = PR.filter(p => !q || (p.name + ' ' + p.id + ' ' + (p.subcategory||'')).toLowerCase().includes(q)).slice(0,window.PLIM||60).map(p => `
    <div class="card" id="p-${p.id}">
      <div class="row"><span><img src="${esc(p.image_url||'')}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'">${p.in_stock===false?'<span class="pill" style="color:var(--bad)">OUT</span> ':''}${(window.PM||{})[p.id]?`<span class="pill gold">-${PM[p.id]}%</span> `:''}<b>${esc(p.name)}</b></span><span class="mut">${esc(p.id)} · ${esc(p.category_key)}</span></div>
      <div class="grid2"><input class="nm" value="${esc(p.name)}"><input class="pr" type="number" value="${p.price_ugx ?? ''}" placeholder="Request Quote"></div>
      <input class="sq" type="number" min="0" placeholder="Units in stock (blank = don't count)" value="${p.stock_qty??''}"><div class="grid2"><input class="pd" type="number" placeholder="Discount % (0 = end)"><input class="pdays" type="number" placeholder="Days (default 7)"></div><label class="mut">Change photo</label><input class="ph" type="file" accept="image/*"><div class="row"><label><input class="sm ac" type="checkbox" ${p.is_active?'checked':''}> Visible</label> <label><input class="sm st" type="checkbox" ${p.in_stock!==false?'checked':''}> In stock</label>
      <button onclick="saveP('${p.id}')">Save</button></div></div>`).join('') + (PR.length > 60 && !q ? '<p class="mut">Showing 60 — use search to find others.</p>' : '');
}
async function saveP(id){
  const r = $('#p-'+id), v = r.querySelector('.pr').value;
  const upd = {name:r.querySelector('.nm').value.trim(), price_ugx: v===''?null:Number(v), is_active:r.querySelector('.ac').checked, in_stock:r.querySelector('.st').checked && r.querySelector('.sq').value !== '0', stock_qty: r.querySelector('.sq').value === '' ? null : Number(r.querySelector('.sq').value), updated_at:new Date().toISOString()};
  const f = r.querySelector('.ph').files[0];
  try { if(f) upd.image_url = await upImg(f, id); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('products').update(upd).eq('id', id);
  const pd = r.querySelector('.pd').value, pdays = r.querySelector('.pdays').value;
  if(!error && pd !== ''){ await db.from('promotions').update({is_active:false}).eq('product_id', id); if(Number(pd) > 0){ await db.from('promotions').insert({product_id:id, discount_percent:Number(pd), ends_at:new Date(Date.now() + (Number(pdays)||7)*86400000).toISOString()}); } }
  toast(error ? error.message : 'Saved', !!error);
}
async function addP(){
  const v = $('#a_price').value;
  const row = {id:$('#a_id').value.trim(), name:$('#a_name').value.trim(), category_key:$('#a_cat').value, subcategory:$('#a_sub').value.trim()||null, price_ugx:v===''?null:Number(v), image_url:$('#a_img').value.trim()||null};
  if(!row.id || !row.name){ return toast('ID and name are required', true); }
  const f = $('#a_file').files[0];
  try { if(f) row.image_url = await upImg(f, row.id); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('products').insert(row);
  toast(error ? error.message : 'Product added', !!error); if(!error) go('products');
}

async function upImg(f, id){
  if(f.size > 5*1024*1024) throw Error('Photo is over 5 MB');
  const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = id.replace(/[^\w-]/g,'_') + '-' + Date.now() + '.' + ext;
  const {error} = await db.storage.from('product-images').upload(path, f, {contentType:f.type});
  if(error) throw error;
  return db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

function drawR(){
  const g = $('#rg').value, c = $('#rc').value, per = {}, cat = {}; let tot = 0, cnt = 0;
  const p2 = n => String(n).padStart(2,'0');
  const key = d => { const x = new Date(d), y = x.getFullYear(), m = p2(x.getMonth()+1), dd = p2(x.getDate());
    if(g==='year') return ''+y; if(g==='month') return y+'-'+m; if(g==='day') return y+'-'+m+'-'+dd;
    const w = new Date(x); w.setDate(x.getDate() - ((x.getDay()+6)%7)); return 'Week of '+w.getFullYear()+'-'+p2(w.getMonth()+1)+'-'+p2(w.getDate()); };
  RP.forEach(o => { let rev = 0;
    o.order_items.forEach(i => { const ck = i.products?.category_key || 'other'; if(c && ck !== c) return; const v = (i.unit_price_ugx||0) * i.qty; rev += v; cat[ck] = (cat[ck]||0) + v; });
    if(c && !rev) return; const k = key(o.created_at); per[k] = per[k] || {r:0,n:0}; per[k].r += rev; per[k].n++; tot += rev; cnt++; });
  window.RR = Object.keys(per).sort().reverse().map(k => [k, per[k].n, per[k].r]);
  const lab = k => (cats.find(x => x.key === k) || {label:k}).label;
  $('#rout').innerHTML = `<div class="card stat"><b>${ugx(tot)}</b><span class="mut">Grand total · ${cnt} orders</span></div>
    <h2>By period</h2>${RR.length ? RR.map(r => `<div class="card row"><b>${esc(r[0])}</b><span>${r[1]} orders · <b class="gold">${ugx(r[2])}</b></span></div>`).join('') : '<p class="mut">No sales in this view yet.</p>'}
    <h2>By category</h2>${Object.keys(cat).sort((a,b)=>cat[b]-cat[a]).map(k => `<div class="card row"><span>${esc(lab(k))}</span><b class="gold">${ugx(cat[k])}</b></div>`).join('')}
    <button class="ghost" onclick="csvR()">Download CSV</button>`;
}
function csvR(){
  const rows = [['Period','Orders','Revenue UGX'], ...RR];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(',')).join('\n')], {type:'text/csv'}));
  a.download = 'velos-sales.csv'; a.click();
}

async function importCatalog(){
  if(!confirm('Import all products from app.js now?')) return;
  const log = m => $('#ilog').textContent += m + '\n';
  try {
    const src = await (await fetch('app.js?' + Date.now())).text();
    const grab = name => {
      const i = src.indexOf('const ' + name + ' ='); if(i < 0) throw Error(name + ' not found in app.js');
      const o = src.slice(i).search(name === 'CATEGORY_NOTES' ? /\{/ : /\[/) + i;
      const open = src[o], close = open === '{' ? '}' : ']'; let d = 0, q = null;
      for(let j = o; j < src.length; j++){
        const c = src[j];
        if(q){ if(c === '\\') j++; else if(c === q) q = null; continue; }
        if(c === '/' && src[j+1] === '/'){ j = src.indexOf('\n', j); continue; }
        if(c === "'" || c === '"' || c === '`'){ q = c; continue; }
        if(c === open) d++; else if(c === close && --d === 0) return new Function('return ' + src.slice(o, j+1))();
      }
      throw Error('Could not read ' + name);
    };
    const C = grab('CATEGORIES'), N = grab('CATEGORY_NOTES'), P = grab('PRODUCTS');
    log(`Found ${C.length} categories and ${P.length} products.`);
    let r = await db.from('categories').upsert(C.map((c,i) => ({key:c.key, label:c.label, thumb_url:c.thumb, note:N[c.key]||null, sort_order:i})));
    if(r.error) throw r.error; log('Categories saved.');
    const rows = P.map(p => ({id:p.id, category_key:p.cat, subcategory:p.sub||null, name:p.name, price_ugx:p.price??null, image_url:p.img, verified_photo:!!p.real, is_new:!!p.new}));
    for(let i = 0; i < rows.length; i += 50){
      r = await db.from('products').upsert(rows.slice(i, i+50)); if(r.error) throw r.error;
      log(`Products ${Math.min(i+50, rows.length)} / ${rows.length} saved.`);
    }
    log('Done ✔'); toast('Catalog imported');
  } catch(e){ log('ERROR: ' + (e.message || JSON.stringify(e))); toast('Import failed', true); }
}
