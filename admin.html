<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://ptmedfjkapzqxltntynf.supabase.co; base-uri 'self'; form-action 'none'"><title>Velos Admin</title>
<style>
:root{--bg:#0c1226;--card:#141b34;--line:#26305a;--gold:#e8c766;--txt:#f4f1ea;--mut:#8a93ab;--ok:#7fd99a;--bad:#e6493f}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt)}
[hidden]{display:none!important}
h1,h2{font-family:Georgia,serif;margin:0}h2{font-size:20px;margin:16px 0 10px}
.box{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;background:#0c1226;color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--gold);color:#080d1a;font-weight:700;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
header{position:sticky;top:0;background:#080d1a;border-bottom:1px solid var(--line);padding:10px 12px;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px}nav button{white-space:nowrap;background:none;color:var(--mut);border:1px solid var(--line)}
nav button.on{background:var(--gold);color:#080d1a;border-color:var(--gold)}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.gold{color:var(--gold)}a{color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center}.stat b{font-size:28px;display:block;color:var(--gold)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.sm{width:auto;display:inline-block;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:99px;font-weight:700;z-index:9}
#toast.bad{background:var(--bad);color:#fff}pre{white-space:pre-wrap;color:var(--mut);font-size:13px}
</style></head><body>

<div id="login" class="box" hidden>
  <h1 class="gold">Velos Admin</h1><p class="mut">Staff sign-in only</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button>
  <p id="err" style="color:var(--bad)"></p>
</div>

<div id="app" hidden>
  <header>
    <div class="top"><b class="gold">VELOS ADMIN</b><span><span id="who" class="mut"></span> <button class="ghost" onclick="signOut()">Sign out</button></span></div>
    <nav id="nav"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const db = supabase.createClient(VELOS_SUPABASE.url, VELOS_SUPABASE.key);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ugx = n => n == null ? 'Request Quote' : 'UGX ' + Number(n).toLocaleString('en-US');
const dt = s => new Date(s).toLocaleString('en-GB', {dateStyle:'medium', timeStyle:'short'});
const wa = p => 'https://wa.me/' + String(p || '').replace(/\D/g, '');
let me = null, cats = [];

function toast(m, bad){ const t=$('#toast'); t.textContent=m; t.className=bad?'bad':''; t.hidden=false; setTimeout(()=>t.hidden=true,2200); }
function show(inApp){ $('#login').hidden = inApp; $('#app').hidden = !inApp; }

async function signIn(){
  $('#err').textContent = '';
  const {error} = await db.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  if(error){ $('#err').textContent = error.message; return; }
  boot();
}
async function signOut(){ await db.auth.signOut(); show(false); }

async function boot(){
  const {data:{session}} = await db.auth.getSession();
  if(!session) return show(false);
  const {data:p, error:pe} = await db.from('profiles').select('full_name,role').eq('id', session.user.id).maybeSingle();
  if(!p){ await db.auth.signOut(); show(false); $('#err').textContent = pe ? 'Database error: ' + pe.message : 'This account is not authorised as staff. (login id ' + session.user.id + ')'; return; }
  me = p; $('#who').textContent = p.full_name || p.role; show(true);
  const {data} = await db.from('categories').select('*').order('sort_order'); cats = data || [];
  const hide = ({manager:['team','settings','frules'], staff:['report','products','agents','leads','team','import','export','security','settings','fmenu','fvendors','friders','frules']})[p.role] || [];
  window.TB = TABS.filter(t => !hide.includes(t[0]));
  $('#nav').innerHTML = TB.map(t => `<button id="n-${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  go('home');
}

const TABS = [['home','Home'],['orders','Orders'],['customers','Customers'],['report','Sales'],['agents','Agents'],['leads','Leads'],['gifts','Gifts & Sourcing'],['designs','Designs'],['products','Products'],['techs','Technicians'],['service','Services'],['security','Security'],['forders','Food orders'],['fmenu','Food menu'],['fvendors','Restaurants'],['friders','Riders'],['frules','Food rules'],['inq','Inquiries'],['team','Team'],['messages','Messages'],['export','Export'],['settings','Settings'],['import','Import']];
async function go(k){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === 'n-'+k));
  $('#view').innerHTML = '<p class="mut">Loading…</p>';
  try { await VIEWS[k](); } catch(e){ $('#view').innerHTML = '<p style="color:var(--bad)">'+esc(e.message)+'</p>'; }
}

async function st(table, id, v){
  const {error} = await db.from(table).update({status:v}).eq('id', id);
  toast(error ? error.message : 'Saved', !!error);
}
const STL = {new:'received',confirmed:'confirmed',dispatched:'out for delivery',delivered:'delivered',cancelled:'cancelled'};
const ntf = (p, txt) => 'https://wa.me/' + String(p||'').replace(/\D/g,'') + '?text=' + encodeURIComponent(txt);
const tbase = () => location.href.replace(/admin\.html.*$/, '') + 'track.html';
function drawC(){
  const q = ($('#cq')?.value || '').toLowerCase();
  $('#clist').innerHTML = CU.filter(c => !q || (String(c.n) + ' ' + c.p).toLowerCase().includes(q)).slice(0,80).map(c => `<div class="card"><div class="row"><b>${esc(c.n)}</b><b class="gold">${ugx(c.spent)}</b></div>
    <div><a href="${wa(c.p)}" target="_blank">${esc(c.p)}</a></div><div class="mut">${c.o} order(s) · ${c.s} service request(s) · last activity ${dt(c.last)}</div></div>`).join('') || '<p class="mut">No customers yet.</p>';
}
async function exportT(t){
  const {data,error} = await db.from(t).select('*').limit(10000);
  if(error) return toast(error.message, true); if(!data.length) return toast('Nothing to export yet', true);
  const cols = Object.keys(data[0]), q = v => '"' + String(v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : v)).replace(/"/g,'""') + '"';
  const csv = [cols.join(',')].concat(data.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'velos-' + t + '-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
}
async function resendMsg(id){
  const n = NF.find(x => x.id === id), {error} = await db.from('notifications').insert({kind:n.kind, ref:n.ref, phone:n.phone, email:n.email, message:n.message});
  toast(error ? error.message : 'Queued again', !!error); if(!error) go('messages');
}
async function approveQuote(id, sub){ const v = Number($('#fq-'+id).value); const {error} = await db.from('food_orders').update({delivery_fee_ugx:v, total_ugx:sub+v, quote_approved:true}).eq('id', id); toast(error ? error.message : 'Quote approved', !!error); if(!error) go('forders'); }
async function offerRider(no, id){ const r = $('#rd-'+id).value; if(!r) return toast('Choose a rider', true); const {error} = await db.rpc('food_offer_rider', {p_order_no:no, p_rider:r}); toast(error ? error.message : 'Job offered to rider', !!error); if(!error) go('forders'); }
async function adminCancel(no, id){ if(!confirm('Cancel this order?')) return; const {error} = await db.rpc('food_admin_cancel', {p_order_no:no, p_reason:$('#cr-'+id).value, p_waive:$('#cw-'+id).checked}); toast(error ? error.message : 'Order cancelled', !!error); if(!error) go('forders'); }
async function upFood(f){ if(f.size > 5*1024*1024) throw Error('Photo is over 5 MB'); const ext = (f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''), p = 'f' + Date.now() + Math.random().toString(36).slice(2,7) + '.' + ext;
  const {error} = await db.storage.from('food-images').upload(p, f, {contentType:f.type}); if(error) throw error; return db.storage.from('food-images').getPublicUrl(p).data.publicUrl; }
function drawF(){
  const q = ($('#fq')?.value||'').toLowerCase(), cn = {}; FC.forEach(c => cn[c.id] = c.name);
  $('#flist').innerHTML = FI.filter(i => !q || i.name.toLowerCase().includes(q)).slice(0,60).map(i => `<div class="card" id="fi-${i.id}"><div class="row"><span><img src="${esc(i.image_url||'')}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;background:#fff" onerror="this.style.display='none'"><b>${esc(i.name)}</b></span><span class="mut">${esc(cn[i.category_id]||'')} · ${i.unit}</span></div>
    <div class="grid2"><input class="fp" type="number" placeholder="Base price UGX" value="${i.base_price_ugx??''}"><input class="ft" type="number" placeholder="Prep minutes" value="${i.prep_minutes}"></div>
    <div class="grid2"><input class="fd" type="number" placeholder="Flash discount % (0 = end)"><input class="fh" type="number" placeholder="Hours (default 24)"></div><label class="mut">Change photo</label><input class="ff" type="file" accept="image/*">
    <div class="row"><label><input class="sm fa" type="checkbox" ${i.is_available?'checked':''}> Available</label><label><input class="sm fv" type="checkbox" ${i.is_active?'checked':''}> Shown on menu</label><button onclick="saveFood('${i.id}')">Save</button></div></div>`).join('') + (FI.length > 60 && !q ? '<p class="mut">Showing 60 — use search for others.</p>' : '');
}
async function saveFood(id){
  const r = $('#fi-'+id), p = r.querySelector('.fp').value, upd = {base_price_ugx: p===''?null:Number(p), prep_minutes:Number(r.querySelector('.ft').value)||20, is_available:r.querySelector('.fa').checked, is_active:r.querySelector('.fv').checked};
  const f = r.querySelector('.ff').files[0]; try { if(f) upd.image_url = await upFood(f); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('food_items').update(upd).eq('id', id); if(error) return toast(error.message, true);
  const d = r.querySelector('.fd').value; if(d !== ''){ await db.from('food_promos').update({is_active:false}).eq('item_id', id); if(Number(d) > 0) await db.from('food_promos').insert({item_id:id, discount_percent:Number(d), ends_at:new Date(Date.now() + (Number(r.querySelector('.fh').value)||24)*36e5).toISOString()}); }
  toast('Saved');
}
async function addFood(){
  const g = i => $('#'+i).value.trim(); let cid = g('ni_c') || null;
  if(!g('ni_n') || g('ni_p') === '') return toast('Name and price are required', true);
  try {
    if(!cid && g('ni_nc')){ const {data,error} = await db.from('food_categories').insert({vendor_id:FVSEL, name:g('ni_nc'), sort_order:99}).select().single(); if(error) throw error; cid = data.id; }
    const f = $('#ni_f').files[0], img = f ? await upFood(f) : null;
    const {error} = await db.from('food_items').insert({vendor_id:FVSEL, category_id:cid, name:g('ni_n'), description:g('ni_d')||null, base_price_ugx:Number(g('ni_p')), unit:g('ni_u'), step:Number(g('ni_s'))||1, min_qty:Number(g('ni_m'))||1, prep_minutes:Number(g('ni_t'))||20, image_url:img}); if(error) throw error;
    toast('Item added'); go('fmenu');
  } catch(e){ toast(e.message, true); }
}
async function vStatus(id, s){ const v = FVN?.[id]; const {data} = await db.from('food_vendors').select('name,slug').eq('id', id).single(); const upd = {status:s, is_active:s==='active'}; if(data && data.slug.startsWith('pending-')) upd.slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Math.random().toString(36).slice(2,6);
  const {error} = await db.from('food_vendors').update(upd).eq('id', id); toast(error ? error.message : 'Saved', !!error); }
const FVN = {};
async function saveVendor(id){ const {error} = await db.from('food_vendors').update({commission_pct:Number($('#vc-'+id).value), markup_pct:Number($('#vm-'+id).value)}).eq('id', id); toast(error ? error.message : 'Saved', !!error); }
async function saveLoc(id){ const {error} = await db.from('food_vendors').update({lat:Number($('#vlat-'+id).value), lng:Number($('#vlng-'+id).value)}).eq('id', id); toast(error ? error.message : 'Location saved', !!error); }
async function linkFood(kind, id, inp){ const e = $('#'+inp).value.trim(); if(!e) return toast('Enter their login email', true); const {error} = await db.rpc('food_link', {p_kind:kind, p_id:id, p_email:e}); toast(error ? error.message : 'Login linked', !!error); }
async function makePayout(id){ const {error} = await db.rpc('food_make_vendor_payout', {p_vendor:id, p_from:$('#pf-'+id).value, p_to:$('#pt-'+id).value}); toast(error ? error.message : 'Payout created', !!error); if(!error) go('fvendors'); }
async function paidVendor(id){ const {error} = await db.from('food_vendor_payouts').update({status:'paid', paid_at:new Date().toISOString(), reference:$('#pr-'+id).value.trim()||null}).eq('id', id); toast(error ? error.message : 'Marked paid', !!error); if(!error) go('fvendors'); }
async function payRider(id){ const {error} = await db.rpc('food_pay_rider', {p_rider:id, p_ref:$('#rr-'+id).value.trim()||null}); toast(error ? error.message : 'Rider paid', !!error); if(!error) go('friders'); }
async function saveFRules(){ const ks = ['rule_delivery_per_km','rule_delivery_min_ugx','rule_shop_origin_lat','rule_shop_origin_lng','rule_food_free_km','rule_food_mid_km','rule_food_mid_pct','rule_food_customer_per_km','rule_food_rider_per_km','rule_food_grace_min','rule_food_penalty_pct_per_min','rule_food_cancel_after_min','rule_food_stockout_penalty_pct','rule_food_road_factor'];
  for(const k of ks){ const {error} = await db.from('settings').upsert({key:k, value:String(Number($('#fr_'+k).value))}); if(error) return toast(error.message, true); } toast('Rules saved'); }
async function saveAmt(id){
  const v = $('#am-'+id).value, p = $('#tp-'+id).value, {error} = await db.from('service_requests').update({amount_ugx: v===''?null:Number(v), tech_pay_ugx: p===''?null:Number(p)}).eq('id', id);
  toast(error ? error.message : 'Saved', !!error);
}
async function techPaid(id){ const {error} = await db.from('service_requests').update({tech_paid_at:new Date().toISOString()}).eq('id', id); toast(error ? error.message : 'Marked paid', !!error); if(!error) go('service'); }
async function linkP(fn, id){
  const e = $('#lk-'+id).value.trim(); if(!e) return toast('Enter their login email', true);
  const {error} = await db.rpc(fn, fn === 'link_company' ? {p_company:id, p_email:e} : {p_app:id, p_email:e}); toast(error ? error.message : 'Login linked', !!error);
}
const period = () => new Date().toISOString().slice(0,7);
async function cdocs(id){
  const c = SC.find(x => x.id === id), box = $('#cd-'+id); box.innerHTML = '<span class="mut">Opening…</span>'; const out = [];
  for(const p of (c.doc_paths||[])){ const {data,error} = await db.storage.from('company-docs').createSignedUrl(p, 300); out.push(error ? `<div class="mut">${esc(p)}: ${esc(error.message)}</div>` : `<div><a href="${data.signedUrl}" target="_blank" rel="noopener">${esc(p.split('/').pop().split('-')[0])}</a></div>`); }
  box.innerHTML = out.join('') + '<div class="mut">Links expire in 5 minutes.</div>';
}
async function saveCo(id){ const {error} = await db.from('security_companies').update({staff_notes:$('#sn-'+id).value.trim()||null}).eq('id', id); toast(error ? error.message : 'Saved', !!error); }
async function newContract(){
  const g = i => $('#'+i).value.trim(), row = {client_name:g('nc_n'), client_phone:g('nc_p'), site_address:g('nc_a'), company_id:g('nc_c')||null, guards:Number(g('nc_g'))||1, shift:g('nc_s')||null,
    start_date:g('nc_sd'), end_date:g('nc_ed')||null, client_monthly_fee_ugx:Number(g('nc_f'))||0, partner_monthly_payout_ugx:Number(g('nc_o'))||0, service_req_no:g('nc_r')?Number(g('nc_r').replace(/\D/g,'')):null, status:'active'};
  if(!row.client_name || !row.client_phone || !row.site_address || !row.start_date) return toast('Client, phone, site and start date are required', true);
  const {error} = await db.from('security_contracts').insert(row); toast(error ? error.message : 'Contract created', !!error); if(!error) go('security');
}
async function makePay(cid, coid, amt){
  const {error} = await db.from('partner_payments').upsert({contract_id:cid, company_id:coid, period:period(), amount_ugx:amt}, {onConflict:'contract_id,period', ignoreDuplicates:true});
  toast(error ? error.message : 'Payout for ' + period() + ' queued', !!error); if(!error) go('security');
}
async function recReceipt(cid){
  const v = Number($('#rc-'+cid).value); if(!(v > 0)) return toast('Enter the amount received', true);
  const {error} = await db.from('contract_receipts').insert({contract_id:cid, period:period(), amount_ugx:v, reference:$('#rr-'+cid).value.trim()||null}); toast(error ? error.message : 'Receipt recorded', !!error);
}
async function payPartner(id){
  const {error} = await db.from('partner_payments').update({status:'paid', paid_at:new Date().toISOString(), reference:$('#pp-'+id).value.trim()||null}).eq('id', id);
  toast(error ? error.message : 'Marked paid', !!error); if(!error) go('security');
}
async function saveRules(){
  const R = {rule_deposit_threshold_ugx:'rt', rule_deposit_single_pct:'rs', rule_deposit_bulk_pct:'rb', rule_bulk_min_units:'rm'};
  for(const k in R){ const {error} = await db.from('settings').upsert({key:k, value:String(Number($('#'+R[k]).value))}); if(error) return toast(error.message, true); }
  toast('Rules saved');
}
async function saveRate(id){ const {error} = await db.from('agents').update({commission_rate:Number($('#cr-'+id).value)}).eq('id', id); toast(error ? error.message : 'Rate saved', !!error); }
async function payAgent(id){
  const v = Number($('#pa-'+id).value); if(!(v > 0)) return toast('Enter the payout amount', true);
  const {error} = await db.from('agent_payouts').insert({agent_id:id, amount_ugx:v, reference:$('#pr-'+id).value.trim()||null});
  toast(error ? error.message : 'Payout recorded', !!error); if(!error) go('agents');
}
async function saveLeadNote(id){ const {error} = await db.from('leads').update({admin_note:$('#ln-'+id).value.trim()||null}).eq('id', id); toast(error ? error.message : 'Saved', !!error); }
async function setRole(){
  const {error} = await db.rpc('set_staff_role', {p_email:$('#te').value.trim(), p_role:$('#tr').value});
  toast(error ? error.message : 'Team updated', !!error); if(!error) go('team');
}
async function saveDQuote(id){
  const v = $('#dq-'+id).value, {error} = await db.from('design_requests').update({quote_ugx: v===''?null:Number(v)}).eq('id', id);
  toast(error ? error.message : 'Quote saved', !!error);
}
async function saveQuote(id){
  const v = $('#q-'+id).value, {error} = await db.from('gift_requests').update({quote_ugx: v===''?null:Number(v)}).eq('id', id);
  toast(error ? error.message : 'Quote saved', !!error);
}
async function docs(id){
  const t = TD.find(x => x.id === id), box = $('#d-'+id); box.innerHTML = '<span class="mut">Opening…</span>';
  const out = [];
  for(const p of (t.doc_paths||[])){
    const {data,error} = await db.storage.from('technician-docs').createSignedUrl(p, 300);
    out.push(error ? `<div class="mut">${esc(p)}: ${esc(error.message)}</div>` : `<div><a href="${data.signedUrl}" target="_blank" rel="noopener">${esc(p.split('/').pop().split('-')[0] + ' — ' + p.split('.').pop())}</a></div>`);
  }
  box.innerHTML = out.join('') + '<div class="mut">Links expire in 5 minutes.</div>';
}
async function assignT(id){
  const v = $('#as-'+id).value; if(!v) return toast('Choose a technician first', true);
  const {error} = await db.from('service_requests').update({assigned_to:v, status:'assigned'}).eq('id', id);
  toast(error ? error.message : 'Technician assigned', !!error); if(!error) go('service');
}
async function recPay(id, total, dep){
  const v = Number($('#pay-'+id).value); if(isNaN(v) || v < 0 || $('#pay-'+id).value === '') return toast('Enter the total amount received', true);
  const ps = total > 0 && v >= total ? 'paid' : (dep > 0 && v >= dep ? 'deposit_paid' : (v > 0 ? 'part_paid' : 'unpaid'));
  const {error} = await db.from('orders').update({amount_paid_ugx:v, payment_status:ps}).eq('id', id);
  toast(error ? error.message : 'Payment recorded: ' + ps, !!error); if(!error) go('orders');
}
async function stf(table, id, f, v){ const {error} = await db.from(table).update({[f]:v}).eq('id', id); toast(error ? error.message : 'Saved', !!error); }
const sel = (table, id, cur, opts) => `<select class="sm" onchange="st('${table}','${id}',this.value)">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;

const VIEWS = {
  async home(){
    await VIEWS.home0();
    if(me.role === 'staff') return;

async function saveP(id){
  const r = $('#p-'+id), v = r.querySelector('.pr').value;
  const upd = {name:r.querySelector('.nm').value.trim(), price_ugx: v===''?null:Number(v), is_active:r.querySelector('.ac').checked, in_stock:r.querySelector('.st').checked && r.querySelector('.sq').value !== '0', stock_qty: r.querySelector('.sq').value === '' ? null : Number(r.querySelector('.sq').value), updated_at:new Date().toISOString()};
  const f = r.querySelector('.ph').files[0];
  try { if(f) upd.image_url = await upImg(f, id); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('products').update(upd).eq('id', id);
  const pd = r.querySelector('.pd').value, pdays = r.querySelector('.pdays').value;
  if(!error && pd !== ''){ await db.from('promotions').update({is_active:false}).eq('product_id', id); if(Number(pd) > 0){ await db.from('promotions').insert({product_id:id, discount_percent:Number(pd), ends_at:new Date(Date.now() + (Number(pdays)||7)*86400000).toISOString()}); } }
  toast(error ? error.message : 'Saved', !!error);
}
async function addP(){
  const v = $('#a_price').value;
  const row = {id:$('#a_id').value.trim(), name:$('#a_name').value.trim(), category_key:$('#a_cat').value, subcategory:$('#a_sub').value.trim()||null, price_ugx:v===''?null:Number(v), image_url:$('#a_img').value.trim()||null};
  if(!row.id || !row.name){ return toast('ID and name are required', true); }
  const f = $('#a_file').files[0];
  try { if(f) row.image_url = await upImg(f, row.id); } catch(e){ return toast('Photo upload failed: ' + e.message, true); }
  const {error} = await db.from('products').insert(row);
  toast(error ? error.message : 'Product added', !!error); if(!error) go('products');
}

async function upImg(f, id){
  if(f.size > 5*1024*1024) throw Error('Photo is over 5 MB');
  const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path = id.replace(/[^\w-]/g,'_') + '-' + Date.now() + '.' + ext;
  const {error} = await db.storage.from('product-images').upload(path, f, {contentType:f.type});
  if(error) throw error;
  return db.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

function drawR(){
  const g = $('#rg').value, c = $('#rc').value, per = {}, cat = {}; let tot = 0, cnt = 0;
  const p2 = n => String(n).padStart(2,'0');
  const key = d => { const x = new Date(d), y = x.getFullYear(), m = p2(x.getMonth()+1), dd = p2(x.getDate());
    if(g==='year') return ''+y; if(g==='month') return y+'-'+m; if(g==='day') return y+'-'+m+'-'+dd;
    const w = new Date(x); w.setDate(x.getDate() - ((x.getDay()+6)%7)); return 'Week of '+w.getFullYear()+'-'+p2(w.getMonth()+1)+'-'+p2(w.getDate()); };
  RP.forEach(o => { let rev = 0;
    o.order_items.forEach(i => { const ck = i.products?.category_key || 'other'; if(c && ck !== c) return; const v = (i.unit_price_ugx||0) * i.qty; rev += v; cat[ck] = (cat[ck]||0) + v; });
    if(c && !rev) return; const k = key(o.created_at); per[k] = per[k] || {r:0,n:0}; per[k].r += rev; per[k].n++; tot += rev; cnt++; });
  window.RR = Object.keys(per).sort().reverse().map(k => [k, per[k].n, per[k].r]);
  const lab = k => (cats.find(x => x.key === k) || {label:k}).label;
  $('#rout').innerHTML = `<div class="card stat"><b>${ugx(tot)}</b><span class="mut">Grand total · ${cnt} orders</span></div>
    <h2>By period</h2>${RR.length ? RR.map(r => `<div class="card row"><b>${esc(r[0])}</b><span>${r[1]} orders · <b class="gold">${ugx(r[2])}</b></span></div>`).join('') : '<p class="mut">No sales in this view yet.</p>'}
    <h2>By category</h2>${Object.keys(cat).sort((a,b)=>cat[b]-cat[a]).map(k => `<div class="card row"><span>${esc(lab(k))}</span><b class="gold">${ugx(cat[k])}</b></div>`).join('')}
    <button class="ghost" onclick="csvR()">Download CSV</button>`;
}
function csvR(){
  const rows = [['Period','Orders','Revenue UGX'], ...RR];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(',')).join('\n')], {type:'text/csv'}));
  a.download = 'velos-sales.csv'; a.click();
}

async function importCatalog(){
  if(!confirm('Import all products from app.js now?')) return;
  const log = m => $('#ilog').textContent += m + '\n';
  try {
    const src = await (await fetch('app.js?' + Date.now())).text();
    const grab = name => {
      const i = src.indexOf('const ' + name + ' ='); if(i < 0) throw Error(name + ' not found in app.js');
      const o = src.slice(i).search(name === 'CATEGORY_NOTES' ? /\{/ : /\[/) + i;
      const open = src[o], close = open === '{' ? '}' : ']'; let d = 0, q = null;
      for(let j = o; j < src.length; j++){
        const c = src[j];
        if(q){ if(c === '\\') j++; else if(c === q) q = null; continue; }
        if(c === '/' && src[j+1] === '/'){ j = src.indexOf('\n', j); continue; }
        if(c === "'" || c === '"' || c === '`'){ q = c; continue; }
        if(c === open) d++; else if(c === close && --d === 0) return new Function('return ' + src.slice(o, j+1))();
      }
      throw Error('Could not read ' + name);
    };
    const C = grab('CATEGORIES'), N = grab('CATEGORY_NOTES'), P = grab('PRODUCTS');
    log(`Found ${C.length} categories and ${P.length} products.`);
    let r = await db.from('categories').upsert(C.map((c,i) => ({key:c.key, label:c.label, thumb_url:c.thumb, note:N[c.key]||null, sort_order:i})));
    if(r.error) throw r.error; log('Categories saved.');
    const rows = P.map(p => ({id:p.id, category_key:p.cat, subcategory:p.sub||null, name:p.name, price_ugx:p.price??null, image_url:p.img, verified_photo:!!p.real, is_new:!!p.new}));
    for(let i = 0; i < rows.length; i += 50){
      r = await db.from('products').upsert(rows.slice(i, i+50)); if(r.error) throw r.error;
      log(`Products ${Math.min(i+50, rows.length)} / ${rows.length} saved.`);
    }
    log('Done ✔'); toast('Catalog imported');
  } catch(e){ log('ERROR: ' + (e.message || JSON.stringify(e))); toast('Import failed', true); }
}
