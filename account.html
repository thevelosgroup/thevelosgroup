<!doctype html><html lang="en"><head><script src="velos-splash.js"></script><link rel="preconnect" href="https://ptmedfjkapzqxltntynf.supabase.co" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | The Velos Group</title><meta name="robots" content="noindex"><link rel="stylesheet" href="foods.css">
<link rel="manifest" href="manifest-site.json"><meta name="theme-color" content="#03113e"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="velos-pwa.js" defer></script></head>
<body><div class="w" style="max-width:520px"><p><a href="index.html" style="color:#e8c766">← Back to Velos</a></p><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)},V=function(h){$('v').innerHTML=h};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function er(m){$('er').className='m bad';$('er').textContent=m}
function auth(m){V('<h1>My Velos Account</h1><p class="m">Track orders, save your details and get offers.</p><div class="c"><button class="full" onclick="goog()">Continue with Google</button><p class="m" style="text-align:center">or</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="reg()">Create a new account</button><p id="er" class="m'+(m?' ok':'')+'">'+(m||'')+'</p></div><a class="m" href="https://wa.me/256755215751" style="color:#e8c766">💬 Need help? Chat with us on WhatsApp</a>')}
function reg(){V('<h1>Create your account</h1><div class="c"><input id="n" placeholder="Full name *" autocomplete="name"><input id="p" type="tel" placeholder="Phone number, e.g. 0755 215 751 *" autocomplete="tel"><input id="em" type="email" placeholder="Email *" autocomplete="email"><input id="pw" type="password" placeholder="Password (8+ characters) *" autocomplete="new-password"><button class="full" onclick="su()">Create account</button><button class="g full" onclick="auth()">I already have an account</button><p id="er" class="m"></p></div>')}
async function su(){var n=$('n').value.trim(),p=$('p').value.replace(/[^\d+]/g,''),e=$('em').value.trim(),w=$('pw').value;
 if(n.length<2||p.replace(/\D/g,'').length<9||!/^\S+@\S+\.\S+$/.test(e))return er('Please enter your full name, a valid phone number and a valid email.');if(w.length<8)return er('Password must be at least 8 characters.');
 var r=await db.auth.signUp({email:e,password:w,options:{data:{full_name:n,phone:p}}});if(r.error)return er(r.error.message);
 if(r.data.session)boot();else auth('Account created ✓ Check your email and tap the confirmation link, then sign in here.')}
async function si(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)er(r.error.message);else boot()}
async function goog(){var r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(r.error)er('Google sign-in is not switched on yet. Please use email for now.')}
async function out(){await db.auth.signOut();boot()}
async function save(){var r=await db.auth.updateUser({data:{full_name:$('n').value.trim(),phone:$('p').value.trim()}});$('toast').textContent=r.error?r.error.message:'Saved';$('toast').hidden=false;setTimeout(function(){$('toast').hidden=true},2200);if(!r.error)pvLoad()}
async function boot(){var r=await db.auth.getSession(),s=r.data.session;if(!s)return auth();var m=s.user.user_metadata||{};
 V('<h1>Hello, '+esc((m.full_name||s.user.email).split(' ')[0])+' 👋</h1><div class="c"><input id="n" placeholder="Full name" value="'+esc(m.full_name||'')+'"><input id="p" type="tel" placeholder="Phone" value="'+esc(m.phone||'')+'"><p class="m">Email: '+esc(s.user.email)+'</p><button class="full" onclick="save()">Save my details</button></div><div class="c" id="pv"><p class="m">Checking your phone…</p></div><div class="c"><a href="food-track.html" style="color:#e8c766">📦 Track a food order</a><br><a href="track.html" style="color:#e8c766">📦 Track a shop order</a><br><a href="https://wa.me/256755215751" style="color:#e8c766">💬 Chat with us on WhatsApp</a></div><button class="g" onclick="out()">Sign out</button>');pvLoad()}
var PV_WA='256755215751',pvT=null;
function pvBox(h){var b=$('pv');if(b)b.innerHTML=h}
async function pvLoad(){clearTimeout(pvT);var r=await db.rpc('my_phone_status');
 if(r.error||!r.data)return pvBox('<p class="m">Phone check is not switched on yet.</p>');
 var d=r.data,ph=esc(d.current_phone||'');
 if(!d.current_phone)return pvBox('<b>📱 Verify your phone</b><p class="m">Add your phone number above and tap Save, then verify it here.</p>');
 if(d.verified)return pvBox('<b style="color:#6fdc8c">✅ Phone verified</b><p class="m">'+ph+'</p>');
 if(d.pending&&d.pending.phone===d.current_phone){var msg='Verify my Velos phone number. Code: '+d.pending.code;
  pvBox('<b>📱 Verify '+ph+'</b><p class="m">Step 1: tap the green button. WhatsApp opens with your code already typed.<br>Step 2: press Send (use this same phone number).<br>Step 3: we confirm it, usually within a few hours. Then this page shows ✅.</p><a class="full" style="display:block;text-align:center;background:#25d366;color:#052e16;padding:12px;border-radius:10px;font-weight:700;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+PV_WA+'?text='+encodeURIComponent(msg)+'">Send code on WhatsApp</a><p class="m">Your code: <b>'+esc(d.pending.code)+'</b></p><button class="g full" onclick="pvLoad()">I have sent it · refresh</button><button class="g full" onclick="pvAsk()">Get a new code</button>');
  pvT=setTimeout(pvLoad,30000);return}
 pvBox('<b>📱 Verify your phone</b><p class="m">'+ph+(d.last_status==='rejected'?' · last check was not approved, please try again':'')+'</p><p class="m">Verified numbers get faster order updates and delivery calls.</p><button class="full" onclick="pvAsk()">Verify my number</button>')}
async function pvAsk(){var r=await db.rpc('request_phone_verification',{p_phone:(document.getElementById('p')||{}).value||''});
 if(r.error){pvBox('<p class="m bad">'+esc(r.error.message)+'</p><button class="g full" onclick="pvLoad()">Back</button>');return}
 pvLoad()}
boot();
</script></body></html>
