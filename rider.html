<!doctype html><html lang="en"><head><script src="velos-splash.js"></script><link rel="manifest" href="manifest-rider.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider Portal | Velos Foods</title><meta name="robots" content="noindex"><link rel="stylesheet" href="foods.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="velos-alerts.js"></script></head><body><div class="w" style="max-width:720px"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)},V=function(h){$('v').innerHTML=h},PT=null,OSEEN={},PU={},ALI=false;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},ugx=function(n){return 'UGX '+Math.round(n||0).toLocaleString('en-US')};
function toast(m,b){var t=$('toast');t.textContent=m;t.style.background=b?'#b3261e':'';t.style.color=b?'#fff':'';t.hidden=false;setTimeout(function(){t.hidden=true},2500)}
async function out(){clearInterval(PT);VelosAlerts.stopAll();Object.keys(PU).forEach(puStop);await db.auth.signOut();boot()}
async function boot(){var r=await db.auth.getSession(),s=r.data.session;if(!s)return auth();var m=await db.rpc('rider_me');
  if(!m.data)return V('<h1>Velos Rider</h1><div class="c"><p>Signed in as <b>'+esc(s.user.email)+'</b>. This login is not linked to a rider profile yet.</p><h2>Apply to ride with Velos</h2><input id="n" placeholder="Full name *"><input id="p" type="tel" placeholder="Phone *"><select id="vh"><option>Motorcycle</option><option>Bicycle</option><option>Car</option></select><input id="pl" placeholder="Number plate"><input id="id" placeholder="National ID number *"><select id="pm"><option>MTN Mobile Money</option><option>Airtel Money</option></select><input id="pn" placeholder="Mobile money number *"><button class="full" onclick="apply()">Submit application</button><p class="m">You earn UGX 850 per km on every delivered order, credited to your dashboard and paid daily. When approved, we link this login ('+esc(s.user.email)+').</p><p id="er" class="m bad"></p></div><button class="g" onclick="out()">Sign out</button>');
  if(m.data.status!=='active')return V('<h1>Hello, '+esc(m.data.full_name)+'</h1><div class="c"><p>Your account is <b>'+esc(m.data.status)+'</b>. Jobs appear here once Velos approves you.</p></div><button class="g" onclick="out()">Sign out</button>');
  window.ME=m.data;if(!ALI){ALI=true;VelosAlerts.init({offlineText:'NO INTERNET. New job offers will NOT reach you until you are back online.',onOnline:function(){dash()}})}setTimeout(function(){VelosPWA.prompt()},1500);dash();clearInterval(PT);PT=setInterval(dash,12000)}
function auth(){V('<h1>Velos Rider</h1><p class="m">Accept deliveries, see pickup and drop-off details, track your earnings.</p><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="su()">Create a login</button><p id="er" class="m bad"></p></div>')}
async function si(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('er').textContent=r.error.message;else boot()}
async function su(){var pw=$('pw').value;if(pw.length<8){$('er').textContent='Use at least 8 characters.';return}var r=await db.auth.signUp({email:$('em').value.trim(),password:pw});if(r.error){$('er').textContent=r.error.message;return}if(r.data.session)boot();else{$('er').className='m ok';$('er').textContent='Check your email to confirm, then sign in.'}}
async function apply(){var g=function(i){return $(i).value.trim()};if(g('n').length<2||g('p').length<7||g('id').length<5||!g('pn')){$('er').textContent='Please complete the required fields.';return}
  var r=await db.rpc('food_rider_apply',{p_name:g('n'),p_phone:g('p'),p_vehicle:$('vh').value,p_plate:g('pl'),p_id_number:g('id'),p_payout_method:$('pm').value,p_payout_number:g('pn')});if(r.error)$('er').textContent=r.error.message;else V('<div class="c"><h1 class="ok">Application received ✓</h1><p>Our team will review it and link your login.</p><button class="g" onclick="out()">Sign out</button></div>')}
function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function puGet(n){try{return localStorage.getItem('pu_'+n)||''}catch(e){return ''}}
function puSet(n,v){try{if(v)localStorage.setItem('pu_'+n,v);else localStorage.removeItem('pu_'+n)}catch(e){}}
function puStop(n){if(PU[n]&&PU[n].timer)clearInterval(PU[n].timer);delete PU[n];puSet(n,'')}
function puHtml(j){if(['placed','confirmed','preparing','ready'].indexOf(j.status)<0)return '';var st=puGet(j.order_no);
  if(st==='arrived')return '<div class="c" style="border-color:#7fd99a"><b class="ok">✅ You told the restaurant you have arrived.</b><div class="m">Wait for the order to show READY, then tap Picked up.</div></div>';
  if(st==='heading')return '<div class="c" style="border-color:#e8c766"><b class="gold">🛵 The restaurant can see you are on the way.</b><div class="m" id="pe-'+j.order_no+'">'+(PU[j.order_no]&&PU[j.order_no].eta!=null?'About '+PU[j.order_no].eta+' min to arrive.':'')+'</div><button class="full" onclick="puArrive('+j.order_no+')">📍 I have arrived at the restaurant</button></div>';
  return '<button class="full g" onclick="puHead('+j.order_no+','+(+j.pickup_lat||0)+','+(+j.pickup_lng||0)+')">🛵 I am on my way to the restaurant</button>'}
function puPos(){return new Promise(function(ok){if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(function(p){ok({lat:p.coords.latitude,lng:p.coords.longitude})},function(){ok(null)},{enableHighAccuracy:true,timeout:9000,maximumAge:10000})})}
async function puSend(n,stage,lat,lng,eta){var r=await db.rpc('rider_pickup_update',{p_order_no:n,p_stage:stage,p_lat:lat,p_lng:lng,p_eta_min:eta});return r}
async function puHead(n,plat,plng){toast('Getting your location…');var p=await puPos(),eta=null,lat=null,lng=null;
  if(p&&plat&&plng){lat=p.lat;lng=p.lng;eta=Math.max(1,Math.ceil(hav(lat,lng,plat,plng)/20*60))}
  else{var a=prompt('About how many minutes until you reach the restaurant?','10');if(a===null)return;eta=Math.max(1,parseInt(a,10)||10);if(p){lat=p.lat;lng=p.lng}}
  var r=await puSend(n,'heading',lat,lng,eta);if(r.error){toast(/function|schema cache/i.test(r.error.message)?'This feature is being set up by Velos.':r.error.message,true);return}
  puSet(n,'heading');PU[n]={eta:eta,sent:Date.now(),timer:null};
  if(p&&plat&&plng)PU[n].timer=setInterval(async function(){var q=await puPos();if(!q)return;var d=hav(q.lat,q.lng,plat,plng),e=Math.max(0,Math.ceil(d/20*60));if(PU[n])PU[n].eta=e;var el=$('pe-'+n);if(el)el.textContent='About '+e+' min to arrive.';if(d<0.1){puArrive(n,q);return}if(!PU[n]||Date.now()-PU[n].sent>=45000){if(PU[n])PU[n].sent=Date.now();puSend(n,'heading',q.lat,q.lng,e)}},15000);
  toast('The restaurant can now see you are coming');dash()}
async function puArrive(n,q){var r=await puSend(n,'arrived',q?q.lat:null,q?q.lng:null,0);if(r.error){toast(r.error.message,true);return}if(PU[n]&&PU[n].timer)clearInterval(PU[n].timer);if(PU[n])PU[n].timer=null;puSet(n,'arrived');toast('The restaurant knows you have arrived');dash()}
function tm(d){return d?new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'—'}
async function dash(){var x=await Promise.all([db.rpc('rider_jobs'),db.rpc('rider_summary')]);if(x[0].error)return;var J=x[0].data||[],Su=x[1].data||{days:[],unpaid:0,paid:0},today=new Date().toISOString().slice(0,10),td=Su.days.find(function(d){return d.day===today})||{km:0,earned:0,deliveries:0};
  var off=J.filter(function(j){return j.rider_status==='offered'}),act=J.filter(function(j){return j.rider_status==='accepted'&&j.status!=='delivered'&&j.status!=='cancelled'});
  var offNos={};off.forEach(function(j){offNos[j.order_no]=1;if(!OSEEN[j.order_no]){OSEEN[j.order_no]=1;VelosAlerts.alarm('offer-'+j.order_no,{title:'🛵 NEW JOB #'+j.order_no,body:j.vendor+' · '+ugx(j.pay)+' · '+j.distance_km+' km. Open it and accept.',kind:'order',every:6000,btn:'Stop alarm',url:'rider.html'})}});Object.keys(OSEEN).forEach(function(n){if(!offNos[n])VelosAlerts.stop('offer-'+n)});
  var actNos={};act.forEach(function(j){actNos[j.order_no]=1});Object.keys(PU).forEach(function(n){if(!actNos[n])puStop(n)});act.forEach(function(j){if(['out_for_delivery','in_transit','delivered','cancelled'].indexOf(j.status)>-1)puStop(j.order_no)});
  var ready=function(j){if(j.ready_at)return 'Ready since '+tm(j.ready_at);if(!j.ready_by)return 'Restaurant has not confirmed yet';return 'Ready by about '+tm(new Date(new Date(j.ready_by).getTime()+j.delay_extension_min*60000))};
  V('<div class="row"><div><h1>Hello, '+esc(ME.full_name.split(' ')[0])+'</h1></div><button class="g" onclick="out()">Sign out</button></div>'
   +'<div class="stats" style="margin-top:10px"><div class="c stat"><b>'+(+td.km).toFixed(1)+' km</b><span class="m">Ridden today</span></div><div class="c stat"><b>'+ugx(td.earned)+'</b><span class="m">Earned today</span></div><div class="c stat"><b>'+ugx(Su.unpaid)+'</b><span class="m">Balance to be paid</span></div><div class="c stat"><b>'+ugx(Su.paid)+'</b><span class="m">Paid to you</span></div></div>'
   +(off.length?'<h2>🔔 New job offers</h2>'+off.map(function(j){return '<div class="c"><div class="row"><b class="gold">#'+j.order_no+' · '+esc(j.vendor)+'</b><b class="ok">'+ugx(j.pay)+'</b></div><div class="m">'+j.distance_km+' km · '+ready(j)+'</div><div>📍 Pickup: '+esc(j.pickup_address)+'</div><div style="margin-top:8px"><button onclick="resp('+j.order_no+',true)">Accept</button> <button class="g" onclick="resp('+j.order_no+',false)">Decline</button></div></div>'}).join(''):'')
   +'<h2>Active deliveries</h2>'+(act.length?act.map(function(j){var map='https://www.google.com/maps/dir/?api=1&destination='+j.lat+','+j.lng,pm='https://www.google.com/maps/dir/?api=1&destination='+j.pickup_lat+','+j.pickup_lng,nxt={ready:['out_for_delivery','Picked up: start delivery'],out_for_delivery:['in_transit','On the way to customer'],in_transit:['delivered','Delivered ✓']}[j.status];
    return '<div class="c"><div class="row"><b class="gold">#'+j.order_no+'</b><span class="pill">'+esc(j.status.replace(/_/g,' '))+'</span></div><div><b>Pickup:</b> '+esc(j.vendor)+', '+esc(j.pickup_address)+' · <a href="'+pm+'" target="_blank" rel="noopener" style="color:#e8c766">Directions</a></div><div class="m">'+ready(j)+'</div>'+puHtml(j)
     +'<div style="margin-top:6px"><b>Deliver to:</b> '+esc(j.customer_name)+' · <a href="tel:'+esc(j.customer_phone)+'" style="color:#e8c766">'+esc(j.customer_phone)+'</a></div><div>'+esc(j.address)+' · <a href="'+map+'" target="_blank" rel="noopener" style="color:#e8c766">Directions</a></div>'+(j.notes?'<div class="m">Note: '+esc(j.notes)+'</div>':'')
     +'<div class="m">'+j.distance_km+' km · You earn '+ugx(j.pay)+(j.collect?' · <b class="gold">Collect cash: '+ugx(j.collect)+'</b>':' · Paid online, no cash to collect')+'</div>'+(nxt?'<button class="full" onclick="go2('+j.order_no+',\''+nxt[0]+'\')" '+(j.status==='ready'||j.ready_at?'':'disabled')+'>'+nxt[1]+'</button>':'')+(j.status==='confirmed'||j.status==='preparing'||j.status==='placed'?'<div class="m">You can start once the order shows READY.</div>':'')+'</div>'}).join(''):'<div class="c m">No active deliveries. Offers from Velos appear here.</div>')
   +'<h2>Daily earnings</h2><div class="c">'+(Su.days.length?'<table><tr><th>Day</th><th>Deliveries</th><th>Km</th><th>Earned</th></tr>'+Su.days.map(function(d){return '<tr><td>'+d.day+'</td><td>'+d.deliveries+'</td><td>'+(+d.km).toFixed(1)+'</td><td><b>'+ugx(d.earned)+'</b></td></tr>'}).join('')+'</table>':'<span class="m">No completed deliveries yet.</span>')+'</div><p class="m">Pay is UGX 850 per km, credited when an order is delivered and paid out daily by Velos.</p>')}
async function resp(n,a){var r=await db.rpc('rider_respond',{p_order_no:n,p_accept:a});toast(r.error?r.error.message:(a?'Accepted. Customer details unlocked.':'Declined'),!!r.error);dash()}
async function go2(n,s){var r=await db.rpc('rider_set_status',{p_order_no:n,p_status:s});toast(r.error?r.error.message:'Updated',!!r.error);dash()}
boot();
</script></body></html>
