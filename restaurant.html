<!doctype html><html lang="en"><head><script src="velos-splash.js"></script><link rel="manifest" href="manifest-restaurant.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Portal | Velos Foods</title><meta name="robots" content="noindex"><link rel="stylesheet" href="foods.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script></head><body><div class="w" style="max-width:900px"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)},V=function(h){$('v').innerHTML=h},TAB='orders',PT=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},ugx=function(n){return 'UGX '+Math.round(n||0).toLocaleString('en-US')};
function toast(m,b){var t=$('toast');t.textContent=m;t.style.background=b?'#b3261e':'';t.style.color=b?'#fff':'';t.hidden=false;setTimeout(function(){t.hidden=true},2500)}
async function out(){clearInterval(PT);await db.auth.signOut();boot()}
async function boot(){var r=await db.auth.getSession(),s=r.data.session;if(!s)return auth();var m=await db.rpc('vendor_me');
  if(!m.data)return V('<h1>Velos Foods Partner</h1><div class="c"><p>You are signed in as <b>'+esc(s.user.email)+'</b>. This login is not linked to a restaurant yet.</p><h2>Apply to join</h2><input id="n" placeholder="Restaurant name *"><input id="p" type="tel" placeholder="Phone / WhatsApp *"><input id="e" type="email" placeholder="Email"><input id="a" placeholder="Address and area *"><select id="pm"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Bank transfer</option></select><input id="pa" placeholder="Payout number or account *"><textarea id="no" placeholder="Anything we should know (cuisine, opening hours)"></textarea><button class="full" onclick="apply()">Submit application</button><p class="m">Restaurant registration is currently free during the launch pilot. Any commission or other charges will be explained before you join. When approved, we link this login ('+esc(s.user.email)+') to your restaurant.</p><p id="er" class="m bad"></p></div><button class="g" onclick="out()">Sign out</button>');
  if(m.data.status!=='active'){V('<h1>'+esc(m.data.name)+'</h1><div class="c"><p>Your account is <b>'+esc(m.data.status)+'</b>. You will see orders here once Velos approves it.</p></div><div id="fx"></div><button class="g" onclick="out()">Sign out</button>');if(m.data.status==='pending')feeBox('').then(function(h){$('fx').innerHTML=h});return}
  window.ME=m.data;try{var lr=await db.from('food_vendors').select('logo_url').eq('id',ME.id).maybeSingle();if(lr.data&&lr.data.logo_url)ME.logo_url=lr.data.logo_url}catch(e){}show();setTimeout(function(){VelosPWA.prompt()},1500)}
function auth(){V('<h1>Velos Foods Partner</h1><p class="m">For restaurants. Receive orders, manage availability, see payouts.</p><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="su()">Create a login</button><p id="er" class="m bad"></p></div>')}
async function si(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('er').textContent=r.error.message;else boot()}
async function su(){var pw=$('pw').value;if(pw.length<8){$('er').textContent='Use at least 8 characters.';return}var r=await db.auth.signUp({email:$('em').value.trim(),password:pw});if(r.error){$('er').textContent=r.error.message;return}if(r.data.session)boot();else{$('er').className='m ok';$('er').textContent='Check your email to confirm, then sign in.'}}
async function apply(){var g=function(i){return $(i).value.trim()};if(g('n').length<2||g('p').length<7||!g('a')||!g('pa')){$('er').textContent='Please complete the required fields.';return}
  var r=await db.rpc('food_vendor_apply',{p_name:g('n'),p_phone:g('p'),p_email:g('e'),p_address:g('a'),p_payout_method:$('pm').value,p_payout_account:g('pa'),p_notes:g('no')});if(r.error)$('er').textContent=r.error.message;else V('<div class="c"><h1 class="ok">Application received ✓</h1><p>Thank you. Restaurant registration is free during our launch pilot. The Velos team will review your application and contact you.</p></div><button class="g" onclick="out()">Sign out</button>')}
async function feeBox(ph){var q=await db.from('settings').select('key,value').in('key',['site_vendor_reg_fee','site_pay_mtn_number','site_pay_mtn_name','site_pay_airtel_number','site_pay_airtel_name']),P={};(q.data||[]).forEach(function(x){P[x.key]=x.value});var fee=P.site_vendor_reg_fee==null?0:Number(P.site_vendor_reg_fee); if(fee<=0)return '<div class="c"><h2>Free launch registration</h2><p class="m">There is no registration fee during the launch pilot. Your application will be reviewed by the Velos team.</p></div>';
 return '<div class="c"><h2>Registration fee: '+ugx(fee)+' (one time)</h2><p class="m">Pay by mobile money, then enter the transaction reference below. Velos activates your restaurant after confirming the payment.</p><div>MTN: <b>'+esc(P.site_pay_mtn_number||'')+'</b> · '+esc(P.site_pay_mtn_name||'')+'</div><div>Airtel: <b>'+esc(P.site_pay_airtel_number||'')+'</b> · '+esc(P.site_pay_airtel_name||'')+'</div><select id="fm"><option value="mtn">Paid with MTN</option><option value="airtel">Paid with Airtel</option></select><input id="fr" placeholder="Transaction reference / ID *"><input id="fq" type="tel" placeholder="Phone number you registered with *" value="'+esc(ph)+'"><button class="full" onclick="feeSend()">I have paid. Submit</button><p id="fe" class="m"></p></div>'}
async function feeSend(){var r=await db.rpc('food_vendor_fee_submit',{p_phone:$('fq').value.trim(),p_method:$('fm').value,p_ref:$('fr').value.trim()});$('fe').className=r.error?'m bad':'m ok';$('fe').textContent=r.error?r.error.message:'Received ✓ Velos will confirm your payment and activate your restaurant.'}
function show(){V('<div class="row"><div class="brandrow">'+(ME.logo_url?'<img class="vendor-logo" src="'+esc(ME.logo_url)+'" alt="Restaurant logo">':'<div class="vendor-logo empty">🍽</div>')+'<div><h1>'+esc(ME.name)+'</h1><span class="pill">Commission '+ME.commission_pct+'%</span></div></div><button class="g" onclick="out()">Sign out</button></div><div class="tabs" style="margin:10px 0"><button id="t-orders" onclick="tab(\'orders\')">Orders</button><button id="t-menu" onclick="tab(\'menu\')">Menu &amp; availability</button><button id="t-pay" onclick="tab(\'pay\')">Payouts</button><button id="t-profile" onclick="tab(\'profile\')">Restaurant profile</button></div><div id="body"></div>');tab(TAB)}
function tab(t){TAB=t;clearInterval(PT);['orders','menu','pay'].forEach(function(k){$('t-'+k).className=k===t?'on':''});({orders:orders,menu:menu,pay:pay,profile:profile})[t]();if(t==='orders')PT=setInterval(orders,15000)}
async function profile(){
  $('body').innerHTML='<div class="c"><h2>Restaurant profile</h2><p class="m">Upload your restaurant logo here. This can be updated any time without editing website code. Use a square PNG or JPG, ideally with a transparent background.</p><div class="brandrow">'+(ME.logo_url?'<img class="vendor-logo" src="'+esc(ME.logo_url)+'" alt="Current logo">':'<div class="vendor-logo empty">🍽</div>')+'<div><b>'+esc(ME.name)+'</b><div class="m">Current logo</div></div></div><input id="vlogo" type="file" accept="image/png,image/jpeg,image/webp"><button class="full" onclick="saveLogo()">Upload / update logo</button><p id="logoerr" class="m"></p></div>';
}
async function saveLogo(){var f=$('vlogo').files[0];if(!f){$('logoerr').textContent='Choose a logo image first.';return}if(f.size>4*1024*1024){$('logoerr').textContent='Please use an image under 4 MB.';return}var b=$('logoerr');b.textContent='Uploading…';try{var ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'');var path=String(ME.id)+'/'+Date.now()+'.'+ext;var up=await db.storage.from('food-logos').upload(path,f,{upsert:true,contentType:f.type});if(up.error)throw up.error;var url=db.storage.from('food-logos').getPublicUrl(path).data.publicUrl;var r=await db.rpc('vendor_update_logo',{p_logo_url:url});if(r.error)throw r.error;ME.logo_url=url;show();tab('profile');$('logoerr').textContent='Logo updated successfully.'}catch(e){b.textContent='Could not upload logo: '+(e.message||'Check the Velos Supabase setup instructions.')}}
var LAST=-1;
async function acc(n,old){var el=$('pm-'+n),m=el?parseInt(el.value,10):old;if(!(m>=5&&m<=180)){toast('Prep time must be 5 to 180 minutes',true);return}if(m!==old){var p=await db.rpc('vendor_set_order_prep',{p_order_no:n,p_minutes:m});if(p.error){toast(p.error.message,true);return}}st(n,'confirmed')}
async function orders(){if(document.activeElement&&String(document.activeElement.id).indexOf('pm-')===0)return;var r=await db.rpc('vendor_orders');if(r.error){$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}var o=r.data||[],np=o.filter(function(x){return x.status==='placed'&&!x.quote_pending}).length;
  if(LAST>=0&&np>LAST){try{navigator.vibrate&&navigator.vibrate([200,100,200]);new (window.AudioContext||window.webkitAudioContext)().resume()}catch(e){}toast('🔔 New order received');VelosPWA.notify('New order','A new order is waiting for you','restaurant.html')}LAST=np;
  var act=function(x){var a=[];if(x.status==='placed'){a.push(x.quote_pending?'<span class="m">Waiting for Velos delivery quote</span>':'<div class="row"><span class="m">Prep time (minutes)</span><input id="pm-'+x.order_no+'" type="number" min="5" max="180" value="'+x.prep_minutes+'" style="width:80px;margin:0"></div><button onclick="acc('+x.order_no+','+x.prep_minutes+')">Accept &amp; start timer</button><button class="g" onclick="cancel('+x.order_no+')">Reject</button>')}
    if(x.status==='confirmed')a.push('<button onclick="st('+x.order_no+',\'preparing\')">Start preparing</button>');if(x.status==='confirmed'||x.status==='preparing')a.push('<button onclick="st('+x.order_no+',\'ready\')">Mark READY</button><button class="g" onclick="cancel('+x.order_no+')">Cancel</button>');if(x.status==='ready'&&x.fulfilment==='pickup')a.push('<button onclick="st('+x.order_no+',\'collected\')">Mark COLLECTED</button>');return a.join(' ')};
  $('body').innerHTML=o.length?o.map(function(x){var due='';if(x.ready_by&&['confirmed','preparing'].indexOf(x.status)>-1){var rb=new Date(x.ready_by).getTime()+x.delay_extension_min*60000,m=Math.round((rb-Date.now())/60000);due='<div class="'+(m<0?'bad':'gold')+'">⏱ '+(m>=0?m+' min left to be ready':'LATE by '+(-m)+' min')+(x.delay_extension_min?' (includes +'+x.delay_extension_min+' min grace)':'')+'</div>'}
    return '<div class="c"><div class="row"><b class="gold">#'+x.order_no+'</b><span class="pill">'+esc(x.status.replace(/_/g,' '))+'</span></div><div class="m">'+(x.fulfilment==='pickup'?'<b class="gold">PICK-UP</b> · ':'')+esc(x.customer_first)+' · prep time '+x.prep_minutes+' min · '+esc(x.payment_method.replace('_',' '))+'</div>'+x.items.map(function(i){return '<div>'+i.qty+(i.unit==='kg'?' kg':' ×')+' '+esc(i.name)+'</div>'}).join('')+(x.notes?'<div class="m">Note: '+esc(x.notes)+'</div>':'')+due+(x.penalty>0?'<div class="bad">Delay penalty so far: '+ugx(x.penalty)+'</div>':'')+'<div class="m">Order value to you: '+ugx(x.base_total)+(x.rider_status==='accepted'?' · rider assigned':'')+'</div><div style="margin-top:8px">'+act(x)+'</div></div>'}).join(''):'<div class="c m">No orders right now. New orders appear here automatically.</div>'}
async function st(n,s){var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:s});if(r.error)toast(r.error.message,true);else{toast('Updated');orders()}}
async function cancel(n){var why=prompt('Reason? Type 1 = item out of stock, 2 = too busy, 3 = other');if(!why)return;var map={'1':'out_of_stock','2':'busy','3':'other'};if(!map[why])return;if(map[why]==='out_of_stock'&&!confirm('Cancelling after acceptance because an item is out of stock is charged 25% of the order value. Continue?'))return;
  var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:'cancelled',p_reason:map[why]});if(r.error)toast(r.error.message,true);else{toast('Cancelled');orders()}}
async function menu(){var r=await db.rpc('vendor_menu');if(r.error){$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}window.IT=r.data||[];$('body').innerHTML='<div class="m">Choose Available, Temporarily unavailable (still shown, greyed out) or Permanently unavailable (removed from the customer menu). Prices are managed by Velos. Set realistic preparation times: late orders are penalised.</div><input id="mq" placeholder="Search items…" oninput="mf()"><div id="ml"></div>';mf()}
function mf(){var q=($('mq').value||'').toLowerCase(),last='',h='',O=[['available','Available'],['temporary','Temporarily unavailable'],['permanent','Permanently unavailable']];IT.forEach(function(i){if(q&&i.name.toLowerCase().indexOf(q)<0)return;if(i.category!==last){last=i.category;h+='<h2>'+esc(last||'Other')+'</h2>'}
  h+='<div class="c" id="i-'+i.id+'"><div class="row"><b>'+esc(i.name)+'</b></div><div class="row" style="margin-top:6px"><select id="st-'+i.id+'" style="margin:0;flex:1">'+O.map(function(o){return'<option value="'+o[0]+'"'+(i.state===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><input id="pt-'+i.id+'" type="number" min="1" value="'+i.prep+'" style="width:80px;margin:0"><span class="m">min</span><button onclick="sv(\''+i.id+'\')">Save</button></div></div>'});$('ml').innerHTML=h||'<div class="c m">No items yet.</div>'}
async function sv(id){var s=$('st-'+id).value;if(s==='permanent'&&!confirm('This removes the item from the customer menu. Velos can restore it. Continue?'))return;var r=await db.rpc('vendor_set_item',{p_item:String(id),p_state:s,p_prep:parseInt($('pt-'+id).value,10)||20});toast(r.error?r.error.message:'Saved',!!r.error);if(!r.error){var it=IT.find(function(x){return String(x.id)===String(id)});if(it)it.state=s}}
async function pay(){var r=await db.rpc('vendor_statement'),p=r.data||[];$('body').innerHTML='<div class="m">Velos pays you weekly: order value minus the commission and any delay or stock-out penalties.</div>'+(p.length?'<div class="c"><table><tr><th>Period</th><th>Orders</th><th>Gross</th><th>Commission</th><th>Penalties</th><th>Net</th><th>Status</th></tr>'+p.map(function(x){return '<tr><td>'+x.period_start+' → '+x.period_end+'</td><td>'+x.orders_count+'</td><td>'+ugx(x.gross_base_ugx)+'</td><td>'+ugx(x.commission_ugx)+'</td><td>'+ugx(x.penalties_ugx)+'</td><td><b>'+ugx(x.net_ugx)+'</b></td><td><span class="pill">'+x.status+'</span></td></tr>'}).join('')+'</table></div>':'<div class="c m">No statements yet.</div>')}
boot();
</script></body></html>
