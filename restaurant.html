<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)},V=function(h){$('v').innerHTML=h},TAB='orders',PT=null,TKI=null,EX={},SEEN={},LATEW={},SOON={},ARR={},HEAD={};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},ugx=function(n){return 'UGX '+Math.round(n||0).toLocaleString('en-US')};

async function out(){clearInterval(PT);clearInterval(TKI);VelosAlerts.stopAll();await db.auth.signOut();boot()}
async function boot(){var r=await db.auth.getSession(),s=r.data.session;if(!s)return auth();var m=await db.rpc('vendor_me');
  if(!m.data)return V('<h1>Velos Foods Partner</h1><div class="c"><p>You are signed in as <b>'+esc(s.user.email)+'</b>. This login is not linked to a restaurant yet.</p><h2>Apply to join</h2><input id="n" placeholder="Restaurant name *"><input id="own" placeholder="Owner&#39;s full name *" autocomplete="name"><input id="p" type="tel" placeholder="Phone / WhatsApp *"><input id="e" type="email" placeholder="Email"><input id="a" placeholder="Address and area *"><select id="pm"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Bank transfer</option></select><input id="pa" placeholder="Payout number or account *"><textarea id="no" placeholder="Anything we should know (cuisine, opening hours)"></textarea><button class="full" onclick="apply()">Submit application</button><p class="m">A one-time registration fee of UGX 55,000 is paid after you submit (shown on the next screen). Velos also charges a commission on completed orders, manages your menu prices and pays you weekly. When approved, we link this login ('+esc(s.user.email)+') to your restaurant.</p><p id="er" class="m bad"></p></div><button class="g" onclick="out()">Sign out</button>');
  if(m.data.status!=='active'){V('<h1>'+esc(m.data.name)+'</h1><div class="c"><p>Your account is <b>'+esc(m.data.status)+'</b>. You will see orders here once Velos approves it.</p></div><div id="bsx"></div><div id="fx"></div><button class="g" onclick="out()">Sign out</button>');setTimeout(branchBoxFill,50);if(m.data.status==='pending')feeBox('').then(function(h){$('fx').innerHTML=h});return}
  window.ME=m.data;show();setTimeout(function(){VelosPWA.prompt()},1500)}
function auth(){V('<h1>Velos Foods Partner</h1><p class="m">For restaurants. Receive orders, manage availability, see payouts.</p><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="su()">Create a login</button><p id="er" class="m bad"></p></div>')}
async function si(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('er').textContent=r.error.message;else boot()}
async function su(){var pw=$('pw').value;if(pw.length<8){$('er').textContent='Use at least 8 characters.';return}var r=await db.auth.signUp({email:$('em').value.trim(),password:pw});if(r.error){$('er').textContent=r.error.message;return}if(r.data.session)boot();else{$('er').className='m ok';$('er').textContent='Check your email to confirm, then sign in.'}}
async function apply(){var g=function(i){return $(i).value.trim()};if(g('n').length<2||g('own').length<2||g('p').length<7||!g('a')||!g('pa')){$('er').textContent='Please complete the required fields.';return}
  var r=await db.rpc('food_vendor_apply',{p_name:g('n'),p_phone:g('p'),p_email:g('e'),p_address:g('a'),p_payout_method:$('pm').value,p_payout_account:g('pa'),p_notes:('Owner: '+g('own')+(g('no')?' | '+g('no'):''))});if(r.error)$('er').textContent=r.error.message;else feeBox(g('p')).then(function(h){V('<div class="c"><h1 class="ok">Application received ✓</h1><p>Next step: pay the one-time registration fee so Velos can activate your restaurant.</p></div>'+h+'<button class="g" onclick="out()">Sign out</button>')})}
async function feeBox(ph){var q=await db.from('settings').select('key,value').in('key',['site_vendor_reg_fee','site_pay_mtn_number','site_pay_mtn_name','site_pay_airtel_number','site_pay_airtel_name']),P={};(q.data||[]).forEach(function(x){P[x.key]=x.value});var fee=+P.site_vendor_reg_fee||75000;
 return '<div class="c"><h2>Registration fee: '+ugx(fee)+' (one time)</h2><p class="m">Pay by mobile money, then enter the transaction reference below. Velos activates your restaurant after confirming the payment.</p><div>MTN: <b>'+esc(P.site_pay_mtn_number||'')+'</b> · '+esc(P.site_pay_mtn_name||'')+'</div><div>Airtel: <b>'+esc(P.site_pay_airtel_number||'')+'</b> · '+esc(P.site_pay_airtel_name||'')+'</div><select id="fm"><option value="mtn">Paid with MTN</option><option value="airtel">Paid with Airtel</option></select><input id="fr" placeholder="Transaction reference / ID *"><input id="fq" type="tel" placeholder="Phone number you registered with *" value="'+esc(ph)+'"><button class="full" onclick="feeSend()">I have paid. Submit</button><p id="fe" class="m"></p></div>'}
async function feeSend(){var te=VelosTx.check($('fr').value);if(te){$('fe').className='m bad';$('fe').textContent=te;return}var r=await db.rpc('food_vendor_fee_submit',{p_phone:$('fq').value.trim(),p_method:$('fm').value,p_ref:$('fr').value.trim()});$('fe').className=r.error?'m bad':'m ok';$('fe').textContent=r.error?r.error.message:'Received ✓ Velos will confirm your payment and activate your restaurant.'}
function show(){VS.frame({brand:'VELOS FOODS PARTNER',title:ME.name,who:ME.name,pills:'<span class="pill">Commission '+ME.commission_pct+'%</span> <span id="net" class="pill ok">● Online</span>',bodyId:'body',signout:'out()',
  items:[{id:'orders',icon:'🔔',label:'Orders',note:'Live orders and preparation'},{id:'book',icon:'📅',label:'Bookings',note:'Table bookings from customers'},{id:'perf',icon:'📊',label:'Dashboard',short:'Stats',note:'Performance and ratings'},{id:'menu',icon:'🍽️',label:'Menu & availability',short:'Menu',note:'Prices, items, sold out'},{id:'pay',icon:'💳',label:'Payouts & approval',short:'Payouts',note:'Statements and your approval document'},{id:'branch',icon:'🏬',label:'Profile, branches & fees',short:'Branches',note:'Add and switch between your branches'}],
  start:TAB,pick:function(id){tab(id)}});VelosAlerts.init({offlineText:'NO INTERNET. You will NOT receive new orders until you are back online. Check your data or Wi-Fi.',onOnline:function(){if(TAB==='orders')orders()}});try{VelosPush.mount(db)}catch(e){}netChip();clearInterval(BKI);BKI=setInterval(bookAlert,20000);bookAlert();clearInterval(TKI);TKI=setInterval(tick,1000);tab(TAB)}
function netChip(){var n=$('net');if(!n)return;var off=VelosAlerts.isOffline();n.className='pill '+(off?'bad':'ok');n.textContent=off?'● OFFLINE':'● Online'}
window.addEventListener('velos-net',netChip);
function tab(t){TAB=t;clearInterval(PT);VS.active(t);({orders:orders,book:bookings,perf:perf,menu:menu,pay:pay,branch:branches})[t]();if(t==='orders')PT=setInterval(orders,8000);if(t==='book')PT=setInterval(bookings,15000)}
async function acc(n,old){var el=$('pm-'+n),m=el?parseInt(el.value,10):old;if(!(m>=5&&m<=180)){toast('Prep time must be 5 to 180 minutes',true);return}if(m!==old){var p=await db.rpc('vendor_set_order_prep',{p_order_no:n,p_minutes:m});if(p.error){toast(p.error.message,true);return}}st(n,'confirmed')}
function pad2(n){return(n<10?'0':'')+n}
function fmtMS(ms){var t=Math.max(0,Math.round(ms/1000)),m=Math.floor(t/60);return m+':'+pad2(t%60)}
function fmtWords(ms){var t=Math.max(0,Math.round(ms/1000));if(t<60)return t+' second'+(t===1?'':'s');var m=Math.floor(t/60),sc=t%60;return m+' min'+(sc?' '+sc+' sec':'')}
function tick(){var now=Date.now();document.querySelectorAll('.cd').forEach(function(el){var no=el.getAttribute('data-no'),left=+el.getAttribute('data-rb')-now;
    if(left>0){el.className='cd '+(left<=300000?'warn':'gold');el.textContent='⏱ '+fmtMS(left)+' left to get this order ready'+(left<=300000?' · hurry':'')}
    else{el.className='cd bad late';el.textContent='⏰ TIME IS UP · late by '+fmtMS(-left)+'. Mark it ready or call for help.';if(!LATEW[no]){LATEW[no]=1;VelosAlerts.alarm('late-'+no,{title:'⏰ Time is up for order #'+no,body:'Please finish it now or ask Velos for help',kind:'warn',every:8000,btn:'OK'})}}
    if(left>0&&left<=300000&&!SOON[no]){SOON[no]=1;VelosAlerts.beep('info');toast('⏱ 5 minutes left for order #'+no)}});
  document.querySelectorAll('.eta').forEach(function(el){var left=+el.getAttribute('data-eta')-now;el.textContent=left<=0?'any moment now':fmtWords(left)})}
function riderHtml(x){if(x.fulfilment==='pickup')return '<div class="m">🙋 Customer pick-up (no rider)</div>';if(['placed','confirmed','preparing','ready'].indexOf(x.status)<0)return '';var e=EX[x.order_no]||{};
  if(e.rider_status!=='accepted')return '<div class="m">🛵 '+(x.rider_status==='offered'?'Waiting for a rider to accept…':'No rider assigned yet. Velos is arranging one.')+'</div>';
  var nm=esc(e.rider_name||'Your rider');
  if(e.stage==='arrived')return '<div class="rb ok">✅ <b>Rider reached:</b> '+nm+' is at your restaurant. '+(x.status==='ready'?'Hand over the order.':'Press <b>Ready for delivery</b> when the food is ready.')+'</div>';
  if(e.stage==='heading'){var eta=e.eta_at?new Date(e.eta_at).getTime():Date.now(),stale=e.updated_at&&Date.now()-new Date(e.updated_at).getTime()>150000?' <span class="m">(location last updated '+Math.round((Date.now()-new Date(e.updated_at).getTime())/60000)+' min ago)</span>':'';return '<div class="rb gold">🛵 <b>'+nm+'</b> is on the way to you. Reaching you in about <b class="eta" data-eta="'+eta+'">…</b>'+stale+'</div>'}
  return '<div class="rb">🛵 Rider <b>'+nm+'</b> accepted this order and will head to you soon.</div>'}
function orderCard(x){var act=[],no=x.order_no;
  if(x.status==='placed')act.push(x.quote_pending?'<span class="m">Waiting for Velos delivery quote</span>':'<div class="row"><span class="m">Prep time (minutes)</span><input id="pm-'+no+'" type="number" min="5" max="180" value="'+x.prep_minutes+'" style="width:80px;margin:0"></div><button onclick="acc('+no+','+x.prep_minutes+')">Accept &amp; start timer</button><button class="g" onclick="cancel('+no+')">Reject</button>');
  if(x.status==='confirmed')act.push('<button onclick="st('+no+',\'preparing\')">Start preparing</button>');
  if(x.status==='confirmed'||x.status==='preparing')act.push('<button onclick="st('+no+',\'ready\')">'+(x.fulfilment==='pickup'?'✅ Ready for pickup':'✅ Ready for delivery')+'</button><button class="g" onclick="cancel('+no+')">Cancel</button>');
  if(x.status==='ready'&&x.fulfilment==='pickup')act.push('<button onclick="st('+no+',\'collected\')">Mark COLLECTED</button>');
  var cd='';if(x.ready_by&&['confirmed','preparing'].indexOf(x.status)>-1){var rb=new Date(x.ready_by).getTime()+(x.delay_extension_min||0)*60000;cd='<div class="cd gold" data-no="'+no+'" data-rb="'+rb+'">⏱ …</div>'+(x.delay_extension_min?'<div class="m">includes +'+x.delay_extension_min+' min grace</div>':'')}
  return '<div class="c" id="o-'+no+'"><div class="row"><b class="gold">#'+no+'</b><span class="pill">'+esc(x.status.replace(/_/g,' '))+'</span></div><div class="m">'+(x.fulfilment==='pickup'?'<b class="gold">PICK-UP</b> · ':'')+esc(x.customer_first)+' · prep time '+x.prep_minutes+' min · '+esc(String(x.payment_method||'').replace('_',' '))+'</div>'+x.items.map(function(i){return '<div>'+i.qty+(i.unit==='kg'?' kg':' ×')+' '+esc(i.name)+'</div>'}).join('')+(x.notes?'<div class="m">Note: '+esc(x.notes)+'</div>':'')+cd+riderHtml(x)+(x.penalty>0?'<div class="bad">Delay penalty so far: '+ugx(x.penalty)+'</div>':'')+'<div class="m">Order value to you: '+ugx(x.base_total)+'</div><div style="margin-top:8px">'+act.join(' ')+' <button class="g" onclick="help('+no+')">🆘 Need help</button></div></div>'}
async function orders(){if(document.activeElement&&String(document.activeElement.id).indexOf('pm-')===0)return;var r=await db.rpc('vendor_orders');
  if(r.error){if(!VelosAlerts.isOffline()&&!$('body').innerHTML)$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}
  var o=r.data||[];EX={};if(o.length){try{var e=await db.rpc('vendor_order_extras',{p_order_nos:o.map(function(x){return x.order_no})});if(!e.error)(e.data||[]).forEach(function(z){EX[z.order_no]=z})}catch(ex){}}
  var live={};o.forEach(function(x){live[x.order_no]=x;var no=x.order_no,e=EX[no]||{};
    if(x.status==='placed'&&!x.quote_pending&&!SEEN[no]){SEEN[no]=1;VelosAlerts.alarm('new-'+no,{title:'🔔 NEW ORDER #'+no,body:x.items.length+' item(s) · '+x.customer_first+'. Open it and accept.',kind:'order',every:6000,btn:'Stop alarm',url:'restaurant.html'})}
    if(x.status!=='placed')VelosAlerts.stop('new-'+no);
    if(e.stage==='heading'&&!HEAD[no]){HEAD[no]=1;VelosAlerts.beep('info');toast('🛵 '+(e.rider_name||'Rider')+' is on the way for order #'+no)}
    if(e.stage==='arrived'&&!ARR[no]){ARR[no]=1;VelosAlerts.alarm('rider-'+no,{title:'🛵 Rider reached: '+(e.rider_name||'rider'),body:'Order #'+no+'. Press Ready for delivery when the food is ready.',kind:'info',every:15000,btn:'OK'})}});
  Object.keys(LATEW).forEach(function(no){var x=live[no];if(!x||['confirmed','preparing'].indexOf(x.status)<0){VelosAlerts.stop('late-'+no);delete LATEW[no];delete SOON[no]}});
  Object.keys(SEEN).forEach(function(no){if(!live[no]){VelosAlerts.stop('new-'+no);VelosAlerts.stop('rider-'+no)}});
  var g=function(f){return o.filter(f)},nw=g(function(x){return x.status==='placed'}),kit=g(function(x){return x.status==='confirmed'||x.status==='preparing'}).sort(function(a,b){return new Date(a.ready_by||0)-new Date(b.ready_by||0)}),rdy=g(function(x){return['ready','out_for_delivery','in_transit'].indexOf(x.status)>-1}),late=kit.filter(function(x){return x.ready_by&&new Date(x.ready_by).getTime()+(x.delay_extension_min||0)*60000<Date.now()}).length;
  var K=function(v,t,c){return '<div class="c stat"><b'+(c?' class="'+c+'"':'')+'>'+v+'</b><span class="m">'+t+'</span></div>'},sec=function(t,l){return l.length?'<h2>'+t+'</h2>'+l.map(orderCard).join(''):''};
  $('body').innerHTML='<div class="stats">'+K(nw.length,'New (waiting for you)',nw.length?'gold':'')+K(kit.length,'In the kitchen')+K(late,'Late',late?'bad':'')+K(rdy.length,'Ready / on the way')+'</div><div class="m">Updated '+new Date().toLocaleTimeString('en-GB')+' · refreshes automatically</div>'
   +(o.length?sec('🔔 Upcoming: new orders to accept',nw)+sec('👩‍🍳 In the kitchen',kit)+sec('✅ Ready and on the way',rdy)+sec('Other',g(function(x){return nw.indexOf(x)<0&&kit.indexOf(x)<0&&rdy.indexOf(x)<0})):'<div class="c m">No orders right now. New orders appear here automatically and the phone will ring.</div>');tick()}
function wa(p){p=String(p||'').replace(/\D/g,'');if(p.charAt(0)==='0')p='256'+p.slice(1);return 'https://wa.me/'+p}
function help(no){var d=document.createElement('div');d.className='sheet';d.id='hs';d.innerHTML='<div class="bx"><h2>🆘 Need assistance with #'+no+'</h2><p class="m">Tell us what is wrong. Velos is alerted, and you will see the customer\'s number here so you can contact them.</p><select id="hr"><option>Customer not answering</option><option>Customer changed or cancelled</option><option>Item out of stock</option><option>Rider problem</option><option>Payment problem</option><option>Other</option></select><textarea id="hn" rows="2" placeholder="Short note (optional)"></textarea><button class="full" onclick="helpGo('+no+')">Show customer number and alert Velos</button><div id="hx"></div><button class="g full" onclick="$(\'hs\').remove()">Close</button></div>';document.body.appendChild(d)}
async function helpGo(no){var r=await db.rpc('vendor_order_help',{p_order_no:no,p_reason:$('hr').value,p_note:$('hn').value.trim()});if(r.error){$('hx').innerHTML='<p class="bad">'+esc(/function|schema cache/i.test(r.error.message)?'This feature is being set up. Please call Velos support below.':r.error.message)+'</p>'+supHtml(no);return}
  var c=r.data||{};$('hx').innerHTML='<div class="c"><div class="m">Customer</div><b>'+esc(c.customer_name||'')+'</b><div style="margin:6px 0"><a class="b" href="tel:'+esc(c.customer_phone)+'">📞 Call '+esc(c.customer_phone)+'</a> <a class="b g" href="'+wa(c.customer_phone)+'" target="_blank" rel="noopener">💬 WhatsApp</a></div><div class="m ok">Velos has been alerted.</div></div>'+supHtml(no)}
function supHtml(no){return '<a class="b g full" style="display:block;margin-top:8px" href="https://wa.me/256755215751?text='+encodeURIComponent('Hello Velos, restaurant '+ME.name+' needs help with order #'+no)+'" target="_blank" rel="noopener">💬 WhatsApp Velos support</a>'}
var BSEEN={},BKI=null;
async function bookAlert(){try{var r=await db.rpc('vendor_bookings');(r.data||[]).forEach(function(x){if(x.status==='requested'&&!BSEEN[x.booking_no]){BSEEN[x.booking_no]=1;VelosAlerts.alarm('bk-'+x.booking_no,{title:'📅 NEW BOOKING #'+x.booking_no,body:x.customer+' · '+x.party_size+' people. Open Bookings and confirm.',kind:'order',every:7000,btn:'Stop alarm',url:'restaurant.html'})}})}catch(e){}}
async function bookings(){var r=await db.rpc('vendor_bookings');if(r.error){if(!VelosAlerts.isOffline())$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}
  var b=r.data||[];var er=await db.rpc('vendor_commit_earnings'),E=er.data||{days:[],unsettled:0,pending:0};
  var h='<h2>Table bookings</h2><p class="m">Every booking here has already paid a <b>commitment fee</b> to Velos. It counts toward the guest\'s bill, and Velos takes <b>no commission</b> on it: it is added to your earnings for the day once the guest has come (or not come). If you decline or cannot serve a paid booking, Velos refunds the guest and the refund is charged to you as a penalty.</p>'
   +'<div class="c"><b>Commitment fees earned</b><div class="m">Waiting to be paid to you: <b>UGX '+Math.round(E.unsettled||0).toLocaleString('en-US')+'</b> · From confirmed future bookings: UGX '+Math.round(E.pending||0).toLocaleString('en-US')+'</div>'+(E.days&&E.days.length?'<table><tr><th>Day</th><th>Bookings</th><th>Earned</th></tr>'+E.days.slice(0,14).map(function(d){return '<tr><td>'+esc(d.day)+'</td><td>'+d.bookings+'</td><td><b>UGX '+Math.round(d.amount).toLocaleString('en-US')+'</b></td></tr>'}).join('')+'</table>':'<div class="m">No earned commitments yet.</div>')+'</div>';
  if(!b.length)h+='<p class="m">No bookings yet.</p>';
  b.forEach(function(x){var open=x.status==='requested'||x.status==='confirmed',when=new Date(x.booking_at).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Kampala'});
    if(x.status==='requested'&&!BSEEN[x.booking_no]){BSEEN[x.booking_no]=1;try{VelosAlerts.alarm('bk-'+x.booking_no,{title:'📅 NEW BOOKING #'+x.booking_no,body:x.customer+' · '+x.party_size+' people · '+when,kind:'order',every:7000,btn:'Stop alarm',url:'restaurant.html'})}catch(e){}}
    var act='';if(x.status==='requested')act='<button onclick="bk('+x.booking_no+',\'confirmed\')">Confirm table</button> <button class="g" onclick="bkNo('+x.booking_no+',\'declined\')">Decline</button>';
    else if(x.status==='confirmed')act='<button onclick="bk('+x.booking_no+',\'completed\')">Guest arrived / done</button> <button class="g" onclick="bk('+x.booking_no+',\'no_show\')">Did not come</button> <button class="g" onclick="bkNo('+x.booking_no+',\'restaurant_failed\')">We cannot serve</button>';
    h+='<div class="c"><div class="row"><b>#'+x.booking_no+' · '+esc(x.meal)+' · '+x.party_size+' people</b><span class="pill">'+esc(x.status.replace('_',' '))+'</span></div><div>'+when+'</div><div>'+esc(x.customer)+' · <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></div>'+(x.occasion?'<div><span class="pill">🎉 '+esc(x.occasion)+'</span></div>':'')+(x.notes?'<div class="m">📝 '+esc(x.notes)+'</div>':'')
     +(x.items&&x.items.length?'<div class="m"><b>Exact order for '+esc(x.meal)+':</b><br>'+x.items.map(function(i){return i.qty+'× '+esc(i.name)+' · UGX '+Math.round(i.price*i.qty).toLocaleString('en-US')}).join('<br>')+'<br><b>Order total: UGX '+Math.round(x.items_total).toLocaleString('en-US')+'</b></div>':'<div class="m">No dishes chosen. The guest will order at the table.</div>')
     +'<div class="m">'+(x.commit_ugx>0?'<b>Commitment paid to Velos: UGX '+Math.round(x.commit_ugx).toLocaleString('en-US')+'</b>. Deduct it from the final bill'+(x.items_total>0?' (balance to collect for the order: UGX '+Math.round(Math.max(0,x.items_total-x.commit_ugx)).toLocaleString('en-US')+')':'')+'. Velos pays it to you, with no commission.':(x.pay_mode==='advance'?'Paid through Velos: UGX '+Math.round(x.items_total).toLocaleString('en-US'):'Customer pays you at the table'))+'</div>'
     +(x.penalty_ugx>0?'<div class="bad">Penalty: UGX '+Math.round(x.penalty_ugx).toLocaleString('en-US')+' (refund to customer)</div>':'')+(x.status_note?'<div class="m">'+esc(x.status_note)+'</div>':'')+(act?'<div class="row" style="gap:6px;margin-top:6px">'+act+'</div>':'')+'</div>'});
  if(TAB==='book')$('body').innerHTML=h}
async function bk(no,st,note){var r=await db.rpc('vendor_booking_set',{p_no:no,p_status:st,p_note:note||null});if(r.error)return toast(r.error.message,true);try{VelosAlerts.stop('bk-'+no)}catch(e){}toast('Done');bookings()}
function bkNo(no,st){var why=prompt(st==='declined'?'Reason for declining (the customer will see it):':'Why can you not serve this booking? (the customer will see it). A paid booking will be refunded and charged to you as a penalty.');if(why===null)return;bk(no,st,why)}
async function perf(){var r=await db.rpc('vendor_dashboard');if(r.error||!r.data){$('body').innerHTML='<div class="c"><b class="gold">Dashboard</b><p class="m">'+esc(r.error?(/function|schema cache/i.test(r.error.message)?'The dashboard is being set up. Please try again later.':r.error.message):'No data yet.')+'</p></div>';return}
  var d=r.data,n=+d.orders_30d||0,pc=function(a){return n?Math.round(100*a/n):0},tips=[];
  if(n>=3&&pc(d.late_30d)>10)tips.push('⏰ '+d.late_30d+' of '+n+' orders were late ('+pc(d.late_30d)+'%). Set a longer prep time when you accept, and start preparing right away.');
  if(d.avg_prep_min&&d.avg_set_prep&&+d.avg_prep_min>+d.avg_set_prep*1.1)tips.push('⏱ Your orders take about '+d.avg_prep_min+' min on average but you set about '+d.avg_set_prep+' min. Set times closer to the real preparation time.');
  if(n>=3&&pc(d.cancelled_30d)>5)tips.push('❌ '+d.cancelled_30d+' orders were cancelled ('+pc(d.cancelled_30d)+'%). Keep the Menu tab up to date and mark finished items unavailable before customers order them.');
  if(d.avg_rating&&+d.avg_rating<4)tips.push('⭐ Your average rating is '+d.avg_rating+'. Check food quality, packaging and that every item in the order is included.');
  if(!tips.length)tips.push(n?'✅ Great work. Orders are on time and well rated. Keep it up.':'Your tips appear here once you have some orders.');
  var K=function(v,t){return '<div class="c stat"><b>'+v+'</b><span class="m">'+t+'</span></div>'},sc={delivered:'ok',collected:'ok',cancelled:'bad'};
  $('body').innerHTML='<h2>Today</h2><div class="stats">'+K(d.today_orders||0,'Orders today')+K(ugx(d.today_value),'Earned today (delivered)')+'</div><h2>Last 30 days</h2><div class="stats">'+K(n,'Orders')+K(pc(d.delivered_30d)+'%','Completed')+K(pc(d.late_30d)+'%','Late')+K(pc(d.cancelled_30d)+'%','Cancelled')+K(d.avg_prep_min!=null?d.avg_prep_min+' min':'—','Average time to ready')+K(d.avg_rating!=null?d.avg_rating+' ★':'—','Average rating')+K(ugx(d.value_30d),'Order value (delivered)')+'</div>'
   +'<h2>Areas to improve</h2><div class="c">'+tips.map(function(t){return '<div style="margin:6px 0">'+esc(t)+'</div>'}).join('')+'</div>'
   +'<h2>Recent orders</h2>'+((d.recent||[]).length?'<div class="c"><table><tr><th>Order</th><th>Status</th><th>When</th><th>Value</th></tr>'+d.recent.map(function(x){return '<tr><td>#'+esc(x.order_no)+'</td><td><span class="pill '+(sc[x.status]||'')+'">'+esc(String(x.status).replace(/_/g,' '))+'</span>'+(x.late?' <span class="bad">late</span>':'')+'</td><td>'+new Date(x.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+'</td><td>'+ugx(x.amount)+'</td></tr>'}).join('')+'</table></div>':'<div class="c m">No orders yet.</div>')}
async function st(n,s){var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:s});if(r.error)toast(r.error.message,true);else{toast('Updated');orders()}}
async function cancel(n){var why=prompt('Reason? Type 1 = item out of stock, 2 = too busy, 3 = other');if(!why)return;var map={'1':'out_of_stock','2':'busy','3':'other'};if(!map[why])return;if(map[why]==='out_of_stock'&&!confirm('Cancelling after acceptance because an item is out of stock is charged 25% of the order value. Continue?'))return;
  var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:'cancelled',p_reason:map[why]});if(r.error)toast(r.error.message,true);else{toast('Cancelled');orders()}}
async function menu(){var r=await db.rpc('vendor_menu');if(r.error){$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}window.IT=r.data||[];try{var mm=await db.rpc('vendor_item_meals');window.IM=mm.data||{}}catch(e){window.IM={}}$('body').innerHTML='<div class="m">Choose Available, Temporarily unavailable (still shown, greyed out) or Permanently unavailable (removed from the customer menu). Prices are managed by Velos. Set realistic preparation times: late orders are penalised.</div><input id="mq" placeholder="Search items…" oninput="mf()"><div id="ml"></div>';mf()}
function mf(){var q=($('mq').value||'').toLowerCase(),last='',h='',O=[['available','Available'],['temporary','Temporarily unavailable'],['permanent','Permanently unavailable']];IT.forEach(function(i){if(q&&i.name.toLowerCase().indexOf(q)<0)return;if(i.category!==last){last=i.category;h+='<h2>'+esc(last||'Other')+'</h2>'}
  h+='<div class="c" id="i-'+i.id+'"><div class="row"><b>'+esc(i.name)+'</b></div><div class="row" style="margin-top:6px"><select id="st-'+i.id+'" style="margin:0;flex:1">'+O.map(function(o){return'<option value="'+o[0]+'"'+(i.state===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><input id="pt-'+i.id+'" type="number" min="1" value="'+i.prep+'" style="width:80px;margin:0"><span class="m">min</span><button onclick="sv(\''+i.id+'\')">Save</button></div><div class="m" style="margin-top:6px">Served at (for table bookings): '+['breakfast','lunch','dinner'].map(function(m){var t=(window.IM&&window.IM[i.id])||'';return '<label style="margin-right:10px"><input type="checkbox" id="ml-'+m+'-'+i.id+'"'+(!t||t.indexOf(m)>=0?' checked':'')+'> '+m.charAt(0).toUpperCase()+m.slice(1)+'</label>'}).join('')+'</div></div>'});$('ml').innerHTML=h||'<div class="c m">No items yet.</div>'}
async function sv(id){var s=$('st-'+id).value;if(s==='permanent'&&!confirm('This removes the item from the customer menu. Velos can restore it. Continue?'))return;var r=await db.rpc('vendor_set_item',{p_item:String(id),p_state:s,p_prep:parseInt($('pt-'+id).value,10)||20});if(!r.error&&$('ml-lunch-'+id)){var ms=['breakfast','lunch','dinner'].filter(function(m){return $('ml-'+m+'-'+id).checked});var mv=ms.length===3||!ms.length?'':ms.join(',');var r2=await db.rpc('vendor_set_item_meals',{p_item:String(id),p_meals:mv});if(!r2.error){window.IM=window.IM||{};window.IM[id]=mv}}toast(r.error?r.error.message:'Saved',!!r.error);if(!r.error){var it=IT.find(function(x){return String(x.id)===String(id)});if(it)it.state=s}}
async function appDoc(sh){try{var r=await db.rpc('vendor_approval_doc');if(r.error)throw r.error;if(!r.data){toast('Your approval document is not ready yet. Velos creates it when your restaurant is approved.');return}var f=await VelosApproval.build(r.data);if(sh)await VelosApproval.share(f);else VelosApproval.save(f)}catch(e){toast(e.message||'Could not create the document')}}
function pfResize(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej(Error('Could not read the picture'))},'image/jpeg',0.85)};im.onerror=function(){rej(Error('That picture could not be read'))};im.src=u})}
async function pfUp(f,kind){var ss=(await db.auth.getSession()).data.session,b;try{b=await pfResize(f)}catch(e){b=f}var path='vendors/u-'+ss.user.id+'/'+kind+'-'+Date.now()+'.jpg',up=await db.storage.from('food-images').upload(path,b,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;return db.storage.from('food-images').getPublicUrl(path).data.publicUrl}
async function saveProfile(){var e=$('pf-e'),bt=$('pf-b');try{bt.disabled=true;e.className='m';e.textContent='Saving…';var l=$('pf-l').files[0],c=$('pf-c').files[0],lu=l?await pfUp(l,'logo'):null,cu=c?await pfUp(c,'cover'):null;var r=await db.rpc('vendor_save_profile',{p_description:$('pf-d').value,p_logo:lu,p_cover:cu,p_phone:$('pf-p').value,p_address:$('pf-a').value});if(r.error)throw r.error;e.className='m ok';e.textContent='Saved ✓ Your profile is updated.';toast('Saved')}catch(x){e.className='m bad';e.textContent=(/function|schema cache/i.test(x.message||'')?'Velos still needs to switch this on. Please tell Velos support. ':'')+(x.message||'Could not save');}finally{bt.disabled=false}}

  var b=await db.rpc('vendor_branches'),L=b.data||[],f=(await db.rpc('vendor_fee_status')).data||null;

  h='<h2>Restaurant profile</h2><div class="c"><h3>Logo and cover photo</h3><p class="m">Your cover photo and logo are what customers see first. Choose pictures, then tap Save.</p><label class="m">Logo</label><input id="pf-l" type="file" accept="image/*"><label class="m">Cover photo (landscape works best)</label><input id="pf-c" type="file" accept="image/*"><textarea id="pf-d" placeholder="Short description (optional)" rows="2"></textarea><input id="pf-p" type="tel" placeholder="Restaurant phone (optional)"><input id="pf-a" placeholder="Address (optional)"><button class="full" id="pf-b" onclick="saveProfile()">Save profile</button><p id="pf-e" class="m"></p></div>'+h;
  $('body').innerHTML=h}
async function branchBoxFill(){var b=await db.rpc('vendor_branches'),L=(b.data||[]).filter(function(x){return !x.active&&x.status==='active'});var el=$('bsx');if(el&&L.length)el.innerHTML='<div class="c"><b>Your other branches</b>'+L.map(function(x){return '<div class="row"><span>'+esc(x.name)+'</span><button onclick="swBranch(\''+x.id+'\')">Switch</button></div>'}).join('')+'</div>'}
