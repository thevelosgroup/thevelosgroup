<!doctype html><html lang="en"><head><link rel="manifest" href="manifest-restaurant.json"><meta name="theme-color" content="#080d1f"><link rel="apple-touch-icon" href="icon-192.png"><script src="velos-pwa.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Portal | Velos Foods</title><meta name="robots" content="noindex"><link rel="stylesheet" href="foods.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script></head><body><div class="w" style="max-width:900px"><div id="v"><p class="m">Loading…</p></div></div><div id="toast" hidden></div>
<script>
var S=window.VELOS_SUPABASE,db=supabase.createClient(S.url,S.key),$=function(i){return document.getElementById(i)},V=function(h){$('v').innerHTML=h},TAB='orders',PT=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},ugx=function(n){return 'UGX '+Math.round(n||0).toLocaleString('en-US')};
function toast(m,b){var t=$('toast');t.textContent=m;t.style.background=b?'#b3261e':'';t.style.color=b?'#fff':'';t.hidden=false;setTimeout(function(){t.hidden=true},2500)}
async function out(){clearInterval(PT);await db.auth.signOut();boot()}
async function boot(){var r=await db.auth.getSession(),s=r.data.session;if(!s)return auth();var m=await db.rpc('vendor_me');
  if(!m.data)return V('<h1>Velos Foods Partner</h1><div class="c"><p>You are signed in as <b>'+esc(s.user.email)+'</b>. This login is not linked to a restaurant yet.</p><h2>Apply to join (free)</h2><input id="n" placeholder="Restaurant name *"><input id="p" type="tel" placeholder="Phone / WhatsApp *"><input id="e" type="email" placeholder="Email"><input id="a" placeholder="Address and area *"><select id="pm"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Bank transfer</option></select><input id="pa" placeholder="Payout number or account *"><textarea id="no" placeholder="Anything we should know (cuisine, opening hours)"></textarea><button class="full" onclick="apply()">Submit application</button><p class="m">Registration is free. Velos charges a commission on completed orders, manages your menu prices and pays you weekly. When approved, we link this login ('+esc(s.user.email)+') to your restaurant.</p><p id="er" class="m bad"></p></div><button class="g" onclick="out()">Sign out</button>');
  if(m.data.status!=='active')return V('<h1>'+esc(m.data.name)+'</h1><div class="c"><p>Your account is <b>'+esc(m.data.status)+'</b>. You will see orders here once Velos approves it.</p></div><button class="g" onclick="out()">Sign out</button>');
  window.ME=m.data;show();setTimeout(function(){VelosPWA.prompt()},1500)}
function auth(){V('<h1>Velos Foods Partner</h1><p class="m">For restaurants. Receive orders, manage availability, see payouts.</p><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"><button class="full" onclick="si()">Sign in</button><button class="g full" onclick="su()">Create a login</button><p id="er" class="m bad"></p></div>')}
async function si(){var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('er').textContent=r.error.message;else boot()}
async function su(){var pw=$('pw').value;if(pw.length<8){$('er').textContent='Use at least 8 characters.';return}var r=await db.auth.signUp({email:$('em').value.trim(),password:pw});if(r.error){$('er').textContent=r.error.message;return}if(r.data.session)boot();else{$('er').className='m ok';$('er').textContent='Check your email to confirm, then sign in.'}}
async function apply(){var g=function(i){return $(i).value.trim()};if(g('n').length<2||g('p').length<7||!g('a')||!g('pa')){$('er').textContent='Please complete the required fields.';return}
  var r=await db.rpc('food_vendor_apply',{p_name:g('n'),p_phone:g('p'),p_email:g('e'),p_address:g('a'),p_payout_method:$('pm').value,p_payout_account:g('pa'),p_notes:g('no')});if(r.error)$('er').textContent=r.error.message;else V('<div class="c"><h1 class="ok">Application received ✓</h1><p>Our team will review it and link your login. Check back soon.</p><button class="g" onclick="out()">Sign out</button></div>')}
function show(){V('<div class="row"><div><h1>'+esc(ME.name)+'</h1><span class="pill">Commission '+ME.commission_pct+'%</span></div><button class="g" onclick="out()">Sign out</button></div><div class="tabs" style="margin:10px 0"><button id="t-orders" onclick="tab(\'orders\')">Orders</button><button id="t-menu" onclick="tab(\'menu\')">Menu &amp; availability</button><button id="t-pay" onclick="tab(\'pay\')">Payouts</button></div><div id="body"></div>');tab(TAB)}
function tab(t){TAB=t;clearInterval(PT);['orders','menu','pay'].forEach(function(k){$('t-'+k).className=k===t?'on':''});({orders:orders,menu:menu,pay:pay})[t]();if(t==='orders')PT=setInterval(orders,15000)}
var LAST=-1;
async function orders(){var r=await db.rpc('vendor_orders');if(r.error){$('body').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}var o=r.data||[],np=o.filter(function(x){return x.status==='placed'&&!x.quote_pending}).length;
  if(LAST>=0&&np>LAST){try{navigator.vibrate&&navigator.vibrate([200,100,200]);new (window.AudioContext||window.webkitAudioContext)().resume()}catch(e){}toast('🔔 New order received');VelosPWA.notify('New order','A new order is waiting for you','restaurant.html')}LAST=np;
  var act=function(x){var a=[];if(x.status==='placed'){a.push(x.quote_pending?'<span class="m">Waiting for Velos delivery quote</span>':'<button onclick="st('+x.order_no+',\'confirmed\')">Accept &amp; start timer</button><button class="g" onclick="cancel('+x.order_no+')">Reject</button>')}
    if(x.status==='confirmed')a.push('<button onclick="st('+x.order_no+',\'preparing\')">Start preparing</button>');if(x.status==='confirmed'||x.status==='preparing')a.push('<button onclick="st('+x.order_no+',\'ready\')">Mark READY</button><button class="g" onclick="cancel('+x.order_no+')">Cancel</button>');if(x.status==='ready'&&x.fulfilment==='pickup')a.push('<button onclick="st('+x.order_no+',\'collected\')">Mark COLLECTED</button>');return a.join(' ')};
  $('body').innerHTML=o.length?o.map(function(x){var due='';if(x.ready_by&&['confirmed','preparing'].indexOf(x.status)>-1){var rb=new Date(x.ready_by).getTime()+x.delay_extension_min*60000,m=Math.round((rb-Date.now())/60000);due='<div class="'+(m<0?'bad':'gold')+'">⏱ '+(m>=0?m+' min left to be ready':'LATE by '+(-m)+' min')+(x.delay_extension_min?' (includes +'+x.delay_extension_min+' min grace)':'')+'</div>'}
    return '<div class="c"><div class="row"><b class="gold">#'+x.order_no+'</b><span class="pill">'+esc(x.status.replace(/_/g,' '))+'</span></div><div class="m">'+(x.fulfilment==='pickup'?'<b class="gold">PICK-UP</b> · ':'')+esc(x.customer_first)+' · prep time '+x.prep_minutes+' min · '+esc(x.payment_method.replace('_',' '))+'</div>'+x.items.map(function(i){return '<div>'+i.qty+(i.unit==='kg'?' kg':' ×')+' '+esc(i.name)+'</div>'}).join('')+(x.notes?'<div class="m">Note: '+esc(x.notes)+'</div>':'')+due+(x.penalty>0?'<div class="bad">Delay penalty so far: '+ugx(x.penalty)+'</div>':'')+'<div class="m">Order value to you: '+ugx(x.base_total)+(x.rider_status==='accepted'?' · rider assigned':'')+'</div><div style="margin-top:8px">'+act(x)+'</div></div>'}).join(''):'<div class="c m">No orders right now. New orders appear here automatically.</div>'}
async function st(n,s){var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:s});if(r.error)toast(r.error.message,true);else{toast('Updated');orders()}}
async function cancel(n){var why=prompt('Reason? Type 1 = item out of stock, 2 = too busy, 3 = other');if(!why)return;var map={'1':'out_of_stock','2':'busy','3':'other'};if(!map[why])return;if(map[why]==='out_of_stock'&&!confirm('Cancelling after acceptance because an item is out of stock is charged 25% of the order value. Continue?'))return;
  var r=await db.rpc('vendor_set_status',{p_order_no:n,p_status:'cancelled',p_reason:map[why]});if(r.error)toast(r.error.message,true);else{toast('Cancelled');orders()}}
async function menu(){var r=await db.rpc('vendor_items');var it=r.data||[],last='';$('body').innerHTML='<div class="m">Switch items off when they run out. Prices are managed by Velos. Set realistic preparation times: late orders are penalised.</div><input id="mq" placeholder="Search items…" oninput="mf()"><div id="ml"></div>';window.IT=it;mf()}
function mf(){var q=($('mq').value||'').toLowerCase(),last='',h='';IT.forEach(function(i){if(q&&i.name.toLowerCase().indexOf(q)<0)return;if(i.category!==last){last=i.category;h+='<h2>'+esc(last||'Other')+'</h2>'}
  h+='<div class="c row" id="i-'+i.id+'"><span><b>'+esc(i.name)+'</b></span><span class="row"><label class="m"><input type="checkbox" '+(i.available?'checked':'')+' style="width:auto" onchange="sv(\''+i.id+'\')"> Available</label><input id="pt-'+i.id+'" type="number" min="1" value="'+i.prep+'" style="width:80px;margin:0"><span class="m">min</span><button class="g" onclick="sv(\''+i.id+'\')">Save</button></span></div>'});$('ml').innerHTML=h}
async function sv(id){var el=$('i-'+id),r=await db.rpc('vendor_update_item',{p_item:id,p_available:el.querySelector('input[type=checkbox]').checked,p_prep:parseInt($('pt-'+id).value,10)});toast(r.error?r.error.message:'Saved',!!r.error)}
async function pay(){var r=await db.rpc('vendor_statement'),p=r.data||[];$('body').innerHTML='<div class="m">Velos pays you weekly: order value minus the commission and any delay or stock-out penalties.</div>'+(p.length?'<div class="c"><table><tr><th>Period</th><th>Orders</th><th>Gross</th><th>Commission</th><th>Penalties</th><th>Net</th><th>Status</th></tr>'+p.map(function(x){return '<tr><td>'+x.period_start+' → '+x.period_end+'</td><td>'+x.orders_count+'</td><td>'+ugx(x.gross_base_ugx)+'</td><td>'+ugx(x.commission_ugx)+'</td><td>'+ugx(x.penalties_ugx)+'</td><td><b>'+ugx(x.net_ugx)+'</b></td><td><span class="pill">'+x.status+'</span></td></tr>'}).join('')+'</table></div>':'<div class="c m">No statements yet.</div>')}
boot();
</script></body></html>
